<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Comparatives</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "29",
  title: "Comparatives & Superlatives nâng cao",
  sub: "Giai đoạn 3 · 30 phút · much/far + so sánh hơn, the more… the more, twice as… as",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 28", title: "Warm-up",
      items: [
        { q: "I had my car ___ yesterday.", opts: ["washed", "wash"], a: 0, why: "have sth + V3.", tag: "causative" },
        { q: "She got her sister ___ her homework.", opts: ["to check", "check"], a: 0, why: "get sb + to V.", tag: "causative" },
        { q: "We're having a new kitchen ___.", opts: ["installed", "install"], a: 0, why: "have sth + V3.", tag: "causative" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "So sánh có mức độ", html: `
      <p>Ở B1 bạn biết <i>bigger than, the biggest</i>. Ở B2, bạn cần nói <b>hơn bao nhiêu</b> và <b>thay đổi thế nào</b>.</p>
      <table>
        <tr><th>Ý muốn nói</th><th>Cấu trúc</th><th>Ví dụ</th></tr>
        <tr><td>Hơn <b>nhiều</b></td><td><b>much / far / a lot</b> + so sánh hơn</td><td>Hanoi is <em class="g">much bigger</em> than my town.</td></tr>
        <tr><td>Hơn <b>một chút</b></td><td><b>a bit / slightly / a little</b> + so sánh hơn</td><td>Prices are <em class="g">slightly higher</em>.</td></tr>
        <tr><td>Càng… càng…</td><td><b>the + so sánh hơn…, the + so sánh hơn…</b></td><td><em class="g">The more</em> you practise, <em class="g">the better</em> you get.</td></tr>
        <tr><td>Ngày càng…</td><td><b>so sánh hơn + and + so sánh hơn</b></td><td>It's getting <em class="g">colder and colder</em>. / <em class="g">more and more</em> popular</td></tr>
        <tr><td>Gấp… lần</td><td><b>twice / three times + as … as</b></td><td>This is <em class="g">twice as expensive as</em> that.</td></tr>
        <tr><td>Không bằng</td><td><b>not as … as</b></td><td>My English <em class="g">isn't as good as</em> yours.</td></tr>
        <tr><td>Nhất, bỏ xa</td><td><b>by far + the + so sánh nhất</b></td><td>She's <em class="g">by far the best</em> student.</td></tr>
      </table>
      <div class="warn"><b>Lỗi thường gặp:</b><br>
        <s>more easier</s> → easier (không dùng 2 lần so sánh)<br>
        <s>very bigger</s> → much bigger (very không đi với so sánh hơn)<br>
        <s>The more you study, you learn more.</s> → The more you study, <b>the more</b> you learn.</div>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["very bigger?", "✘ → much / far bigger"],
        ["càng… càng…", "The sooner, the better."],
        ["ngày càng nóng", "hotter and hotter"],
        ["gấp đôi giá", "twice as expensive as"],
        ["bỏ xa nhất", "by far the best"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "Hanoi is ___ bigger than my hometown.", opts: ["much", "very", "more"], a: 0, why: "much + so sánh hơn." },
        { q: "The ___ you practise, the better you get.", opts: ["more", "most", "much"], a: 0, why: "The more…, the better…" },
        { q: "It's getting ___.", opts: ["colder and colder", "more cold", "colder and more cold"], a: 0, why: "-er and -er." },
        { q: "This phone is ___ expensive as that one.", opts: ["twice as", "two times more", "twice more"], a: 0, why: "twice as … as." },
        { q: "She is ___ the best student in the class.", opts: ["by far", "very", "much more"], a: 0, why: "by far + the + so sánh nhất." },
        { q: "My English isn't ___ good as yours.", opts: ["as", "so much", "more"], a: 0, why: "not as … as." },
        { q: "Which sentence is WRONG?", opts: ["This test is more easier.", "This test is a bit easier.", "This test is far easier."], a: 0, why: "easier đã là so sánh hơn → không thêm more." },
        { q: "The older he gets, ___.", opts: ["the wiser he becomes", "he becomes wiser", "wiser he becomes"], a: 0, why: "Vế 2 cũng phải có the + so sánh hơn." },
        { q: "Prices are ___ higher than last year.", opts: ["slightly", "very", "so"], a: 0, why: "slightly + so sánh hơn = hơn một chút." },
      ] },

    { type: "typed", key: "T", time: "6 phút · Viết lại câu", title: "Viết lại câu",
      items: [
        { q: "If you study more, you will learn more. <i>(The more…)</i>", ans: ["The more you study, the more you learn.", "The more you study, the more you will learn."], why: "The more…, the more…" },
        { q: "My car is cheaper than yours. <i>(not as … as)</i>", ans: ["My car is not as expensive as yours.", "My car isn't as expensive as yours."], why: "cheaper than = not as expensive as." },
        { q: "The traffic is getting worse all the time. <i>(… and …)</i>", ans: ["The traffic is getting worse and worse."], why: "worse and worse." },
        { q: "When it gets hotter, I feel more tired. <i>(The hotter…)</i>", ans: ["The hotter it gets, the more tired I feel.", "The hotter it gets, the more tired I get."], why: "The + so sánh hơn + S + V." },
        { q: "No other city in Vietnam is as big as Ho Chi Minh City. <i>(by far)</i>", ans: ["Ho Chi Minh City is by far the biggest city in Vietnam.", "Ho Chi Minh City is by far the largest city in Vietnam."], why: "by far the + so sánh nhất." },
      ] },

    { type: "order", key: "O", time: "3 phút · Sắp xếp", title: "Sắp xếp thành câu đúng",
      items: [
        { words: "The sooner|we leave,|the earlier|we will|arrive", why: "The + -er…, the + -er…" },
        { words: "English|is getting|more and more|popular|in Vietnam", why: "more and more + tính từ dài." },
        { words: "This book|is|far|more interesting|than|the film", why: "far + so sánh hơn." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Bạn bây giờ vs 5 năm trước",
      hint: "4 câu: <b>much/far + so sánh hơn</b> · <b>the…, the…</b> · <b>-er and -er / more and more</b> · <b>not as … as</b>.",
      placeholder: "1. My life is much busier than ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
