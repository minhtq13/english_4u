<title>Participle Clauses</title>

<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "31",
  title: "Participle Clauses — rút gọn mệnh đề trạng ngữ",
  sub: "Giai đoạn 3 · 30 phút · V-ing / Having + V3 / V3",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 30", title: "Warm-up",
      items: [
        { q: "___ being tired, he kept working.", opts: ["Despite", "Although"], a: 0, why: "+ V-ing → Despite.", tag: "linking" },
        { q: "I left early ___ avoid the traffic.", opts: ["to", "so that"], a: 0, why: "+ V → to.", tag: "purpose" },
        { q: "Lan likes tea, ___ her husband prefers coffee.", opts: ["whereas", "however"], a: 0, why: "Nối 2 vế trong 1 câu → whereas.", tag: "linking" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Câu gọn hơn khi 2 vế CÙNG chủ ngữ", html: `
      <p>Khi 2 vế có <b>cùng chủ ngữ</b>, có thể bỏ liên từ + chủ ngữ ở vế phụ và đổi động từ thành phân từ. Câu sẽ gọn và "học thuật" hơn.</p>
      <table>
        <tr><th>Dạng</th><th>Ý nghĩa</th><th>Ví dụ</th></tr>
        <tr><td><b>V-ing</b></td><td>Chủ động · cùng lúc / lý do</td><td><s>Because I felt</s> <em class="g">Feeling</em> tired, I went to bed.</td></tr>
        <tr><td><b>Having + V3</b></td><td>Chủ động · xảy ra <b>trước</b></td><td><s>After I had finished</s> <em class="g">Having finished</em> my work, I went home.</td></tr>
        <tr><td><b>V3</b></td><td><b>Bị động</b></td><td><s>The house was built in 1900. It…</s> <em class="g">Built</em> in 1900, the house…</td></tr>
        <tr><td><b>Not + V-ing</b></td><td>Phủ định</td><td><em class="g">Not knowing</em> what to do, I called my mum.</td></tr>
      </table>
      <div class="warn"><b>Lỗi "chủ ngữ treo" (dangling participle):</b> chủ ngữ của vế chính PHẢI là người/vật làm hành động ở vế phân từ.<br>
        <s>Walking to school, the rain started.</s> → Cơn mưa đi bộ đến trường?! ✘<br>
        <b>Walking to school, I</b> got caught in the rain. ✔</div>
      <div class="box"><b>Liên hệ bài 20:</b> rút gọn mệnh đề quan hệ cũng theo logic này — chủ động → V-ing, bị động → V3.</div>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["V-ing", "chủ động, cùng lúc / lý do"],
        ["Having + V3", "chủ động, xảy ra trước"],
        ["V3", "bị động"],
        ["Not + V-ing", "phủ định"],
        ["Điều kiện bắt buộc", "2 vế CÙNG chủ ngữ"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "___ tired, I went to bed early.", opts: ["Feeling", "Felt", "Having felt"], a: 0, why: "Lý do, chủ động → V-ing." },
        { q: "___ my homework, I watched TV.", opts: ["Finishing", "Having finished", "Finished"], a: 1, why: "Làm xong rồi mới xem TV → Having + V3." },
        { q: "___ in 1902, the bridge is over 100 years old.", opts: ["Building", "Built", "Having built"], a: 1, why: "Cây cầu được xây → bị động → V3." },
        { q: "___ the news, she started to cry.", opts: ["Hearing", "Heard", "Being heard"], a: 0, why: "Cô ấy nghe (chủ động) → V-ing." },
        { q: "Not ___ what to do, I called my mother.", opts: ["knowing", "known", "know"], a: 0, why: "Not + V-ing." },
        { q: "___ by his teacher, he worked harder.", opts: ["Encouraging", "Encouraged", "Having encouraged"], a: 1, why: "Anh ấy được khuyến khích → V3." },
        { q: "Which sentence is CORRECT?", opts: ["Walking to school, the rain started.", "Walking to school, I got caught in the rain.", "Walked to school, I got caught in the rain."], a: 1, why: "Chủ ngữ 'I' là người đi bộ." },
        { q: "___ in Hanoi for 10 years, he knows the city very well.", opts: ["Living", "Having lived", "Lived"], a: 1, why: "Đã sống 10 năm (trước) → biết rõ (sau) → Having + V3." },
      ] },

    { type: "typed", key: "T", time: "6 phút · Viết lại câu", title: "Rút gọn câu",
      items: [
        { q: "Because I didn't have any money, I couldn't buy the ticket.", ans: ["Not having any money, I couldn't buy the ticket.", "Not having money, I couldn't buy the ticket.", "Having no money, I couldn't buy the ticket.", "Not having any money, I could not buy the ticket."], why: "Phủ định → Not + V-ing." },
        { q: "After she had locked the door, she went to bed.", ans: ["Having locked the door, she went to bed."], why: "Xảy ra trước → Having + V3." },
        { q: "The book was written in 1950. It is still popular today.", ans: ["Written in 1950, the book is still popular today."], why: "Bị động → V3." },
        { q: "While I was walking in the park, I saw an old friend.", ans: ["Walking in the park, I saw an old friend.", "While walking in the park, I saw an old friend."], why: "Cùng lúc → V-ing." },
        { q: "As he felt hungry, he made a sandwich.", ans: ["Feeling hungry, he made a sandwich."], why: "Lý do → V-ing." },
      ] },

    { type: "order", key: "O", time: "3 phút · Sắp xếp", title: "Sắp xếp thành câu đúng",
      items: [
        { words: "Having lost|my keys,|I had to|call|a locksmith", why: "Having + V3: mất chìa trước, gọi thợ sau." },
        { words: "Made|in Italy,|these shoes|are|very expensive", why: "Giày được làm → V3." },
        { words: "Seeing|the police,|the thief|ran away", why: "Tên trộm thấy (chủ động) → V-ing." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Một ngày của bạn",
      hint: "4 câu kể về một ngày gần đây, dùng: <b>V-ing</b> · <b>Having + V3</b> · <b>V3</b> (bị động) · <b>Not + V-ing</b>. Kiểm tra: chủ ngữ vế chính có đúng là người làm hành động không?",
      placeholder: "1. Having finished breakfast, I ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
