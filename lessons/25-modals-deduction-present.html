<main id="app"></main>
<script>
window.LESSON = {
  id: "25",
  title: "Modals of Deduction — suy luận ở hiện tại",
  sub: "Giai đoạn 2 · 30 phút · must / might / may / could / can't",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 24", title: "Warm-up",
      items: [
        { q: "You ___ pay for the museum — it's free.", opts: ["don't have to", "mustn't"], a: 0, why: "Không cần.", tag: "mustn't vs don't have to" },
        { q: "Passengers ___ use phones during take-off.", opts: ["mustn't", "don't have to"], a: 0, why: "Cấm.", tag: "mustn't vs don't have to" },
        { q: "Although the exam was hard, I ___ pass it.", opts: ["was able to", "could"], a: 0, why: "Làm được 1 lần cụ thể.", tag: "could vs was able to" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Từ bằng chứng → kết luận", html: `
      <p>Ở bài trước, must = bắt buộc. Ở bài này, must/can't/might dùng để <b>đoán</b> dựa trên bằng chứng. Mức độ chắc chắn:</p>
      <table>
        <tr><th>Mức độ</th><th>Từ</th><th>Ví dụ</th></tr>
        <tr><td>~95% chắc chắn ĐÚNG</td><td><b>must</b></td><td>He's been running for an hour. He <em class="g">must be</em> tired.</td></tr>
        <tr><td>~50% có thể</td><td><b>might / may / could</b></td><td>She isn't answering. She <em class="g">might be</em> asleep.</td></tr>
        <tr><td>~95% chắc chắn KHÔNG</td><td><b>can't</b></td><td>That <em class="g">can't be</em> Tom. He's in London.</td></tr>
      </table>
      <div class="warn"><b>Lỗi thường gặp:</b><br>
        ① Phủ định của <b>must</b> (suy luận) là <b>can't</b>, không phải mustn't:<br>
        <s>He mustn't be at home.</s> → He <b>can't</b> be at home.<br>
        ② Đoán "có thể" ở dạng khẳng định dùng <b>might/may/could</b>, không dùng can:<br>
        <s>It can be true.</s> → It <b>might</b> be true.</div>
      <div class="box">Đoán việc <b>đang diễn ra</b>: modal + <b>be + V-ing</b><br>
        The lights are on. They <em class="g">must be watching</em> TV.</div>
      <p><b>Logic:</b> luôn nêu được <i>bằng chứng</i> (vì sao bạn nghĩ vậy) → câu suy luận mới tự nhiên và thuyết phục.</p>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["must be", "chắc chắn là (~95%)"],
        ["can't be", "chắc chắn không phải"],
        ["might / may / could be", "có thể là (~50%)"],
        ["mustn't be?", "✘ không dùng để suy luận → can't be"],
        ["Đang làm gì?", "must be + V-ing<br><i>She must be sleeping.</i>"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "She's been working for 12 hours. She ___ be exhausted.", opts: ["must", "can't", "mustn't"], a: 0, why: "Bằng chứng mạnh → must." },
        { q: "That ___ be Tom. He's in London now.", opts: ["can't", "must", "might"], a: 0, why: "Bằng chứng anh ấy ở chỗ khác → can't." },
        { q: "Someone is knocking. It ___ be the postman, or maybe my neighbour.", opts: ["might", "must", "can't"], a: 0, why: "Chưa chắc, có 2 khả năng → might." },
        { q: "He drives a Ferrari. He ___ be rich.", opts: ["must", "can't", "might not"], a: 0, why: "Bằng chứng mạnh → must." },
        { q: "The lights are off. They ___ be at home.", opts: ["mustn't", "can't", "must"], a: 1, why: "Chắc chắn không → can't (không dùng mustn't)." },
        { q: "Where's Lan? — I'm not sure. She ___ be in the library.", opts: ["could", "must", "can't"], a: 0, why: "Không chắc → could." },
        { q: "Listen! Someone ___ in the bathroom.", opts: ["must sing", "must be singing", "can't sing"], a: 1, why: "Đang diễn ra → must be + V-ing." },
        { q: "Which sentence is WRONG?", opts: ["He might be ill.", "He mustn't be at home — his car isn't here.", "He can't be at home."], a: 1, why: "Suy luận phủ định → can't, không phải mustn't." },
      ] },

    { type: "typed", key: "G", short: true, time: "4 phút · Điền từ", title: "Điền must / might / can't",
      hint: "Chỉ gõ 1 từ.",
      items: [
        { q: "You've just eaten a big pizza. You ___ be hungry!", ans: ["can't", "cannot"], why: "Vừa ăn xong → chắc chắn không đói." },
        { q: "Her eyes are red and she's holding a tissue. She ___ be sad.", ans: ["must"], why: "Bằng chứng mạnh." },
        { q: "I don't know where my keys are. They ___ be in the car.", ans: ["might", "may", "could"], why: "Không chắc." },
        { q: "That bag costs only $5. It ___ be real leather.", ans: ["can't", "cannot"], why: "Quá rẻ → chắc chắn không phải da thật." },
        { q: "Everyone is wearing coats. It ___ be cold outside.", ans: ["must"], why: "Bằng chứng mạnh." },
      ] },

    { type: "typed", key: "T", time: "5 phút · Viết lại câu", title: "Viết lại bằng modal suy luận",
      items: [
        { q: "I'm sure he is at work.", ans: ["He must be at work."], why: "I'm sure → must." },
        { q: "I'm sure it isn't true.", ans: ["It can't be true.", "It cannot be true."], why: "I'm sure ... not → can't." },
        { q: "Perhaps she is sleeping.", ans: ["She might be sleeping.", "She may be sleeping.", "She could be sleeping."], why: "Perhaps → might + be + V-ing." },
        { q: "I'm sure they are watching TV.", ans: ["They must be watching TV."], why: "must + be + V-ing." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Làm thám tử",
      hint: "Nghĩ về một người bạn biết hoặc một tình huống quanh bạn. Viết 4 câu suy luận với <b>must</b>, <b>can't</b>, <b>might</b>, <b>must be + V-ing</b> — mỗi câu kèm <b>bằng chứng</b> (because…).",
      placeholder: "1. My neighbour must be ... because ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
