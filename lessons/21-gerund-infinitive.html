<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerund vs Infinitive</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "21",
  title: "Gerund vs Infinitive — V-ing hay to V?",
  sub: "Giai đoạn 1 · 30 phút · enjoy doing / decide to do / stop, remember, try",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 20", title: "Warm-up",
      items: [
        { q: "The boy ___ in the corner is my son.", opts: ["standing", "stood", "stands"], a: 0, why: "Chủ động → V-ing.", tag: "reduced RC" },
        { q: "The bridge ___ last year is already damaged.", opts: ["built", "building", "was built"], a: 0, why: "Bị động → V3.", tag: "reduced RC" },
        { q: "This is the flat ___ I lived for two years.", opts: ["in which", "which", "in that"], a: 0, why: "live in the flat → in which.", tag: "preposition + which" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Khi nào V-ing, khi nào to V?", html: `
      <p><b>Logic chung (không tuyệt đối nhưng rất hữu ích):</b> <b>to V</b> thường hướng về <i>tương lai / mục đích</i> (want, plan, decide — việc chưa xảy ra). <b>V-ing</b> thường nói về <i>hoạt động nói chung / đã, đang trải qua</i> (enjoy, finish, avoid).</p>
      <table>
        <tr><th>+ V-ing</th><th>+ to V</th></tr>
        <tr><td>enjoy, mind, avoid, finish, keep, suggest, consider, practise, give up, can't stand</td>
            <td>want, decide, plan, hope, agree, refuse, promise, manage, afford, learn, would like</td></tr>
        <tr><td><b>Sau giới từ</b>: interested in <em class="g">doing</em>, good at <em class="g">cooking</em>, thank you for <em class="g">helping</em></td>
            <td><b>Sau tính từ</b>: easy <em class="g">to learn</em>, happy <em class="g">to help</em><br><b>Mục đích</b>: I came <em class="g">to see</em> you.</td></tr>
      </table>
      <div class="warn"><b>Bẫy:</b> look forward <b>to</b>, be used <b>to</b>, object <b>to</b> — "to" ở đây là GIỚI TỪ → + V-ing.<br>
        I look forward to <s>hear</s> <b>hearing</b> from you.</div>
      <h3>Động từ đổi nghĩa</h3>
      <table>
        <tr><th>Động từ</th><th>+ V-ing</th><th>+ to V</th></tr>
        <tr><td>stop</td><td>ngừng hẳn việc đó<br><i>stop smoking</i></td><td>dừng lại <b>để</b> làm việc khác<br><i>stop to buy bread</i></td></tr>
        <tr><td>remember / forget</td><td>nhớ/quên việc <b>đã làm</b><br><i>I remember meeting her.</i></td><td>nhớ/quên việc <b>cần làm</b><br><i>Remember to lock the door.</i></td></tr>
        <tr><td>try</td><td>thử một cách xem có hiệu quả<br><i>try restarting it</i></td><td>cố gắng (khó)<br><i>try to lift the box</i></td></tr>
        <tr><td>regret</td><td>hối hận đã làm<br><i>I regret saying that.</i></td><td>lấy làm tiếc phải báo<br><i>We regret to inform you...</i></td></tr>
      </table>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["enjoy / avoid / finish", "+ V-ing<br><i>I avoid eating late.</i>"],
        ["want / decide / plan", "+ to V<br><i>We plan to travel.</i>"],
        ["look forward to", "+ V-ing (to là giới từ)"],
        ["stop doing vs stop to do", "ngừng hẳn vs dừng lại để làm"],
        ["remember doing vs to do", "nhớ đã làm vs nhớ phải làm"],
        ["try doing vs try to do", "thử cách khác vs cố gắng"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "I enjoy ___ to music while I work.", opts: ["listening", "to listen", "listen"], a: 0, why: "enjoy + V-ing." },
        { q: "We decided ___ a new car.", opts: ["buying", "to buy", "buy"], a: 1, why: "decide + to V." },
        { q: "I'm looking forward to ___ you.", opts: ["see", "seeing", "to see"], a: 1, why: "look forward to (giới từ) + V-ing." },
        { q: "He stopped ___ because it was bad for his health.", opts: ["smoking", "to smoke"], a: 0, why: "Ngừng hẳn thói quen → stop + V-ing." },
        { q: "On the way home, I stopped ___ some bread.", opts: ["buying", "to buy"], a: 1, why: "Dừng lại ĐỂ mua → stop + to V." },
        { q: "Remember ___ the door when you leave.", opts: ["locking", "to lock"], a: 1, why: "Việc cần làm trong tương lai → to V." },
        { q: "I remember ___ this film when I was a child.", opts: ["watching", "to watch"], a: 0, why: "Nhớ việc đã làm → V-ing." },
        { q: "My laptop wouldn't start, so I tried ___ it.", opts: ["restarting", "to restart"], a: 0, why: "Thử một cách xem có hiệu quả không → try + V-ing." },
        { q: "She is interested in ___ abroad.", opts: ["study", "studying", "to study"], a: 1, why: "Sau giới từ in → V-ing." },
        { q: "Would you mind ___ the window?", opts: ["to open", "opening", "open"], a: 1, why: "mind + V-ing." },
      ] },

    { type: "typed", key: "G", short: true, time: "5 phút · Điền từ", title: "Chia động từ trong ngoặc",
      hint: "Chỉ gõ phần điền vào chỗ trống.",
      items: [
        { q: "I can't afford ___ (buy) a new phone.", ans: ["to buy"], why: "afford + to V." },
        { q: "She avoided ___ (answer) my question.", ans: ["answering"], why: "avoid + V-ing." },
        { q: "He promised ___ (not / be) late again.", ans: ["not to be"], why: "promise + not to V." },
        { q: "It's difficult ___ (learn) Chinese characters.", ans: ["to learn"], why: "Sau tính từ → to V." },
        { q: "They suggested ___ (go) to the beach.", ans: ["going"], why: "suggest + V-ing." },
        { q: "I regret ___ (not / study) harder at school.", ans: ["not studying", "not having studied"], why: "Hối hận việc đã (không) làm → V-ing." },
        { q: "We managed ___ (finish) the project on time.", ans: ["to finish"], why: "manage + to V." },
        { q: "Thank you for ___ (help) me.", ans: ["helping"], why: "Sau giới từ for → V-ing." },
      ] },

    { type: "typed", key: "E", time: "4 phút · Sửa lỗi", title: "Sửa lỗi sai",
      items: [
        { q: "I want learning English to get a better job.", ans: ["I want to learn English to get a better job."], why: "want + to V." },
        { q: "She is good at cook Vietnamese food.", ans: ["She is good at cooking Vietnamese food.", "She's good at cooking Vietnamese food."], why: "good at + V-ing." },
        { q: "He refused helping me.", ans: ["He refused to help me."], why: "refuse + to V." },
        { q: "I look forward to hear from you.", ans: ["I look forward to hearing from you."], why: "look forward to + V-ing." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Viết về bản thân",
      hint: "4 câu: điều bạn <b>enjoy</b> làm · điều bạn <b>decided</b> làm năm nay · điều bạn đã <b>stopped</b> làm · điều bạn phải <b>remember</b> làm.",
      placeholder: "1. I enjoy ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
