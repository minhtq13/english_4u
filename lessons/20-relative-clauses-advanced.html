<!doctype html>
<html lang="vi">
<head>

<title>Relative Clauses Advanced</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "20",
  title: "Relative Clauses nâng cao — rút gọn & giới từ",
  sub: "Giai đoạn 1 · 30 phút · bỏ đại từ, giới từ + which/whom, V-ing / V3 rút gọn",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 19", title: "Warm-up",
      items: [
        { q: "Lan, ___ you met yesterday, is my cousin.", opts: ["who", "that", "which"], a: 0,
          why: "Có dấu phẩy → không dùng that.", tag: "non-defining" },
        { q: "He forgot my birthday, ___ really upset me.", opts: ["which", "that", "what"], a: 0,
          why: ", which thay cả mệnh đề.", tag: "non-defining" },
        { q: "The Eiffel Tower, ___ was built in 1889, is in Paris.", opts: ["which", "that", "where"], a: 0,
          why: "Tên riêng + chủ ngữ của 'was built' → which.", tag: "non-defining" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "3 cách làm câu gọn hơn", html: `
      <h3>① Bỏ đại từ quan hệ khi nó là TÂN NGỮ</h3>
      <div class="box">The song <s>that</s> I love → The song <b>I love</b></div>
      <h3>② Giới từ: đặt cuối (thân mật) hoặc đầu (trang trọng)</h3>
      <div class="box">
        the house <b>(which)</b> I live <b>in</b> &nbsp;— văn nói<br>
        the house <b>in which</b> I live &nbsp;— văn viết<br>
        the person <b>(who)</b> I spoke <b>to</b> = the person <b>to whom</b> I spoke
      </div>
      <div class="warn">Sau giới từ chỉ dùng <b>which</b> (vật) và <b>whom</b> (người). <s>in that</s>, <s>to who</s> ✘</div>
      <h3>③ Rút gọn mệnh đề thành V-ing hoặc V3</h3>
      <table>
        <tr><th>Nghĩa</th><th>Đầy đủ</th><th>Rút gọn</th></tr>
        <tr><td><b>Chủ động</b> → V-ing</td><td>the girl <s>who is</s> singing</td><td>the girl <em class="g">singing</em></td></tr>
        <tr><td><b>Chủ động</b> → V-ing</td><td>people <s>who want</s> to join</td><td>people <em class="g">wanting</em> to join</td></tr>
        <tr><td><b>Bị động</b> → V3</td><td>cars <s>which are</s> made in Japan</td><td>cars <em class="g">made</em> in Japan</td></tr>
        <tr><td>the first/last/only → to V</td><td>the first person <s>who arrived</s></td><td>the first person <em class="g">to arrive</em></td></tr>
      </table>
      <p><b>Mẹo:</b> danh từ <i>tự làm</i> hành động → V-ing. Danh từ <i>bị</i> làm → V3.</p>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["Bỏ đại từ", "khi là tân ngữ<br><i>the film (that) we saw</i>"],
        ["giới từ + which / whom", "<i>the city in which I live</i><br><i>the man to whom I spoke</i>"],
        ["Rút gọn chủ động", "V-ing<br><i>the man standing there</i>"],
        ["Rút gọn bị động", "V3<br><i>the money stolen from the bank</i>"],
        ["the first / only + ?", "to V<br><i>the only one to pass</i>"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "The man ___ to my mother is my teacher.", opts: ["talking", "talked", "is talking"], a: 0,
          why: "Người đàn ông tự nói chuyện (chủ động) → talking." },
        { q: "Most of the phones ___ in this factory are exported.", opts: ["making", "made", "make"], a: 1,
          why: "Điện thoại được sản xuất (bị động) → made." },
        { q: "This is the person ___ I spoke.", opts: ["to whom", "whom", "to who"], a: 0,
          why: "speak to someone → to whom. Sau giới từ không dùng who." },
        { q: "The company ___ he works is in District 1.", opts: ["for which", "which", "for that"], a: 0,
          why: "work for a company → for which. Không dùng 'for that'." },
        { q: "Anyone ___ to join the club should email me.", opts: ["wanting", "wanted", "wants"], a: 0,
          why: "who wants → wanting (chủ động)." },
        { q: "She was the first woman ___ the race.", opts: ["to win", "winning", "won"], a: 0,
          why: "the first + to V." },
        { q: "Which sentence is WRONG?", opts: ["The book I'm reading is long.", "The book is on the table is mine.", "The book on the table is mine."], a: 1,
          why: "Không được bỏ 'which' khi nó là CHỦ NGỮ: The book (which is) on the table → hoặc giữ cả 'which is', hoặc bỏ cả 2." },
        { q: "The houses ___ by the flood will be rebuilt.", opts: ["destroying", "destroyed", "were destroyed"], a: 1,
          why: "Nhà bị lũ phá → bị động → destroyed." },
      ] },

    { type: "typed", key: "T", time: "6 phút · Viết lại câu", title: "Rút gọn câu theo yêu cầu",
      items: [
        { q: "The woman who is sitting next to Nam is his wife. <i>(rút gọn)</i>",
          ans: ["The woman sitting next to Nam is his wife."], why: "who is sitting → sitting." },
        { q: "The letters which were sent yesterday haven't arrived. <i>(rút gọn)</i>",
          ans: ["The letters sent yesterday haven't arrived.", "The letters sent yesterday have not arrived."], why: "which were sent → sent (bị động)." },
        { q: "The music that I listen to is mostly jazz. <i>(bỏ đại từ)</i>",
          ans: ["The music I listen to is mostly jazz."], why: "that là tân ngữ → bỏ được." },
        { q: "This is the town in which I grew up. <i>(giới từ ra cuối, bỏ which)</i>",
          ans: ["This is the town I grew up in."], why: "in which → ... grew up in." },
        { q: "Students who want to take the test must register online. <i>(rút gọn)</i>",
          ans: ["Students wanting to take the test must register online."], why: "who want → wanting." },
      ] },

    { type: "order", key: "O", time: "3 phút · Sắp xếp", title: "Sắp xếp thành câu đúng",
      hint: "Bấm vào từ để thêm vào câu; bấm lại để bỏ ra.",
      items: [
        { words: "The man|sitting|next to me|was reading|a newspaper", why: "sitting next to me = who was sitting next to me." },
        { words: "Is this|the key|you were|looking for", why: "Bỏ that (tân ngữ), giới từ 'for' ở cuối." },
        { words: "The language|spoken|in Brazil|is|Portuguese", why: "spoken = which is spoken (bị động)." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Viết 4 câu",
      hint: "1 câu bỏ đại từ · 1 câu giới từ + which/whom · 1 câu rút gọn V-ing · 1 câu rút gọn V3.",
      placeholder: "1. The app I use most is ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>

</body>
</html>
