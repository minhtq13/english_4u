<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Causative</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "28",
  title: "Causative — have / get something done",
  sub: "Giai đoạn 3 · 30 phút · nhờ / thuê người khác làm",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 27", title: "Warm-up",
      items: [
        { q: "I wish I ___ more free time.", opts: ["had", "have"], a: 0, why: "wish + past simple.", tag: "wish" },
        { q: "I wish you ___ interrupting me!", opts: ["would stop", "stopped"], a: 0, why: "Phàn nàn → would.", tag: "wish + would" },
        { q: "It's time we ___ a decision.", opts: ["made", "make"], a: 0, why: "It's time + sb + past.", tag: "it's time" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Ai là người làm?", html: `
      <p>Người Việt hay nói <i>"Tôi cắt tóc hôm qua"</i> nhưng thật ra là <b>thợ</b> cắt. Tiếng Anh phân biệt rõ:</p>
      <div class="box">
        I <b>cut</b> my hair. → <i>Tôi tự cắt.</i><br>
        I <b>had my hair cut</b>. → <i>Tôi đi cắt (người khác cắt cho tôi).</i>
      </div>
      <table>
        <tr><th>Cấu trúc</th><th>Dùng khi</th><th>Ví dụ</th></tr>
        <tr><td><b>have/get + vật + V3</b></td><td>Nhờ/thuê làm (không nói ai làm)</td><td>I <em class="g">had my car repaired</em>.</td></tr>
        <tr><td><b>have + người + V</b></td><td>Bảo ai đó làm</td><td>I'll <em class="g">have the technician check</em> it.</td></tr>
        <tr><td><b>get + người + to V</b></td><td>Thuyết phục ai đó làm</td><td>I <em class="g">got my brother to help</em> me.</td></tr>
        <tr><td><b>have + vật + V3</b> (chuyện xấu)</td><td>Việc không mong muốn xảy ra với mình</td><td>She <em class="g">had her phone stolen</em>.</td></tr>
      </table>
      <p><b>Logic:</b> đây chính là <b>bị động</b> (bài 17) — cái xe <i>được sửa</i> → V3.</p>
      <div class="warn">Chia thì ở <b>have/get</b>, V3 giữ nguyên:<br>
        I <b>am having</b> my house painted. · I <b>had</b> it painted. · I <b>will get</b> it painted. · I <b>have just had</b> it painted.</div>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["have sth done", "thuê/nhờ làm<br><i>have my nails done</i>"],
        ["have sb do", "bảo ai làm<br><i>have the waiter bring it</i>"],
        ["get sb to do", "thuyết phục ai làm<br><i>get him to agree</i>"],
        ["had my bike stolen", "bị trộm xe (chuyện xấu)"],
        ["Chia thì ở đâu?", "ở have/get"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "I ___ my hair cut yesterday.", opts: ["had", "did", "made"], a: 0, why: "have sth done → had." },
        { q: "She's getting her car ___.", opts: ["repair", "repaired", "repairing"], a: 1, why: "get sth + V3." },
        { q: "I'll have the technician ___ the air conditioner.", opts: ["check", "to check", "checked"], a: 0, why: "have + người + V nguyên mẫu." },
        { q: "I got my brother ___ me move house.", opts: ["help", "to help", "helped"], a: 1, why: "get + người + to V." },
        { q: "We need to ___ the roof repaired before the rainy season.", opts: ["get", "make", "do"], a: 0, why: "get sth done." },
        { q: "He had his wallet ___ on the bus.", opts: ["steal", "stealing", "stolen"], a: 2, why: "Chuyện xấu: have sth + V3." },
        { q: "Which sentence means somebody ELSE painted the house?", opts: ["We painted our house.", "We had our house painted."], a: 1, why: "had + house + painted → thuê người sơn." },
        { q: "Where do you ___ your clothes washed?", opts: ["get", "make", "take"], a: 0, why: "get sth done." },
      ] },

    { type: "typed", key: "T", time: "6 phút · Viết lại câu", title: "Viết lại bằng have/get",
      items: [
        { q: "A mechanic is fixing my motorbike. <i>(I'm having…)</i>", ans: ["I'm having my motorbike fixed.", "I am having my motorbike fixed."], why: "Hiện tại tiếp diễn ở have." },
        { q: "A photographer took our wedding photos. <i>(We had…)</i>", ans: ["We had our wedding photos taken."], why: "take → taken." },
        { q: "Someone will clean the carpets tomorrow. <i>(We'll get…)</i>", ans: ["We'll get the carpets cleaned tomorrow.", "We will get the carpets cleaned tomorrow."], why: "will get + sth + V3." },
        { q: "Someone stole my bike last week. <i>(I had…)</i>", ans: ["I had my bike stolen last week."], why: "Chuyện xấu: had + sth + V3." },
        { q: "I asked my friend to fix my laptop and she did. <i>(I got…)</i>", ans: ["I got my friend to fix my laptop."], why: "get + người + to V." },
      ] },

    { type: "typed", key: "G", short: true, time: "3 phút · Điền từ", title: "Chia động từ trong ngoặc",
      hint: "Chỉ gõ 1 từ hoặc cụm từ.",
      items: [
        { q: "You should have your eyes ___ (test).", ans: ["tested"], why: "have sth + V3." },
        { q: "I'm going to get my teeth ___ (check) next week.", ans: ["checked"], why: "get sth + V3." },
        { q: "She had the waiter ___ (bring) another glass.", ans: ["bring"], why: "have + người + V." },
        { q: "I couldn't get the kids ___ (go) to bed.", ans: ["to go"], why: "get + người + to V." },
        { q: "Have you ever had your phone ___ (hack)?", ans: ["hacked"], why: "Chuyện xấu: had sth + V3." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Dịch vụ bạn hay dùng",
      hint: "4 câu về những việc bạn thuê/nhờ người khác làm (cắt tóc, sửa xe, giao hàng…) ở các thì khác nhau + 1 câu về chuyện không may (had sth stolen/broken).",
      placeholder: "1. I usually get my hair cut ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
