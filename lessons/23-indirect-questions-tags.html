<title>Indirect Questions and Tags</title>

<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "23",
  title: "Indirect Questions & Question Tags",
  sub: "Giai đoạn 1 · 30 phút · hỏi lịch sự và câu hỏi đuôi",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 22", title: "Warm-up",
      items: [
        { q: "I ___ live in a small village, but now I live in the city.", opts: ["used to", "am used to"], a: 0, why: "Quá khứ, giờ không còn.", tag: "used to" },
        { q: "He's lived in the UK for years, so he ___ the weather.", opts: ["is used to", "used to"], a: 0, why: "Đã quen → is used to.", tag: "be used to" },
        { q: "When we were kids, we ___ play outside until dark.", opts: ["would", "were used to"], a: 0, why: "Hành động lặp lại quá khứ → would.", tag: "would" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Hỏi lịch sự & hỏi để xác nhận", html: `
      <h3>① Câu hỏi gián tiếp (Indirect questions)</h3>
      <p>Dùng khi muốn hỏi <b>lịch sự</b>. Phần sau trở thành <b>câu khẳng định</b>: chủ ngữ trước động từ, <b>bỏ do/does/did</b>.</p>
      <div class="box">
        Where <b>is</b> the station? → Could you tell me where the station <b>is</b>?<br>
        What time <b>does</b> it start? → Do you know what time it <b>starts</b>?<br>
        <b>Did</b> she call? → I wonder <b>if/whether</b> she called.
      </div>
      <p>Câu mở đầu thường gặp: <i>Could you tell me… / Do you know… / I wonder… / I'd like to know… / Do you have any idea…</i></p>
      <div class="warn">Câu hỏi Yes/No → thêm <b>if</b> hoặc <b>whether</b>.</div>
      <h3>② Câu hỏi đuôi (Question tags)</h3>
      <p>Dùng để <b>xác nhận</b> điều mình nghĩ là đúng. Quy tắc: khẳng định → đuôi phủ định, và ngược lại; dùng <b>trợ động từ</b> của câu.</p>
      <table>
        <tr><th>Câu</th><th>Đuôi</th></tr>
        <tr><td>You <b>are</b> tired,</td><td><em class="g">aren't you?</em></td></tr>
        <tr><td>She <b>went</b> home, (past simple → did)</td><td><em class="g">didn't she?</em></td></tr>
        <tr><td>He <b>has</b> finished,</td><td><em class="g">hasn't he?</em></td></tr>
        <tr><td><b>I am</b> late,</td><td><em class="g">aren't I?</em> (đặc biệt)</td></tr>
        <tr><td><b>Let's</b> go,</td><td><em class="g">shall we?</em></td></tr>
        <tr><td>Close the door, (mệnh lệnh)</td><td><em class="g">will you?</em></td></tr>
        <tr><td><b>Nobody / Nothing / never</b> … (đã mang nghĩa phủ định)</td><td>đuôi <b>khẳng định</b>: Nobody came, <em class="g">did they?</em></td></tr>
      </table>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["Where is the bank?", "Could you tell me where the bank <b>is</b>?"],
        ["Does he live here?", "Do you know <b>if</b> he lives here?"],
        ["I'm right, ___?", "aren't I?"],
        ["Let's eat, ___?", "shall we?"],
        ["Nobody knows, ___?", "do they?"],
        ["He never lies, ___?", "does he?"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "Could you tell me where ___?", opts: ["is the bank", "the bank is", "does the bank"], a: 1, why: "Câu gián tiếp → chủ ngữ + động từ." },
        { q: "Do you know what time ___?", opts: ["the film starts", "does the film start", "starts the film"], a: 0, why: "Bỏ does, động từ chia theo chủ ngữ: starts." },
        { q: "I wonder ___ he will come.", opts: ["if", "that", "what"], a: 0, why: "Câu hỏi Yes/No → if/whether." },
        { q: "You're a student, ___?", opts: ["aren't you", "are you", "don't you"], a: 0, why: "Khẳng định với 'are' → aren't you." },
        { q: "She went to Da Nang, ___?", opts: ["didn't she", "wasn't she", "doesn't she"], a: 0, why: "Past simple → did → didn't she." },
        { q: "Let's have lunch, ___?", opts: ["shall we", "will we", "don't we"], a: 0, why: "Let's → shall we." },
        { q: "I'm right, ___?", opts: ["amn't I", "aren't I", "am I"], a: 1, why: "Trường hợp đặc biệt: I am → aren't I." },
        { q: "Nobody called, ___?", opts: ["did they", "didn't they", "did he"], a: 0, why: "Nobody mang nghĩa phủ định → đuôi khẳng định; dùng they." },
        { q: "He has never been to Japan, ___?", opts: ["has he", "hasn't he", "did he"], a: 0, why: "never = phủ định → has he." },
      ] },

    { type: "typed", key: "T", time: "5 phút · Viết lại câu", title: "Đổi sang câu hỏi gián tiếp",
      items: [
        { q: "Where is the nearest ATM? → <i>Could you tell me…</i>", ans: ["Could you tell me where the nearest ATM is?"], why: "Chủ ngữ (the nearest ATM) + is." },
        { q: "What does this word mean? → <i>Do you know…</i>", ans: ["Do you know what this word means?"], why: "Bỏ does, mean → means." },
        { q: "Is the museum open today? → <i>I'd like to know…</i>", ans: ["I'd like to know if the museum is open today.", "I'd like to know whether the museum is open today.", "I would like to know if the museum is open today.", "I would like to know whether the museum is open today."], why: "Yes/No → if/whether." },
        { q: "Why did she leave early? → <i>Do you have any idea…</i>", ans: ["Do you have any idea why she left early?"], why: "Bỏ did, leave → left." },
        { q: "How much does this cost? → <i>Can you tell me…</i>", ans: ["Can you tell me how much this costs?"], why: "Bỏ does, cost → costs." },
      ] },

    { type: "typed", key: "G", short: true, time: "4 phút · Điền đuôi", title: "Thêm câu hỏi đuôi",
      hint: "Chỉ gõ phần đuôi, ví dụ: isn't it",
      items: [
        { q: "It's hot today, ___?", ans: ["isn't it"], why: "It is → isn't it." },
        { q: "You can swim, ___?", ans: ["can't you"], why: "can → can't." },
        { q: "They didn't finish, ___?", ans: ["did they"], why: "Phủ định → đuôi khẳng định." },
        { q: "Close the door, ___?", ans: ["will you", "would you", "could you", "can you"], why: "Mệnh lệnh → will you (thường gặp nhất)." },
        { q: "She has been here before, ___?", ans: ["hasn't she"], why: "has → hasn't." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Tình huống du lịch",
      hint: "Bạn đang ở khách sạn: viết <b>2 câu hỏi gián tiếp</b> lịch sự cho lễ tân + <b>2 câu có câu hỏi đuôi</b> nói với bạn đồng hành.",
      placeholder: "1. Could you tell me ...\n2. ...\n3. ..., isn't it?\n4. ..." },
  ],
};
</script>
