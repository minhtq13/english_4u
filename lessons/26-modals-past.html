<!doctype html>

<title>Past Modals</title>

<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "26",
  title: "Past Modals — suy luận & hối tiếc về quá khứ",
  sub: "Giai đoạn 2 · 30 phút · must have / can't have / might have / should have + V3",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 25", title: "Warm-up",
      items: [
        { q: "He's wearing a uniform. He ___ be a pilot.", opts: ["must", "can't"], a: 0, why: "Bằng chứng → must.", tag: "deduction" },
        { q: "She ___ be at home. I just saw her at the mall.", opts: ["can't", "mustn't"], a: 0, why: "Suy luận phủ định → can't.", tag: "can't vs mustn't" },
        { q: "Look, they ___ for the bus.", opts: ["must be waiting", "must wait"], a: 0, why: "Đang diễn ra → must be V-ing.", tag: "deduction" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Modal + have + V3 = nói về quá khứ", html: `
      <p>Công thức chung: <b>modal + have + V3</b>. Giữ nguyên nghĩa của modal, chỉ chuyển sang quá khứ.</p>
      <h3>① Suy luận về quá khứ</h3>
      <table>
        <tr><th>Cấu trúc</th><th>Nghĩa</th><th>Ví dụ</th></tr>
        <tr><td><b>must have + V3</b></td><td>chắc chắn đã</td><td>The ground is wet. It <em class="g">must have rained</em>.</td></tr>
        <tr><td><b>might / may / could have + V3</b></td><td>có lẽ đã</td><td>He's late. He <em class="g">might have missed</em> the bus.</td></tr>
        <tr><td><b>can't / couldn't have + V3</b></td><td>chắc chắn không thể đã</td><td>She <em class="g">can't have seen</em> me. She was asleep.</td></tr>
      </table>
      <h3>② Hối tiếc / phê bình</h3>
      <table>
        <tr><th>Cấu trúc</th><th>Nghĩa</th><th>Ví dụ</th></tr>
        <tr><td><b>should have + V3</b></td><td>lẽ ra nên làm (nhưng đã không làm)</td><td>I failed. I <em class="g">should have studied</em> harder.</td></tr>
        <tr><td><b>shouldn't have + V3</b></td><td>lẽ ra không nên (nhưng đã làm)</td><td>I <em class="g">shouldn't have eaten</em> so much.</td></tr>
        <tr><td><b>could have + V3</b></td><td>đã có thể làm (nhưng không làm)</td><td>You <em class="g">could have taken</em> a taxi!</td></tr>
      </table>
      <div class="warn"><b>Lỗi thường gặp:</b> sau have phải là <b>V3</b> (past participle), không phải V2:<br>
        must have <s>went</s> → must have <b>gone</b> · should have <s>took</s> → should have <b>taken</b></div>
      <div class="box"><b>Liên hệ bài cũ:</b> "I should have studied harder" ≈ "If I had studied harder, I would have passed" (Third conditional, bài 15).</div>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["must have done", "chắc chắn đã"],
        ["can't have done", "chắc chắn đã không"],
        ["might have done", "có lẽ đã"],
        ["should have done", "lẽ ra nên (nhưng đã không)"],
        ["shouldn't have done", "lẽ ra không nên (nhưng đã làm)"],
        ["go → must have ___", "gone (V3!)"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "The ground is wet. It ___ last night.", opts: ["must have rained", "must rain", "should have rained"], a: 0, why: "Suy luận chắc chắn về quá khứ." },
        { q: "She ___ the email. She was offline all day.", opts: ["can't have sent", "mustn't have sent", "should have sent"], a: 0, why: "Chắc chắn không → can't have." },
        { q: "I failed the test. I ___ harder.", opts: ["should have studied", "must have studied", "can't have studied"], a: 0, why: "Hối tiếc → should have." },
        { q: "Nam isn't here yet. He ___ the bus.", opts: ["might have missed", "should miss", "can't have missed"], a: 0, why: "Có lẽ → might have." },
        { q: "You ___ so much — now you feel sick.", opts: ["shouldn't have eaten", "mustn't have eaten", "couldn't eat"], a: 0, why: "Phê bình việc đã làm → shouldn't have." },
        { q: "Why did you walk home? You ___ a taxi.", opts: ["could have taken", "must have taken", "can't have taken"], a: 0, why: "Đã có thể (nhưng không làm) → could have." },
        { q: "He knew all the answers. He ___ the questions before.", opts: ["must have seen", "should have seen", "might see"], a: 0, why: "Suy luận chắc chắn → must have." },
        { q: "Which sentence is WRONG?", opts: ["She must have forgot.", "She must have forgotten.", "She may have forgotten."], a: 0, why: "Sau have → V3: forgotten." },
      ] },

    { type: "typed", key: "T", time: "6 phút · Viết lại câu", title: "Viết lại bằng past modal",
      items: [
        { q: "I'm sure she was tired after the trip.", ans: ["She must have been tired after the trip."], why: "I'm sure + quá khứ → must have been." },
        { q: "It was a mistake to sell my old car. <i>(shouldn't)</i>", ans: ["I shouldn't have sold my old car.", "I should not have sold my old car."], why: "Hối tiếc việc đã làm → shouldn't have." },
        { q: "Perhaps they went home early.", ans: ["They might have gone home early.", "They may have gone home early.", "They could have gone home early."], why: "Perhaps → might have + V3 (gone)." },
        { q: "I'm sure he didn't steal the money.", ans: ["He can't have stolen the money.", "He couldn't have stolen the money.", "He cannot have stolen the money."], why: "Chắc chắn không → can't have stolen." },
        { q: "It was a good idea to call you, but I didn't.", ans: ["I should have called you."], why: "Lẽ ra nên → should have." },
      ] },

    { type: "typed", key: "G", short: true, time: "3 phút · Điền từ", title: "Chia động từ trong ngoặc",
      hint: "Gõ đủ cụm, ví dụ: must have gone",
      items: [
        { q: "You ___ (should / tell) me earlier!", ans: ["should have told"], why: "tell → told." },
        { q: "The window is broken. Someone ___ (must / throw) a stone.", ans: ["must have thrown"], why: "throw → thrown." },
        { q: "He ___ (can't / finish) already — he only started 5 minutes ago!", ans: ["can't have finished", "cannot have finished"], why: "Chắc chắn chưa xong." },
        { q: "I ___ (might / leave) my wallet at the café.", ans: ["might have left"], why: "leave → left." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Hối tiếc & bí ẩn",
      hint: "2 câu hối tiếc về quá khứ của bạn (<b>should / shouldn't have</b>) + 2 câu suy luận về một chuyện đã xảy ra (<b>must / can't / might have</b>).",
      placeholder: "1. I should have ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
