<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Used to and Would</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "22",
  title: "Used to / would / be used to / get used to",
  sub: "Giai đoạn 1 · 30 phút · thói quen quá khứ vs đã quen với",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 21", title: "Warm-up",
      items: [
        { q: "I'm thinking of ___ my job.", opts: ["changing", "to change", "change"], a: 0, why: "Sau giới từ of → V-ing.", tag: "gerund" },
        { q: "Don't forget ___ me when you arrive.", opts: ["to call", "calling"], a: 0, why: "Việc cần làm → to V.", tag: "forget to/-ing" },
        { q: "They agreed ___ the price.", opts: ["to lower", "lowering"], a: 0, why: "agree + to V.", tag: "infinitive" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "4 cấu trúc trông giống nhau nhưng nghĩa khác", html: `
      <table>
        <tr><th>Cấu trúc</th><th>Nghĩa</th><th>Ví dụ</th></tr>
        <tr><td><b>used to + V</b></td><td>Thói quen / trạng thái <b>trong quá khứ</b>, <b>bây giờ không còn</b></td><td>I <em class="g">used to live</em> in Hue. (giờ không sống ở đó nữa)</td></tr>
        <tr><td><b>would + V</b></td><td>Hành động lặp lại trong quá khứ (kể chuyện, hoài niệm)</td><td>Every summer we <em class="g">would swim</em> in the river.</td></tr>
        <tr><td><b>be used to + V-ing / N</b></td><td><b>Đã quen</b> với (trạng thái)</td><td>I <em class="g">am used to getting</em> up early.</td></tr>
        <tr><td><b>get used to + V-ing / N</b></td><td><b>Dần quen</b> với (quá trình)</td><td>You'll <em class="g">get used to</em> the noise.</td></tr>
      </table>
      <div class="warn"><b>would KHÔNG dùng cho trạng thái</b> (have, be, live, like, know…):<br>
        <s>I would have long hair.</s> → I <b>used to</b> have long hair.</div>
      <div class="warn"><b>Phủ định / câu hỏi:</b> did → use (không có d):<br>
        I <b>didn't use to</b> like coffee. · <b>Did</b> you <b>use to</b> play football?</div>
      <div class="box"><b>Mẹo phân biệt:</b> có <b>be / get</b> phía trước → "to" là giới từ → <b>V-ing</b>.<br>
        Không có be/get → "used to" + <b>V nguyên mẫu</b>.</div>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["used to + V", "quá khứ, giờ không còn"],
        ["would + V", "hành động lặp lại trong quá khứ<br>(không dùng cho trạng thái)"],
        ["be used to + V-ing", "đã quen với"],
        ["get used to + V-ing", "dần quen với"],
        ["didn't ___ to", "use (không có d)"],
        ["I used to live vs I'm used to living", "Đã từng sống (giờ thôi) vs Đã quen với việc sống"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "I ___ play football every weekend when I was a kid.", opts: ["used to", "am used to", "use to"], a: 0, why: "Thói quen quá khứ → used to + V." },
        { q: "She ___ have long hair, but now it's short.", opts: ["used to", "would", "is used to"], a: 0, why: "'have' là trạng thái → không dùng would." },
        { q: "I've lived in Hanoi for 10 years, so I ___ the traffic.", opts: ["used to", "am used to", "get used to"], a: 1, why: "Đã quen (trạng thái hiện tại) → am used to." },
        { q: "It took me months to ___ driving on the left.", opts: ["get used to", "use to", "used to"], a: 0, why: "Quá trình làm quen → get used to." },
        { q: "Did you ___ go to school by bike?", opts: ["use to", "used to"], a: 0, why: "Sau did → use to." },
        { q: "Every summer, my grandfather ___ take us fishing.", opts: ["would", "was used to", "is used to"], a: 0, why: "Hành động lặp lại trong quá khứ → would (hoặc used to)." },
        { q: "I'm not used to ___ so early.", opts: ["get up", "getting up", "got up"], a: 1, why: "be used to + V-ing." },
        { q: "We ___ have a dog, but it died last year.", opts: ["would", "used to", "were used to"], a: 1, why: "have a dog = trạng thái → used to." },
      ] },

    { type: "typed", key: "G", short: true, time: "5 phút · Điền từ", title: "Dùng used to / be used to / get used to + động từ",
      hint: "Chỉ gõ phần điền vào chỗ trống.",
      items: [
        { q: "When I was young, I ___ (eat) a lot of sweets.", ans: ["used to eat", "would eat"], why: "Thói quen quá khứ." },
        { q: "Don't worry. You'll soon ___ (work) at night.", ans: ["get used to working"], why: "will + get used to + V-ing." },
        { q: "My dad ___ (not / like) coffee, but now he drinks it every day.", ans: ["didn't use to like", "did not use to like"], why: "Phủ định: didn't use to; 'like' là trạng thái nên không dùng would." },
        { q: "She is a nurse, so she ___ (work) long hours.", ans: ["is used to working"], why: "Đã quen → be used to + V-ing." },
        { q: "I can't ___ (sleep) in this noisy room.", ans: ["get used to sleeping"], why: "can't + get used to + V-ing." },
        { q: "In the past, people ___ (write) letters instead of emails.", ans: ["used to write", "would write"], why: "Thói quen quá khứ." },
      ] },

    { type: "typed", key: "E", time: "4 phút · Sửa lỗi", title: "Sửa lỗi sai",
      items: [
        { q: "I am used to get up at 6 a.m.", ans: ["I am used to getting up at 6 a.m.", "I'm used to getting up at 6 a.m."], why: "be used to + V-ing." },
        { q: "I use to play the piano when I was young.", ans: ["I used to play the piano when I was young."], why: "Khẳng định quá khứ → used to." },
        { q: "When I was a child, I would have a cat.", ans: ["When I was a child, I used to have a cat."], why: "have = trạng thái → used to." },
        { q: "Did you used to work here?", ans: ["Did you use to work here?"], why: "Sau did → use to." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Hồi nhỏ và bây giờ",
      hint: "4 câu so sánh tuổi thơ và hiện tại, dùng: <b>used to</b> · <b>would</b> · <b>be used to</b> · <b>get used to</b>.",
      placeholder: "1. When I was a child, I used to ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
