<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linking Words</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "30",
  title: "Linking Words — liên kết câu & lập luận",
  sub: "Giai đoạn 3 · 30 phút · although / despite / however / whereas / so that / in order to",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 29", title: "Warm-up",
      items: [
        { q: "The ___ you sleep, the worse you feel.", opts: ["less", "least"], a: 0, why: "The + so sánh hơn.", tag: "the more…the more" },
        { q: "This app is ___ better than the old one.", opts: ["far", "very"], a: 0, why: "far + so sánh hơn.", tag: "comparatives" },
        { q: "My room isn't as big ___ yours.", opts: ["as", "than"], a: 0, why: "not as … as.", tag: "comparatives" },
      ] },

    { type: "explain", time: "8 phút · Hiểu logic", title: "Từ nối = chỉ đường cho người đọc", html: `
      <p>Từ nối cho người đọc biết <b>quan hệ logic</b> giữa 2 ý: đối lập, nguyên nhân, kết quả, mục đích hay bổ sung. Chọn sai từ nối → lập luận bị sai, dù ngữ pháp đúng.</p>
      <table>
        <tr><th>Quan hệ</th><th>+ mệnh đề (S + V)</th><th>+ danh từ / V-ing</th><th>Đứng đầu câu mới</th></tr>
        <tr><td><b>Đối lập</b></td><td>although, even though, whereas, while</td><td>despite, in spite of</td><td>However, …</td></tr>
        <tr><td><b>Nguyên nhân</b></td><td>because, as, since</td><td>because of, due to</td><td>—</td></tr>
        <tr><td><b>Kết quả</b></td><td>so</td><td>—</td><td>Therefore, … / As a result, …</td></tr>
        <tr><td><b>Mục đích</b></td><td>so that (+ can/could/will/would)</td><td>to / in order to + V</td><td>—</td></tr>
        <tr><td><b>Bổ sung</b></td><td>and</td><td>—</td><td>Moreover, … / In addition, …</td></tr>
      </table>
      <div class="box">
        <b>Although</b> it was raining, we went out. = <b>Despite</b> the rain, we went out.<br>
        = It was raining. <b>However</b>, we went out.<br>
        Lan likes tea, <b>whereas</b> her husband prefers coffee. (so sánh 2 đối tượng)
      </div>
      <div class="warn"><b>Lỗi thường gặp của người Việt:</b><br>
        ① <s>Although</s> … <s>but</s> … — chỉ dùng MỘT từ (tiếng Việt nói "Mặc dù… nhưng…", tiếng Anh thì không).<br>
        ② <s>Despite it was cold</s> → Despite <b>the cold</b> / <b>Although</b> it was cold.<br>
        ③ <s>for buying</s> milk → <b>to buy</b> milk (mục đích).<br>
        ④ <s>Because of he was late</s> → <b>Because</b> he was late.</div>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["although + ?", "mệnh đề (S + V)"],
        ["despite + ?", "danh từ / V-ing"],
        ["However", "đầu câu mới + dấu phẩy"],
        ["Although … but?", "✘ chỉ dùng 1 từ"],
        ["Mục đích", "to V / so that + S + can"],
        ["whereas", "so sánh đối lập 2 đối tượng"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "___ it was raining, we went out.", opts: ["Although", "Despite", "However"], a: 0, why: "+ mệnh đề → Although." },
        { q: "___ the rain, we went out.", opts: ["Although", "Despite", "However"], a: 1, why: "+ danh từ → Despite." },
        { q: "The hotel was expensive. ___, the service was terrible.", opts: ["However", "Although", "Moreover"], a: 2, why: "Đắt + dịch vụ tệ = 2 ý tiêu cực cùng chiều → bổ sung (Moreover), không phải đối lập." },
        { q: "I study English every day ___ I can get a better job.", opts: ["so that", "in order to", "because of"], a: 0, why: "+ mệnh đề có can → so that." },
        { q: "She left early ___ catch the train.", opts: ["in order to", "so that", "because"], a: 0, why: "+ V → in order to." },
        { q: "The flight was cancelled ___ the storm.", opts: ["because", "because of", "so"], a: 1, why: "+ danh từ → because of." },
        { q: "My sister loves cats, ___ I prefer dogs.", opts: ["whereas", "despite", "so that"], a: 0, why: "So sánh 2 người → whereas." },
        { q: "He didn't study. ___, he failed the exam.", opts: ["As a result", "However", "Although"], a: 0, why: "Kết quả." },
        { q: "In spite of ___ tired, she finished the race.", opts: ["be", "being", "she was"], a: 1, why: "in spite of + V-ing." },
        { q: "Which sentence is the most LOGICAL?", opts: ["I was hungry, so I didn't eat.", "I was hungry, but I didn't eat because I was on a diet.", "I was hungry. However, I ate a lot."], a: 1, why: "Câu 1: 'so' sai logic. Câu 3: 'However' sai logic (đói → ăn nhiều là bình thường, không đối lập)." },
      ] },

    { type: "typed", key: "T", time: "5 phút · Viết lại câu", title: "Viết lại câu",
      items: [
        { q: "Although he was ill, he went to work. <i>(Despite)</i>", ans: ["Despite being ill, he went to work.", "Despite his illness, he went to work.", "Despite the fact that he was ill, he went to work."], why: "Despite + V-ing / danh từ." },
        { q: "I saved money. I wanted to buy a laptop. <i>(in order to)</i>", ans: ["I saved money in order to buy a laptop."], why: "Mục đích + V." },
        { q: "She speaks quietly. She doesn't want to wake the baby. <i>(so that)</i>", ans: ["She speaks quietly so that she doesn't wake the baby.", "She speaks quietly so that she won't wake the baby.", "She speaks quietly so that she does not wake the baby.", "She speaks quietly so that she will not wake the baby."], why: "so that + mệnh đề." },
        { q: "The film was long. It was very interesting. <i>(However)</i>", ans: ["The film was long. However, it was very interesting."], why: "However đầu câu thứ 2." },
      ] },

    { type: "typed", key: "E", time: "3 phút · Sửa lỗi", title: "Sửa lỗi sai",
      items: [
        { q: "Despite it was cold, we went swimming.", ans: ["Although it was cold, we went swimming.", "Even though it was cold, we went swimming.", "Despite the cold, we went swimming."], why: "Despite không đi với mệnh đề." },
        { q: "I went to the shop for buying milk.", ans: ["I went to the shop to buy milk.", "I went to the shop in order to buy milk."], why: "Mục đích → to V." },
        { q: "Although he is rich, but he is not happy.", ans: ["Although he is rich, he is not happy.", "He is rich, but he is not happy."], why: "Chỉ dùng 1 từ nối." },
        { q: "Because of he was late, he missed the bus.", ans: ["Because he was late, he missed the bus."], why: "+ mệnh đề → because." },
      ] },

    { type: "writing", time: "3 phút · Viết đoạn", title: "Viết đoạn văn có lập luận",
      hint: "5–6 câu trả lời câu hỏi: <b>Should children learn English from primary school?</b> Dùng ít nhất 4 từ nối: 1 đối lập, 1 nguyên nhân, 1 kết quả, 1 mục đích. Tôi sẽ chấm cả <b>logic</b> và <b>liên kết</b>.",
      placeholder: "In my opinion, ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
