<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wish and If Only</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "27",
  title: "Wish / If only / I'd rather / It's time",
  sub: "Giai đoạn 3 · 30 phút · ước muốn & điều không có thật",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 26", title: "Warm-up",
      items: [
        { q: "I missed the train. I ___ earlier.", opts: ["should have left", "must have left"], a: 0, why: "Hối tiếc → should have.", tag: "past modals" },
        { q: "She ___ the news — she looks shocked.", opts: ["must have heard", "should have heard"], a: 0, why: "Suy luận → must have.", tag: "past modals" },
        { q: "He ___ at home; I phoned and nobody answered.", opts: ["can't have been", "mustn't have been"], a: 0, why: "Suy luận phủ định → can't have.", tag: "past modals" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Lùi thì để nói điều không có thật", html: `
      <p><b>Logic giống câu điều kiện loại 2 và 3 (bài 14, 15):</b> điều không có thật → <b>lùi một thì</b>.</p>
      <table>
        <tr><th>Ước về</th><th>Cấu trúc</th><th>Ví dụ</th><th>Thực tế</th></tr>
        <tr><td>Hiện tại</td><td>wish + <b>past simple</b></td><td>I wish I <em class="g">had</em> a car.<br>I wish I <em class="g">were</em> taller.</td><td>Tôi không có xe.</td></tr>
        <tr><td>Quá khứ (hối tiếc)</td><td>wish + <b>past perfect</b></td><td>I wish I <em class="g">had studied</em> harder.</td><td>Tôi đã không học chăm.</td></tr>
        <tr><td>Người khác / sự việc nên thay đổi (phàn nàn)</td><td>wish + sb + <b>would</b> + V</td><td>I wish you <em class="g">would stop</em> shouting.</td><td>Bạn cứ hét mãi.</td></tr>
        <tr><td>Khả năng</td><td>wish + <b>could</b> + V</td><td>I wish I <em class="g">could</em> swim.</td><td>Tôi không biết bơi.</td></tr>
      </table>
      <div class="warn">Không dùng <b>I wish I would…</b> (tự ước về hành động của mình) → dùng <b>I wish I could…</b><br>
        <b>If only</b> = wish nhưng cảm xúc mạnh hơn: <i>If only I had listened!</i></div>
      <h3>I'd rather & It's time</h3>
      <table>
        <tr><td><b>I'd rather + V</b></td><td>tôi thích/muốn (tự mình) hơn</td><td>I'd rather <em class="g">stay</em> home.</td></tr>
        <tr><td><b>I'd rather + sb + past</b></td><td>muốn người khác làm</td><td>I'd rather you <em class="g">didn't smoke</em> here.</td></tr>
        <tr><td><b>It's time + sb + past</b></td><td>đã đến lúc (đáng lẽ phải làm rồi)</td><td>It's time we <em class="g">went</em> home.</td></tr>
        <tr><td><b>It's time to + V</b></td><td>đã đến lúc</td><td>It's time <em class="g">to go</em>.</td></tr>
      </table>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["wish + past simple", "ước hiện tại khác đi"],
        ["wish + past perfect", "hối tiếc quá khứ"],
        ["wish + sb + would", "phàn nàn, muốn người khác thay đổi"],
        ["I wish I ___ swim.", "could"],
        ["I'd rather you ___ (not tell) anyone.", "didn't tell"],
        ["It's time we ___ (leave).", "left"],
      ] },

    { type: "mcq", key: "M", time: "6 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "I wish I ___ taller.", opts: ["am", "were", "would be"], a: 1, why: "Ước hiện tại → past simple; với be dùng were (hoặc was)." },
        { q: "I wish I ___ to the party last night. It was fun.", opts: ["went", "had gone", "would go"], a: 1, why: "Hối tiếc quá khứ → had gone." },
        { q: "I wish my neighbour ___ playing loud music at night.", opts: ["stopped", "would stop", "had stopped"], a: 1, why: "Phàn nàn, muốn người khác thay đổi → would." },
        { q: "If only I ___ more money now!", opts: ["had", "have", "would have"], a: 0, why: "Hiện tại → past simple." },
        { q: "It's late. It's time we ___ home.", opts: ["go", "went", "going"], a: 1, why: "It's time + sb + past." },
        { q: "I'd rather ___ at home tonight.", opts: ["stay", "to stay", "stayed"], a: 0, why: "I'd rather + V (chính mình)." },
        { q: "I'd rather you ___ smoke here.", opts: ["don't", "didn't", "won't"], a: 1, why: "I'd rather + người khác + past." },
        { q: "She wishes she ___ speak French.", opts: ["can", "could", "would"], a: 1, why: "Khả năng → could." },
        { q: "I wish I ___ that. I'm sorry.", opts: ["didn't say", "hadn't said", "wouldn't say"], a: 1, why: "Đã nói rồi (quá khứ) → hadn't said." },
      ] },

    { type: "typed", key: "T", time: "6 phút · Viết lại câu", title: "Viết lại câu",
      items: [
        { q: "I don't have a car. <i>(wish)</i>", ans: ["I wish I had a car."], why: "Hiện tại → past simple." },
        { q: "I didn't study medicine. <i>(wish)</i>", ans: ["I wish I had studied medicine.", "I wish I'd studied medicine."], why: "Quá khứ → past perfect." },
        { q: "My brother always borrows my clothes. I hate it. <i>(wish … would)</i>", ans: ["I wish my brother wouldn't borrow my clothes.", "I wish my brother would not borrow my clothes.", "I wish my brother would stop borrowing my clothes."], why: "Phàn nàn → would." },
        { q: "I can't drive. <i>(If only)</i>", ans: ["If only I could drive."], why: "Khả năng → could." },
        { q: "You should go to bed now. <i>(It's time)</i>", ans: ["It's time you went to bed.", "It is time you went to bed.", "It's time for you to go to bed."], why: "It's time + sb + past." },
      ] },

    { type: "order", key: "O", time: "2 phút · Sắp xếp", title: "Sắp xếp thành câu đúng",
      items: [
        { words: "I wish|I had|listened|to my parents", why: "wish + past perfect." },
        { words: "I'd rather|you|didn't|tell|anyone", why: "I'd rather + sb + past." },
        { words: "It's|high time|we|started|the meeting", why: "It's (high) time + sb + past." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Ước muốn của bạn",
      hint: "4 câu: wish về <b>hiện tại</b> · wish về <b>quá khứ</b> · wish + <b>would</b> (phàn nàn) · <b>I'd rather</b> hoặc <b>It's time</b>.",
      placeholder: "1. I wish I ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>
<script src="assets/lesson.js"></script>
</body>
</html>
