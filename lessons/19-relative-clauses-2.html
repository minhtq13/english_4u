<!doctype html>
<html lang="vi">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relative Clauses 2</title>
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>
<main id="app"></main>
<script>
window.LESSON = {
  id: "19.2",
  title: "Relative Clauses — mệnh đề quan hệ không xác định",
  sub: "Giai đoạn 1 · 30 phút · dấu phẩy, không dùng that, which thay cả mệnh đề",
  sections: [
    { type: "mcq", key: "W", time: "3 phút · Ôn bài 19.1", title: "Warm-up",
      items: [
        { q: "The house ___ we rented was near the beach.", opts: ["which", "where", "who"], a: 0,
          why: "rented the house → house là tân ngữ → which (không phải where).", tag: "where vs which" },
        { q: "I talked to a woman ___ daughter studies in Japan.", opts: ["who", "whose", "which"], a: 1,
          why: "con gái CỦA bà ấy → whose.", tag: "whose" },
        { q: "The man who ___ me the way was very kind.", opts: ["showed", "he showed", "showing"], a: 0,
          why: "who đã là chủ ngữ → không thêm 'he'.", tag: "thừa đại từ" },
        { q: "This is the gym ___ I work out every morning.", opts: ["which", "where", "that"], a: 1,
          why: "'I work out' là câu đầy đủ → nơi chốn → where.", tag: "where vs which" },
      ] },

    { type: "explain", time: "7 phút · Hiểu logic", title: "Xác định vs Không xác định", html: `
      <p><b>Câu hỏi then chốt:</b> nếu bỏ mệnh đề đi, người nghe có còn biết bạn đang nói về <i>ai / cái gì</i> không?</p>
      <table>
        <tr><th></th><th>Xác định (defining)</th><th>Không xác định (non-defining)</th></tr>
        <tr><td>Chức năng</td><td>Cần để biết <b>là ai / cái nào</b></td><td>Chỉ <b>thêm thông tin</b>, đã biết là ai rồi</td></tr>
        <tr><td>Dấu phẩy</td><td>Không</td><td><b>Có</b> (2 đầu)</td></tr>
        <tr><td>that</td><td>Dùng được</td><td><b>KHÔNG</b> dùng</td></tr>
        <tr><td>Bỏ đại từ</td><td>Được (nếu là tân ngữ)</td><td><b>KHÔNG</b> được bỏ</td></tr>
      </table>
      <div class="box">
        My brother <b>who lives in Da Nang</b> is a doctor.<br>
        → Tôi có <i>nhiều</i> anh trai; tôi đang nói người sống ở Đà Nẵng.<br><br>
        My brother<b>, who lives in Da Nang,</b> is a doctor.<br>
        → Tôi chỉ có <i>một</i> anh trai; "sống ở Đà Nẵng" chỉ là thông tin thêm.
      </div>
      <h3>Khi nào gần như luôn dùng dấu phẩy?</h3>
      <p>Sau <b>tên riêng</b> (Hanoi, Messi, Mr. Nam), <b>người duy nhất</b> (my mother, my father), hoặc vật đã được xác định rõ.</p>
      <div class="warn"><b>which thay cho cả mệnh đề phía trước:</b><br>
        He passed the exam<b>, which</b> surprised everyone. (cái gây ngạc nhiên = việc anh ấy đỗ)<br>
        <s>He passed the exam, that surprised everyone.</s> ✘</div>` },

    { type: "cards", time: "2 phút · Flashcards", title: "Ghi nhớ nhanh",
      items: [
        ["Non-defining = ?", "Thông tin thêm<br>bỏ đi câu vẫn rõ nghĩa"],
        ["Dấu phẩy?", "Có, ở cả 2 đầu mệnh đề<br><i>Hue, which is in central Vietnam, ...</i>"],
        ["Dùng that?", "KHÔNG trong mệnh đề có dấu phẩy"],
        ["Bỏ who/which?", "KHÔNG được bỏ trong non-defining"],
        [", which ...", "Thay cho cả mệnh đề trước<br><i>It rained, which ruined our trip.</i>"],
      ] },

    { type: "mcq", key: "M", time: "5 phút · Trắc nghiệm", title: "Chọn đáp án đúng",
      items: [
        { q: "Hanoi, ___ is the capital of Vietnam, has over 8 million people.", opts: ["which", "that", "where"], a: 0,
          why: "Có dấu phẩy → không dùng that. Hanoi là chủ ngữ của 'is' → which." },
        { q: "My mother, ___ is 60, still goes jogging every day.", opts: ["who", "that", "whose"], a: 0,
          why: "Người + có dấu phẩy → who." },
        { q: "He failed the test, ___ surprised everyone.", opts: ["which", "that", "what"], a: 0,
          why: "which thay cho cả việc 'anh ấy trượt'." },
        { q: "Which sentence means 'I have only ONE sister'?", opts: ["My sister who lives in Hue is a nurse.", "My sister, who lives in Hue, is a nurse."], a: 1,
          why: "Có dấu phẩy → thông tin thêm → chỉ có 1 chị/em gái." },
        { q: "'The students who studied hard passed the exam.' nghĩa là:", opts: ["Tất cả học sinh đều đỗ", "Chỉ những học sinh học chăm mới đỗ"], a: 1,
          why: "Không phẩy → xác định → chỉ nhóm học sinh học chăm." },
        { q: "'The students, who studied hard, passed the exam.' nghĩa là:", opts: ["Tất cả học sinh (và họ đều học chăm) đã đỗ", "Chỉ một số học sinh đỗ"], a: 0,
          why: "Có phẩy → thông tin thêm về TẤT CẢ học sinh." },
        { q: "Mr. Nam, ___ car I borrowed, is my neighbour.", opts: ["who", "whose", "which"], a: 1,
          why: "xe CỦA ông Nam → whose." },
        { q: "We stayed at the Sunrise Hotel, ___ we had a great view of the sea.", opts: ["which", "where", "that"], a: 1,
          why: "'we had a great view' là câu đầy đủ → nơi chốn → where." },
      ] },

    { type: "mcq", key: "P", time: "4 phút · Dấu phẩy", title: "Câu này có cần dấu phẩy không?",
      hint: "Hãy tự hỏi: bỏ mệnh đề đi, có còn biết là ai/cái gì không?",
      items: [
        { q: "My father who is a teacher loves reading.", opts: ["Cần dấu phẩy", "Không cần"], a: 0,
          why: "Bạn chỉ có 1 bố → thông tin thêm → My father, who is a teacher, loves reading." },
        { q: "The people who work here are very friendly.", opts: ["Cần dấu phẩy", "Không cần"], a: 1,
          why: "Cần biết 'những người nào' → xác định." },
        { q: "Messi who was born in Argentina is a famous footballer.", opts: ["Cần dấu phẩy", "Không cần"], a: 0,
          why: "Tên riêng đã xác định → non-defining." },
        { q: "I lost the book that you gave me.", opts: ["Cần dấu phẩy", "Không cần"], a: 1,
          why: "Cần biết 'quyển sách nào'. Có 'that' → chắc chắn là defining." },
        { q: "Da Lat which I visited last year is famous for its flowers.", opts: ["Cần dấu phẩy", "Không cần"], a: 0,
          why: "Tên riêng → Da Lat, which I visited last year, is ..." },
      ] },

    { type: "typed", key: "E", time: "4 phút · Sửa lỗi", title: "Sửa lỗi sai",
      hint: "Viết lại cả câu đúng (giữ dấu phẩy).",
      items: [
        { q: "My brother, that works in a bank, is very rich.",
          ans: ["My brother, who works in a bank, is very rich."], why: "Có dấu phẩy → không dùng that." },
        { q: "Paris, I visited last summer, is beautiful.",
          ans: ["Paris, which I visited last summer, is beautiful."], why: "Non-defining không được bỏ đại từ." },
        { q: "She didn't call me, that made me sad.",
          ans: ["She didn't call me, which made me sad.", "She did not call me, which made me sad."], why: "Thay cả mệnh đề → which." },
        { q: "Mr. Tuan, who he teaches us maths, is very strict.",
          ans: ["Mr. Tuan, who teaches us maths, is very strict.", "Mr. Tuan, who teaches us math, is very strict."], why: "Thừa 'he'." },
      ] },

    { type: "typed", key: "C", time: "3 phút · Nối câu", title: "Nối câu bằng mệnh đề có dấu phẩy",
      items: [
        { q: "My grandmother is 85. She still cooks every day.",
          ans: ["My grandmother, who is 85, still cooks every day."], why: "Bà chỉ có 1 → non-defining." },
        { q: "I passed the exam. This made my parents happy.",
          ans: ["I passed the exam, which made my parents happy."], why: "This = cả việc đỗ → , which." },
        { q: "Ha Long Bay is beautiful. Millions of tourists visit it every year.",
          ans: ["Ha Long Bay, which millions of tourists visit every year, is beautiful.", "Ha Long Bay, which is visited by millions of tourists every year, is beautiful.", "Ha Long Bay, which is beautiful, is visited by millions of tourists every year."],
          why: "Tên riêng → non-defining; it → which." },
      ] },

    { type: "writing", time: "3 phút · Tự viết", title: "Viết về người và nơi bạn biết",
      hint: "4 câu có dấu phẩy: 1 câu <b>, who</b> (về một người thân), 1 câu <b>, which</b> (về một thành phố), 1 câu <b>, whose</b>, 1 câu <b>, which</b> thay cả mệnh đề.",
      placeholder: "1. My mother, who ...\n2. ...\n3. ...\n4. ..." },
  ],
};
</script>

</body>
</html>
