<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  /* Layout: one reading column; lessons are stacked sections, a sticky save/score bar at the bottom. */
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #646d7d;
    --line: #dfe3ea; --accent: #2b5fd0; --accent-soft: #e5ecfb; --on-accent: #ffffff;
    --ok: #1b7543; --ok-soft: #e1f3e8; --bad: #b3261e; --bad-soft: #fbe6e4;
    --warn-soft: #fbf1d6; --shadow: rgba(20, 30, 50, .10);
    --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --card: #1d2129; --text: #e7e9ee; --muted: #9aa3b2;
      --line: #2f3542; --accent: #82a8ff; --accent-soft: #233150; --on-accent: #0f1626;
      --ok: #62cf93; --ok-soft: #173326; --bad: #ff8d84; --bad-soft: #3b201e;
      --warn-soft: #3a3322; --shadow: rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --card: #1d2129; --text: #e7e9ee; --muted: #9aa3b2;
    --line: #2f3542; --accent: #82a8ff; --accent-soft: #233150; --on-accent: #0f1626;
    --ok: #62cf93; --ok-soft: #173326; --bad: #ff8d84; --bad-soft: #3b201e;
    --warn-soft: #3a3322; --shadow: rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 760px; margin: 0 auto; padding-block: 24px 40px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 4px; text-wrap: balance; }
  h2 { font-size: 1.2rem; margin: 0 0 4px; text-wrap: balance; }
  h3 { font-size: 1.05rem; margin: 16px 0 6px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .back-link { display: inline-block; font-size: .9rem; margin-bottom: 12px; text-decoration: none; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .time { display: inline-block; font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; margin-bottom: 10px; }
  .hint { color: var(--muted); font-size: .92rem; margin: 0 0 14px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; margin: 10px 0; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .box { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  .warn { background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  em.g { font-style: normal; font-weight: 700; color: var(--accent); }
  s { color: var(--bad); }

  .status { display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.cloud .dot { background: var(--ok); }
  .status.error .dot { background: var(--bad); }

  .feedback { border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .feedback b { color: var(--ok); }
  .feedback p { margin: 4px 0 0; white-space: pre-line; color: var(--text); }

  .q { padding: 12px 0; border-top: 1px solid var(--line); }
  .q:first-child { border-top: 0; padding-top: 0; }
  .q p { margin: 0 0 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; }
  .opts button, .btn, .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; text-align: left; }
  .opts button:hover:not(:disabled), .chip:hover, .btn:hover { border-color: var(--accent); }
  .opts button:disabled { cursor: default; }
  .opts button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .opts button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.danger { color: var(--bad); border-color: var(--bad); }
  input[type=text], textarea { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input.short { max-width: 260px; }
  textarea { min-height: 160px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input:not(.short) { flex: 1; min-width: 0; }
  .fb { margin-top: 8px; font-size: .93rem; border-radius: 8px; padding: 8px 10px; }
  .fb.ok { background: var(--ok-soft); color: var(--ok); }
  .fb.no { background: var(--bad-soft); color: var(--bad); }
  .fb .why { color: var(--text); display: block; margin-top: 4px; }

  .built { min-height: 44px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px;
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .pool { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { padding: 4px 10px; }
  .built .chip { background: var(--accent-soft); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { perspective: 800px; height: 160px; cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: .95rem; }
  .face-front { background: var(--accent-soft); font-weight: 700; font-size: 1.1rem; }
  .face-back { background: var(--bg); transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) { .card-inner { transition: none; } }

  .scorebar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between;
    align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 4px 16px var(--shadow); }
  .scorebar .meta { display: flex; flex-direction: column; font-size: .9rem; min-width: 0; }
  .scorebar .meta b { font-variant-numeric: tabular-nums; }
  .scorebar .meta small { color: var(--muted); }
  .tools { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }

  .phase h2 { margin-bottom: 10px; }
  .lesson { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0;
    border-top: 1px solid var(--line); text-decoration: none; color: var(--text); }
  .phase .lesson:first-of-type { border-top: 0; }
  .lesson:hover b { color: var(--accent); }
  .lesson span:first-child { min-width: 0; }
  .lesson small { color: var(--muted); display: block; }
  .badge { white-space: nowrap; font-size: .8rem; padding: 2px 10px; border-radius: 999px;
    color: var(--muted); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .badge.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .badge.partial { color: var(--accent); border-color: var(--accent); }
</style>

<script>window.COURSE = {"phases":[{"name":"Giai đoạn 1 — Câu phức (tuần 1–4)","lessons":[{"id":"19.1","title":"Relative clauses — xác định","desc":"who / which / that / whose / where / when","data":{"id":"19.1","title":"Relative Clauses — mệnh đề quan hệ xác định","sub":"Giai đoạn 1 · 30 phút · who / which / that / whose / where / when","sections":[{"type":"mcq","key":"W","time":"4 phút · Warm-up","title":"Kiểm tra nhanh bài cũ","hint":"4 câu chẩn đoán từ các bài đã học — giúp tôi biết phần nào cần ôn lại.","items":[{"q":"She said she ___ the film before.","opts":["has seen","had seen","saw"],"a":1,"why":"Reported speech: present perfect → past perfect khi lùi thì.","tag":"Reported speech"},{"q":"The bridge ___ in 1990.","opts":["built","was built","has built"],"a":1,"why":"Cây cầu không tự xây → bị động: was built.","tag":"Passive"},{"q":"If I ___ more time, I would learn Japanese.","opts":["have","had","would have"],"a":1,"why":"Second conditional: If + past simple, would + V.","tag":"2nd conditional"},{"q":"I've lived here ___ 2019.","opts":["for","since","from"],"a":1,"why":"since + mốc thời gian; for + khoảng thời gian.","tag":"Present perfect"}]},{"type":"explain","time":"6 phút · Hiểu logic","title":"Mệnh đề quan hệ dùng để làm gì?","html":"\n      <p><b>Logic:<\/b> mệnh đề quan hệ <b>xác định danh từ nào<\/b> bạn đang nói tới. Nó ghép 2 câu thành 1, thay danh từ lặp lại bằng một đại từ quan hệ.<\/p>\n      <div class=\"box\">I know <b>a girl<\/b>. <b>She<\/b> speaks five languages.<br>→ I know a girl <em class=\"g\">who<\/em> speaks five languages.<\/div>\n      <table>\n        <tr><th>Từ<\/th><th>Thay cho<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td><b>who<\/b><\/td><td>người<\/td><td>The man <em class=\"g\">who<\/em> called you is my boss.<\/td><\/tr>\n        <tr><td><b>which<\/b><\/td><td>vật / con vật<\/td><td>The phone <em class=\"g\">which<\/em> I bought is broken.<\/td><\/tr>\n        <tr><td><b>that<\/b><\/td><td>người hoặc vật (chỉ trong mệnh đề xác định)<\/td><td>The book <em class=\"g\">that<\/em> you lent me is great.<\/td><\/tr>\n        <tr><td><b>whose<\/b> + N<\/td><td>sở hữu (của ai / của cái gì)<\/td><td>I have a friend <em class=\"g\">whose<\/em> father is a pilot.<\/td><\/tr>\n        <tr><td><b>where<\/b><\/td><td>nơi chốn (= in/at which)<\/td><td>This is the café <em class=\"g\">where<\/em> we met.<\/td><\/tr>\n        <tr><td><b>when<\/b><\/td><td>thời gian (= on/in which)<\/td><td>I remember the day <em class=\"g\">when<\/em> I passed the exam.<\/td><\/tr>\n      <\/table>\n      <h3>3 quy tắc quan trọng<\/h3>\n      <div class=\"warn\"><b>① Không lặp lại chủ ngữ/tân ngữ<\/b> — lỗi rất phổ biến của người Việt:<br>\n        The man who I met <s>him<\/s> yesterday… → The man who I met yesterday…<\/div>\n      <div class=\"warn\"><b>② Được bỏ who/which/that khi nó là TÂN NGỮ<\/b> (phía sau còn chủ ngữ khác):<br>\n        The film <s>(that)<\/s> <b>we<\/b> watched was boring. ✔ bỏ được<br>\n        The film <b>that<\/b> won the prize was boring. ✘ không bỏ được (that là chủ ngữ của \"won\")<\/div>\n      <div class=\"warn\"><b>③ where vs which<\/b> — sau <b>where<\/b> là một câu đầy đủ; <b>which<\/b> thì câu sau thiếu chủ ngữ/tân ngữ:<br>\n        This is the hotel <b>where<\/b> we stayed. (stayed <i>in it<\/i> → nơi chốn)<br>\n        This is the hotel <b>which<\/b> we booked. (booked <i>it<\/i> → tân ngữ)<\/div>"},{"type":"cards","time":"3 phút · Flashcards","title":"Lật thẻ để ghi nhớ","hint":"Nhìn mặt trước, tự nói đáp án trong đầu, rồi bấm để lật.","items":[["who","người — chủ ngữ hoặc tân ngữ<br><i>the teacher who helped me<\/i>"],["which","vật, con vật<br><i>the laptop which I use<\/i>"],["whose + N","sở hữu<br><i>a boy whose bike was stolen<\/i>"],["where","nơi chốn + câu đầy đủ<br><i>the town where I grew up<\/i>"],["when","thời gian<br><i>the year when we met<\/i>"],["Bỏ đại từ khi nào?","Khi nó là TÂN NGỮ<br><i>the cake (that) she made<\/i>"]]},{"type":"mcq","key":"M","time":"5 phút · Trắc nghiệm","title":"Chọn đại từ quan hệ đúng","hint":"Mỗi câu chỉ được chọn 1 lần. Đọc kỹ giải thích khi sai.","items":[{"q":"The woman ___ lives next door is a doctor.","opts":["who","which","whose"],"a":0,"why":"Người + làm chủ ngữ của 'lives' → who."},{"q":"This is the restaurant ___ we had our first date.","opts":["which","where","who"],"a":1,"why":"Sau chỗ trống là câu đầy đủ 'we had our first date' → nơi chốn → where."},{"q":"I met a man ___ son plays for Hanoi FC.","opts":["who","whose","that"],"a":1,"why":"'___ son' = con trai CỦA ông ấy → whose."},{"q":"The bag ___ I left on the bus had my passport in it.","opts":["who","where","which"],"a":2,"why":"Cái túi (vật) là tân ngữ của 'left' → which (hoặc that, hoặc bỏ)."},{"q":"Do you remember the day ___ we first met?","opts":["when","which","where"],"a":0,"why":"the day + câu đầy đủ → thời gian → when."},{"q":"The museum ___ we visited was closed on Mondays.","opts":["where","which","whose"],"a":1,"why":"visited the museum → museum là TÂN NGỮ của 'visited' → which, không phải where."},{"q":"Students ___ homework is late will lose points.","opts":["who","whose","which"],"a":1,"why":"bài tập CỦA học sinh → whose + homework."},{"q":"Which sentence is CORRECT?","opts":["The car that I bought it is red.","The car I bought is red.","The car where I bought is red."],"a":1,"why":"Car là tân ngữ → bỏ được that. Câu 1 thừa 'it'; câu 3 sai 'where'."}]},{"type":"typed","key":"E","time":"5 phút · Sửa lỗi","title":"Mỗi câu có 1 lỗi — viết lại câu đúng","hint":"Gõ lại cả câu đã sửa rồi bấm Kiểm tra (hoặc Enter).","items":[{"q":"The girl who she sits next to me is very funny.","ans":["The girl who sits next to me is very funny.","The girl that sits next to me is very funny."],"why":"Thừa 'she' — who đã là chủ ngữ rồi."},{"q":"I lost the watch who my dad gave me.","ans":["I lost the watch which my dad gave me.","I lost the watch that my dad gave me.","I lost the watch my dad gave me."],"why":"Đồng hồ là vật → which/that (hoặc bỏ), không dùng who."},{"q":"That's the man whose his car was stolen.","ans":["That's the man whose car was stolen.","That is the man whose car was stolen."],"why":"whose đã mang nghĩa 'của ông ấy' → bỏ 'his'."},{"q":"The city which I was born is very small.","ans":["The city where I was born is very small.","The city in which I was born is very small.","The city which I was born in is very small.","The city that I was born in is very small.","The city I was born in is very small."],"why":"'I was born' là câu đầy đủ, cần 'in' → where (= in which)."},{"q":"The movie that we watched it last night was amazing.","ans":["The movie that we watched last night was amazing.","The movie which we watched last night was amazing.","The movie we watched last night was amazing."],"why":"Thừa 'it' — that đã là tân ngữ của 'watched'."}]},{"type":"typed","key":"C","time":"4 phút · Nối câu","title":"Nối 2 câu thành 1 bằng mệnh đề quan hệ","hint":"Không dùng dấu phẩy. Có thể có nhiều đáp án đúng.","items":[{"q":"I have a neighbour. She keeps three cats.","ans":["I have a neighbour who keeps three cats.","I have a neighbour that keeps three cats.","I have a neighbor who keeps three cats.","I have a neighbor that keeps three cats."],"why":"She → who (người, chủ ngữ)."},{"q":"This is the laptop. I bought it last week.","ans":["This is the laptop which I bought last week.","This is the laptop that I bought last week.","This is the laptop I bought last week."],"why":"it → which/that (tân ngữ) — có thể bỏ."},{"q":"I know a boy. His mother is a famous singer.","ans":["I know a boy whose mother is a famous singer."],"why":"His mother → whose mother."},{"q":"We visited the village. My grandparents live there.","ans":["We visited the village where my grandparents live.","We visited the village in which my grandparents live.","We visited the village which my grandparents live in.","We visited the village that my grandparents live in.","We visited the village my grandparents live in."],"why":"there → where."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Viết về cuộc sống của bạn","hint":"Viết 4 câu, mỗi câu dùng một từ: <b>who<\/b>, <b>which/that<\/b>, <b>whose<\/b>, <b>where<\/b>. Ví dụ: <i>I have a colleague whose hobby is running marathons.<\/i>","placeholder":"1. ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"19.2","title":"Relative clauses — không xác định","desc":"dấu phẩy, không dùng that","data":{"id":"19.2","title":"Relative Clauses — mệnh đề quan hệ không xác định","sub":"Giai đoạn 1 · 30 phút · dấu phẩy, không dùng that, which thay cả mệnh đề","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 19.1","title":"Warm-up","items":[{"q":"The house ___ we rented was near the beach.","opts":["which","where","who"],"a":0,"why":"rented the house → house là tân ngữ → which (không phải where).","tag":"where vs which"},{"q":"I talked to a woman ___ daughter studies in Japan.","opts":["who","whose","which"],"a":1,"why":"con gái CỦA bà ấy → whose.","tag":"whose"},{"q":"The man who ___ me the way was very kind.","opts":["showed","he showed","showing"],"a":0,"why":"who đã là chủ ngữ → không thêm 'he'.","tag":"thừa đại từ"},{"q":"This is the gym ___ I work out every morning.","opts":["which","where","that"],"a":1,"why":"'I work out' là câu đầy đủ → nơi chốn → where.","tag":"where vs which"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Xác định vs Không xác định","html":"\n      <p><b>Câu hỏi then chốt:<\/b> nếu bỏ mệnh đề đi, người nghe có còn biết bạn đang nói về <i>ai / cái gì<\/i> không?<\/p>\n      <table>\n        <tr><th><\/th><th>Xác định (defining)<\/th><th>Không xác định (non-defining)<\/th><\/tr>\n        <tr><td>Chức năng<\/td><td>Cần để biết <b>là ai / cái nào<\/b><\/td><td>Chỉ <b>thêm thông tin<\/b>, đã biết là ai rồi<\/td><\/tr>\n        <tr><td>Dấu phẩy<\/td><td>Không<\/td><td><b>Có<\/b> (2 đầu)<\/td><\/tr>\n        <tr><td>that<\/td><td>Dùng được<\/td><td><b>KHÔNG<\/b> dùng<\/td><\/tr>\n        <tr><td>Bỏ đại từ<\/td><td>Được (nếu là tân ngữ)<\/td><td><b>KHÔNG<\/b> được bỏ<\/td><\/tr>\n      <\/table>\n      <div class=\"box\">\n        My brother <b>who lives in Da Nang<\/b> is a doctor.<br>\n        → Tôi có <i>nhiều<\/i> anh trai; tôi đang nói người sống ở Đà Nẵng.<br><br>\n        My brother<b>, who lives in Da Nang,<\/b> is a doctor.<br>\n        → Tôi chỉ có <i>một<\/i> anh trai; \"sống ở Đà Nẵng\" chỉ là thông tin thêm.\n      <\/div>\n      <h3>Khi nào gần như luôn dùng dấu phẩy?<\/h3>\n      <p>Sau <b>tên riêng<\/b> (Hanoi, Messi, Mr. Nam), <b>người duy nhất<\/b> (my mother, my father), hoặc vật đã được xác định rõ.<\/p>\n      <div class=\"warn\"><b>which thay cho cả mệnh đề phía trước:<\/b><br>\n        He passed the exam<b>, which<\/b> surprised everyone. (cái gây ngạc nhiên = việc anh ấy đỗ)<br>\n        <s>He passed the exam, that surprised everyone.<\/s> ✘<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["Non-defining = ?","Thông tin thêm<br>bỏ đi câu vẫn rõ nghĩa"],["Dấu phẩy?","Có, ở cả 2 đầu mệnh đề<br><i>Hue, which is in central Vietnam, ...<\/i>"],["Dùng that?","KHÔNG trong mệnh đề có dấu phẩy"],["Bỏ who/which?","KHÔNG được bỏ trong non-defining"],[", which ...","Thay cho cả mệnh đề trước<br><i>It rained, which ruined our trip.<\/i>"]]},{"type":"mcq","key":"M","time":"5 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"Hanoi, ___ is the capital of Vietnam, has over 8 million people.","opts":["which","that","where"],"a":0,"why":"Có dấu phẩy → không dùng that. Hanoi là chủ ngữ của 'is' → which."},{"q":"My mother, ___ is 60, still goes jogging every day.","opts":["who","that","whose"],"a":0,"why":"Người + có dấu phẩy → who."},{"q":"He failed the test, ___ surprised everyone.","opts":["which","that","what"],"a":0,"why":"which thay cho cả việc 'anh ấy trượt'."},{"q":"Which sentence means 'I have only ONE sister'?","opts":["My sister who lives in Hue is a nurse.","My sister, who lives in Hue, is a nurse."],"a":1,"why":"Có dấu phẩy → thông tin thêm → chỉ có 1 chị/em gái."},{"q":"'The students who studied hard passed the exam.' nghĩa là:","opts":["Tất cả học sinh đều đỗ","Chỉ những học sinh học chăm mới đỗ"],"a":1,"why":"Không phẩy → xác định → chỉ nhóm học sinh học chăm."},{"q":"'The students, who studied hard, passed the exam.' nghĩa là:","opts":["Tất cả học sinh (và họ đều học chăm) đã đỗ","Chỉ một số học sinh đỗ"],"a":0,"why":"Có phẩy → thông tin thêm về TẤT CẢ học sinh."},{"q":"Mr. Nam, ___ car I borrowed, is my neighbour.","opts":["who","whose","which"],"a":1,"why":"xe CỦA ông Nam → whose."},{"q":"We stayed at the Sunrise Hotel, ___ we had a great view of the sea.","opts":["which","where","that"],"a":1,"why":"'we had a great view' là câu đầy đủ → nơi chốn → where."}]},{"type":"mcq","key":"P","time":"4 phút · Dấu phẩy","title":"Câu này có cần dấu phẩy không?","hint":"Hãy tự hỏi: bỏ mệnh đề đi, có còn biết là ai/cái gì không?","items":[{"q":"My father who is a teacher loves reading.","opts":["Cần dấu phẩy","Không cần"],"a":0,"why":"Bạn chỉ có 1 bố → thông tin thêm → My father, who is a teacher, loves reading."},{"q":"The people who work here are very friendly.","opts":["Cần dấu phẩy","Không cần"],"a":1,"why":"Cần biết 'những người nào' → xác định."},{"q":"Messi who was born in Argentina is a famous footballer.","opts":["Cần dấu phẩy","Không cần"],"a":0,"why":"Tên riêng đã xác định → non-defining."},{"q":"I lost the book that you gave me.","opts":["Cần dấu phẩy","Không cần"],"a":1,"why":"Cần biết 'quyển sách nào'. Có 'that' → chắc chắn là defining."},{"q":"Da Lat which I visited last year is famous for its flowers.","opts":["Cần dấu phẩy","Không cần"],"a":0,"why":"Tên riêng → Da Lat, which I visited last year, is ..."}]},{"type":"typed","key":"E","time":"4 phút · Sửa lỗi","title":"Sửa lỗi sai","hint":"Viết lại cả câu đúng (giữ dấu phẩy).","items":[{"q":"My brother, that works in a bank, is very rich.","ans":["My brother, who works in a bank, is very rich."],"why":"Có dấu phẩy → không dùng that."},{"q":"Paris, I visited last summer, is beautiful.","ans":["Paris, which I visited last summer, is beautiful."],"why":"Non-defining không được bỏ đại từ."},{"q":"She didn't call me, that made me sad.","ans":["She didn't call me, which made me sad.","She did not call me, which made me sad."],"why":"Thay cả mệnh đề → which."},{"q":"Mr. Tuan, who he teaches us maths, is very strict.","ans":["Mr. Tuan, who teaches us maths, is very strict.","Mr. Tuan, who teaches us math, is very strict."],"why":"Thừa 'he'."}]},{"type":"typed","key":"C","time":"3 phút · Nối câu","title":"Nối câu bằng mệnh đề có dấu phẩy","items":[{"q":"My grandmother is 85. She still cooks every day.","ans":["My grandmother, who is 85, still cooks every day."],"why":"Bà chỉ có 1 → non-defining."},{"q":"I passed the exam. This made my parents happy.","ans":["I passed the exam, which made my parents happy."],"why":"This = cả việc đỗ → , which."},{"q":"Ha Long Bay is beautiful. Millions of tourists visit it every year.","ans":["Ha Long Bay, which millions of tourists visit every year, is beautiful.","Ha Long Bay, which is visited by millions of tourists every year, is beautiful.","Ha Long Bay, which is beautiful, is visited by millions of tourists every year."],"why":"Tên riêng → non-defining; it → which."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Viết về người và nơi bạn biết","hint":"4 câu có dấu phẩy: 1 câu <b>, who<\/b> (về một người thân), 1 câu <b>, which<\/b> (về một thành phố), 1 câu <b>, whose<\/b>, 1 câu <b>, which<\/b> thay cả mệnh đề.","placeholder":"1. My mother, who ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"20","title":"Relative clauses nâng cao","desc":"bỏ đại từ, giới từ + which, rút gọn","data":{"id":"20","title":"Relative Clauses nâng cao — rút gọn & giới từ","sub":"Giai đoạn 1 · 30 phút · bỏ đại từ, giới từ + which/whom, V-ing / V3 rút gọn","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 19","title":"Warm-up","items":[{"q":"Lan, ___ you met yesterday, is my cousin.","opts":["who","that","which"],"a":0,"why":"Có dấu phẩy → không dùng that.","tag":"non-defining"},{"q":"He forgot my birthday, ___ really upset me.","opts":["which","that","what"],"a":0,"why":", which thay cả mệnh đề.","tag":"non-defining"},{"q":"The Eiffel Tower, ___ was built in 1889, is in Paris.","opts":["which","that","where"],"a":0,"why":"Tên riêng + chủ ngữ của 'was built' → which.","tag":"non-defining"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"3 cách làm câu gọn hơn","html":"\n      <h3>① Bỏ đại từ quan hệ khi nó là TÂN NGỮ<\/h3>\n      <div class=\"box\">The song <s>that<\/s> I love → The song <b>I love<\/b><\/div>\n      <h3>② Giới từ: đặt cuối (thân mật) hoặc đầu (trang trọng)<\/h3>\n      <div class=\"box\">\n        the house <b>(which)<\/b> I live <b>in<\/b> &nbsp;— văn nói<br>\n        the house <b>in which<\/b> I live &nbsp;— văn viết<br>\n        the person <b>(who)<\/b> I spoke <b>to<\/b> = the person <b>to whom<\/b> I spoke\n      <\/div>\n      <div class=\"warn\">Sau giới từ chỉ dùng <b>which<\/b> (vật) và <b>whom<\/b> (người). <s>in that<\/s>, <s>to who<\/s> ✘<\/div>\n      <h3>③ Rút gọn mệnh đề thành V-ing hoặc V3<\/h3>\n      <table>\n        <tr><th>Nghĩa<\/th><th>Đầy đủ<\/th><th>Rút gọn<\/th><\/tr>\n        <tr><td><b>Chủ động<\/b> → V-ing<\/td><td>the girl <s>who is<\/s> singing<\/td><td>the girl <em class=\"g\">singing<\/em><\/td><\/tr>\n        <tr><td><b>Chủ động<\/b> → V-ing<\/td><td>people <s>who want<\/s> to join<\/td><td>people <em class=\"g\">wanting<\/em> to join<\/td><\/tr>\n        <tr><td><b>Bị động<\/b> → V3<\/td><td>cars <s>which are<\/s> made in Japan<\/td><td>cars <em class=\"g\">made<\/em> in Japan<\/td><\/tr>\n        <tr><td>the first/last/only → to V<\/td><td>the first person <s>who arrived<\/s><\/td><td>the first person <em class=\"g\">to arrive<\/em><\/td><\/tr>\n      <\/table>\n      <p><b>Mẹo:<\/b> danh từ <i>tự làm<\/i> hành động → V-ing. Danh từ <i>bị<\/i> làm → V3.<\/p>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["Bỏ đại từ","khi là tân ngữ<br><i>the film (that) we saw<\/i>"],["giới từ + which / whom","<i>the city in which I live<\/i><br><i>the man to whom I spoke<\/i>"],["Rút gọn chủ động","V-ing<br><i>the man standing there<\/i>"],["Rút gọn bị động","V3<br><i>the money stolen from the bank<\/i>"],["the first / only + ?","to V<br><i>the only one to pass<\/i>"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"The man ___ to my mother is my teacher.","opts":["talking","talked","is talking"],"a":0,"why":"Người đàn ông tự nói chuyện (chủ động) → talking."},{"q":"Most of the phones ___ in this factory are exported.","opts":["making","made","make"],"a":1,"why":"Điện thoại được sản xuất (bị động) → made."},{"q":"This is the person ___ I spoke.","opts":["to whom","whom","to who"],"a":0,"why":"speak to someone → to whom. Sau giới từ không dùng who."},{"q":"The company ___ he works is in District 1.","opts":["for which","which","for that"],"a":0,"why":"work for a company → for which. Không dùng 'for that'."},{"q":"Anyone ___ to join the club should email me.","opts":["wanting","wanted","wants"],"a":0,"why":"who wants → wanting (chủ động)."},{"q":"She was the first woman ___ the race.","opts":["to win","winning","won"],"a":0,"why":"the first + to V."},{"q":"Which sentence is WRONG?","opts":["The book I'm reading is long.","The book is on the table is mine.","The book on the table is mine."],"a":1,"why":"Không được bỏ 'which' khi nó là CHỦ NGỮ: The book (which is) on the table → hoặc giữ cả 'which is', hoặc bỏ cả 2."},{"q":"The houses ___ by the flood will be rebuilt.","opts":["destroying","destroyed","were destroyed"],"a":1,"why":"Nhà bị lũ phá → bị động → destroyed."}]},{"type":"typed","key":"T","time":"6 phút · Viết lại câu","title":"Rút gọn câu theo yêu cầu","items":[{"q":"The woman who is sitting next to Nam is his wife. <i>(rút gọn)<\/i>","ans":["The woman sitting next to Nam is his wife."],"why":"who is sitting → sitting."},{"q":"The letters which were sent yesterday haven't arrived. <i>(rút gọn)<\/i>","ans":["The letters sent yesterday haven't arrived.","The letters sent yesterday have not arrived."],"why":"which were sent → sent (bị động)."},{"q":"The music that I listen to is mostly jazz. <i>(bỏ đại từ)<\/i>","ans":["The music I listen to is mostly jazz."],"why":"that là tân ngữ → bỏ được."},{"q":"This is the town in which I grew up. <i>(giới từ ra cuối, bỏ which)<\/i>","ans":["This is the town I grew up in."],"why":"in which → ... grew up in."},{"q":"Students who want to take the test must register online. <i>(rút gọn)<\/i>","ans":["Students wanting to take the test must register online."],"why":"who want → wanting."}]},{"type":"order","key":"O","time":"3 phút · Sắp xếp","title":"Sắp xếp thành câu đúng","hint":"Bấm vào từ để thêm vào câu; bấm lại để bỏ ra.","items":[{"words":"The man|sitting|next to me|was reading|a newspaper","why":"sitting next to me = who was sitting next to me."},{"words":"Is this|the key|you were|looking for","why":"Bỏ that (tân ngữ), giới từ 'for' ở cuối."},{"words":"The language|spoken|in Brazil|is|Portuguese","why":"spoken = which is spoken (bị động)."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Viết 4 câu","hint":"1 câu bỏ đại từ · 1 câu giới từ + which/whom · 1 câu rút gọn V-ing · 1 câu rút gọn V3.","placeholder":"1. The app I use most is ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"21","title":"Gerund vs Infinitive","desc":"enjoy doing / decide to do / stop, remember, try","data":{"id":"21","title":"Gerund vs Infinitive — V-ing hay to V?","sub":"Giai đoạn 1 · 30 phút · enjoy doing / decide to do / stop, remember, try","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 20","title":"Warm-up","items":[{"q":"The boy ___ in the corner is my son.","opts":["standing","stood","stands"],"a":0,"why":"Chủ động → V-ing.","tag":"reduced RC"},{"q":"The bridge ___ last year is already damaged.","opts":["built","building","was built"],"a":0,"why":"Bị động → V3.","tag":"reduced RC"},{"q":"This is the flat ___ I lived for two years.","opts":["in which","which","in that"],"a":0,"why":"live in the flat → in which.","tag":"preposition + which"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Khi nào V-ing, khi nào to V?","html":"\n      <p><b>Logic chung (không tuyệt đối nhưng rất hữu ích):<\/b> <b>to V<\/b> thường hướng về <i>tương lai / mục đích<\/i> (want, plan, decide — việc chưa xảy ra). <b>V-ing<\/b> thường nói về <i>hoạt động nói chung / đã, đang trải qua<\/i> (enjoy, finish, avoid).<\/p>\n      <table>\n        <tr><th>+ V-ing<\/th><th>+ to V<\/th><\/tr>\n        <tr><td>enjoy, mind, avoid, finish, keep, suggest, consider, practise, give up, can't stand<\/td>\n            <td>want, decide, plan, hope, agree, refuse, promise, manage, afford, learn, would like<\/td><\/tr>\n        <tr><td><b>Sau giới từ<\/b>: interested in <em class=\"g\">doing<\/em>, good at <em class=\"g\">cooking<\/em>, thank you for <em class=\"g\">helping<\/em><\/td>\n            <td><b>Sau tính từ<\/b>: easy <em class=\"g\">to learn<\/em>, happy <em class=\"g\">to help<\/em><br><b>Mục đích<\/b>: I came <em class=\"g\">to see<\/em> you.<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\"><b>Bẫy:<\/b> look forward <b>to<\/b>, be used <b>to<\/b>, object <b>to<\/b> — \"to\" ở đây là GIỚI TỪ → + V-ing.<br>\n        I look forward to <s>hear<\/s> <b>hearing<\/b> from you.<\/div>\n      <h3>Động từ đổi nghĩa<\/h3>\n      <table>\n        <tr><th>Động từ<\/th><th>+ V-ing<\/th><th>+ to V<\/th><\/tr>\n        <tr><td>stop<\/td><td>ngừng hẳn việc đó<br><i>stop smoking<\/i><\/td><td>dừng lại <b>để<\/b> làm việc khác<br><i>stop to buy bread<\/i><\/td><\/tr>\n        <tr><td>remember / forget<\/td><td>nhớ/quên việc <b>đã làm<\/b><br><i>I remember meeting her.<\/i><\/td><td>nhớ/quên việc <b>cần làm<\/b><br><i>Remember to lock the door.<\/i><\/td><\/tr>\n        <tr><td>try<\/td><td>thử một cách xem có hiệu quả<br><i>try restarting it<\/i><\/td><td>cố gắng (khó)<br><i>try to lift the box<\/i><\/td><\/tr>\n        <tr><td>regret<\/td><td>hối hận đã làm<br><i>I regret saying that.<\/i><\/td><td>lấy làm tiếc phải báo<br><i>We regret to inform you...<\/i><\/td><\/tr>\n      <\/table>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["enjoy / avoid / finish","+ V-ing<br><i>I avoid eating late.<\/i>"],["want / decide / plan","+ to V<br><i>We plan to travel.<\/i>"],["look forward to","+ V-ing (to là giới từ)"],["stop doing vs stop to do","ngừng hẳn vs dừng lại để làm"],["remember doing vs to do","nhớ đã làm vs nhớ phải làm"],["try doing vs try to do","thử cách khác vs cố gắng"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"I enjoy ___ to music while I work.","opts":["listening","to listen","listen"],"a":0,"why":"enjoy + V-ing."},{"q":"We decided ___ a new car.","opts":["buying","to buy","buy"],"a":1,"why":"decide + to V."},{"q":"I'm looking forward to ___ you.","opts":["see","seeing","to see"],"a":1,"why":"look forward to (giới từ) + V-ing."},{"q":"He stopped ___ because it was bad for his health.","opts":["smoking","to smoke"],"a":0,"why":"Ngừng hẳn thói quen → stop + V-ing."},{"q":"On the way home, I stopped ___ some bread.","opts":["buying","to buy"],"a":1,"why":"Dừng lại ĐỂ mua → stop + to V."},{"q":"Remember ___ the door when you leave.","opts":["locking","to lock"],"a":1,"why":"Việc cần làm trong tương lai → to V."},{"q":"I remember ___ this film when I was a child.","opts":["watching","to watch"],"a":0,"why":"Nhớ việc đã làm → V-ing."},{"q":"My laptop wouldn't start, so I tried ___ it.","opts":["restarting","to restart"],"a":0,"why":"Thử một cách xem có hiệu quả không → try + V-ing."},{"q":"She is interested in ___ abroad.","opts":["study","studying","to study"],"a":1,"why":"Sau giới từ in → V-ing."},{"q":"Would you mind ___ the window?","opts":["to open","opening","open"],"a":1,"why":"mind + V-ing."}]},{"type":"typed","key":"G","short":true,"time":"5 phút · Điền từ","title":"Chia động từ trong ngoặc","hint":"Chỉ gõ phần điền vào chỗ trống.","items":[{"q":"I can't afford ___ (buy) a new phone.","ans":["to buy"],"why":"afford + to V."},{"q":"She avoided ___ (answer) my question.","ans":["answering"],"why":"avoid + V-ing."},{"q":"He promised ___ (not / be) late again.","ans":["not to be"],"why":"promise + not to V."},{"q":"It's difficult ___ (learn) Chinese characters.","ans":["to learn"],"why":"Sau tính từ → to V."},{"q":"They suggested ___ (go) to the beach.","ans":["going"],"why":"suggest + V-ing."},{"q":"I regret ___ (not / study) harder at school.","ans":["not studying","not having studied"],"why":"Hối hận việc đã (không) làm → V-ing."},{"q":"We managed ___ (finish) the project on time.","ans":["to finish"],"why":"manage + to V."},{"q":"Thank you for ___ (help) me.","ans":["helping"],"why":"Sau giới từ for → V-ing."}]},{"type":"typed","key":"E","time":"4 phút · Sửa lỗi","title":"Sửa lỗi sai","items":[{"q":"I want learning English to get a better job.","ans":["I want to learn English to get a better job."],"why":"want + to V."},{"q":"She is good at cook Vietnamese food.","ans":["She is good at cooking Vietnamese food.","She's good at cooking Vietnamese food."],"why":"good at + V-ing."},{"q":"He refused helping me.","ans":["He refused to help me."],"why":"refuse + to V."},{"q":"I look forward to hear from you.","ans":["I look forward to hearing from you."],"why":"look forward to + V-ing."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Viết về bản thân","hint":"4 câu: điều bạn <b>enjoy<\/b> làm · điều bạn <b>decided<\/b> làm năm nay · điều bạn đã <b>stopped<\/b> làm · điều bạn phải <b>remember<\/b> làm.","placeholder":"1. I enjoy ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"22","title":"Used to / would / be used to","desc":"thói quen quá khứ vs đã quen","data":{"id":"22","title":"Used to / would / be used to / get used to","sub":"Giai đoạn 1 · 30 phút · thói quen quá khứ vs đã quen với","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 21","title":"Warm-up","items":[{"q":"I'm thinking of ___ my job.","opts":["changing","to change","change"],"a":0,"why":"Sau giới từ of → V-ing.","tag":"gerund"},{"q":"Don't forget ___ me when you arrive.","opts":["to call","calling"],"a":0,"why":"Việc cần làm → to V.","tag":"forget to/-ing"},{"q":"They agreed ___ the price.","opts":["to lower","lowering"],"a":0,"why":"agree + to V.","tag":"infinitive"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"4 cấu trúc trông giống nhau nhưng nghĩa khác","html":"\n      <table>\n        <tr><th>Cấu trúc<\/th><th>Nghĩa<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td><b>used to + V<\/b><\/td><td>Thói quen / trạng thái <b>trong quá khứ<\/b>, <b>bây giờ không còn<\/b><\/td><td>I <em class=\"g\">used to live<\/em> in Hue. (giờ không sống ở đó nữa)<\/td><\/tr>\n        <tr><td><b>would + V<\/b><\/td><td>Hành động lặp lại trong quá khứ (kể chuyện, hoài niệm)<\/td><td>Every summer we <em class=\"g\">would swim<\/em> in the river.<\/td><\/tr>\n        <tr><td><b>be used to + V-ing / N<\/b><\/td><td><b>Đã quen<\/b> với (trạng thái)<\/td><td>I <em class=\"g\">am used to getting<\/em> up early.<\/td><\/tr>\n        <tr><td><b>get used to + V-ing / N<\/b><\/td><td><b>Dần quen<\/b> với (quá trình)<\/td><td>You'll <em class=\"g\">get used to<\/em> the noise.<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\"><b>would KHÔNG dùng cho trạng thái<\/b> (have, be, live, like, know…):<br>\n        <s>I would have long hair.<\/s> → I <b>used to<\/b> have long hair.<\/div>\n      <div class=\"warn\"><b>Phủ định / câu hỏi:<\/b> did → use (không có d):<br>\n        I <b>didn't use to<\/b> like coffee. · <b>Did<\/b> you <b>use to<\/b> play football?<\/div>\n      <div class=\"box\"><b>Mẹo phân biệt:<\/b> có <b>be / get<\/b> phía trước → \"to\" là giới từ → <b>V-ing<\/b>.<br>\n        Không có be/get → \"used to\" + <b>V nguyên mẫu<\/b>.<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["used to + V","quá khứ, giờ không còn"],["would + V","hành động lặp lại trong quá khứ<br>(không dùng cho trạng thái)"],["be used to + V-ing","đã quen với"],["get used to + V-ing","dần quen với"],["didn't ___ to","use (không có d)"],["I used to live vs I'm used to living","Đã từng sống (giờ thôi) vs Đã quen với việc sống"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"I ___ play football every weekend when I was a kid.","opts":["used to","am used to","use to"],"a":0,"why":"Thói quen quá khứ → used to + V."},{"q":"She ___ have long hair, but now it's short.","opts":["used to","would","is used to"],"a":0,"why":"'have' là trạng thái → không dùng would."},{"q":"I've lived in Hanoi for 10 years, so I ___ the traffic.","opts":["used to","am used to","get used to"],"a":1,"why":"Đã quen (trạng thái hiện tại) → am used to."},{"q":"It took me months to ___ driving on the left.","opts":["get used to","use to","used to"],"a":0,"why":"Quá trình làm quen → get used to."},{"q":"Did you ___ go to school by bike?","opts":["use to","used to"],"a":0,"why":"Sau did → use to."},{"q":"Every summer, my grandfather ___ take us fishing.","opts":["would","was used to","is used to"],"a":0,"why":"Hành động lặp lại trong quá khứ → would (hoặc used to)."},{"q":"I'm not used to ___ so early.","opts":["get up","getting up","got up"],"a":1,"why":"be used to + V-ing."},{"q":"We ___ have a dog, but it died last year.","opts":["would","used to","were used to"],"a":1,"why":"have a dog = trạng thái → used to."}]},{"type":"typed","key":"G","short":true,"time":"5 phút · Điền từ","title":"Dùng used to / be used to / get used to + động từ","hint":"Chỉ gõ phần điền vào chỗ trống.","items":[{"q":"When I was young, I ___ (eat) a lot of sweets.","ans":["used to eat","would eat"],"why":"Thói quen quá khứ."},{"q":"Don't worry. You'll soon ___ (work) at night.","ans":["get used to working"],"why":"will + get used to + V-ing."},{"q":"My dad ___ (not / like) coffee, but now he drinks it every day.","ans":["didn't use to like","did not use to like"],"why":"Phủ định: didn't use to; 'like' là trạng thái nên không dùng would."},{"q":"She is a nurse, so she ___ (work) long hours.","ans":["is used to working"],"why":"Đã quen → be used to + V-ing."},{"q":"I can't ___ (sleep) in this noisy room.","ans":["get used to sleeping"],"why":"can't + get used to + V-ing."},{"q":"In the past, people ___ (write) letters instead of emails.","ans":["used to write","would write"],"why":"Thói quen quá khứ."}]},{"type":"typed","key":"E","time":"4 phút · Sửa lỗi","title":"Sửa lỗi sai","items":[{"q":"I am used to get up at 6 a.m.","ans":["I am used to getting up at 6 a.m.","I'm used to getting up at 6 a.m."],"why":"be used to + V-ing."},{"q":"I use to play the piano when I was young.","ans":["I used to play the piano when I was young."],"why":"Khẳng định quá khứ → used to."},{"q":"When I was a child, I would have a cat.","ans":["When I was a child, I used to have a cat."],"why":"have = trạng thái → used to."},{"q":"Did you used to work here?","ans":["Did you use to work here?"],"why":"Sau did → use to."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Hồi nhỏ và bây giờ","hint":"4 câu so sánh tuổi thơ và hiện tại, dùng: <b>used to<\/b> · <b>would<\/b> · <b>be used to<\/b> · <b>get used to<\/b>.","placeholder":"1. When I was a child, I used to ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"23","title":"Indirect questions & tags","desc":"hỏi lịch sự, câu hỏi đuôi","data":{"id":"23","title":"Indirect Questions & Question Tags","sub":"Giai đoạn 1 · 30 phút · hỏi lịch sự và câu hỏi đuôi","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 22","title":"Warm-up","items":[{"q":"I ___ live in a small village, but now I live in the city.","opts":["used to","am used to"],"a":0,"why":"Quá khứ, giờ không còn.","tag":"used to"},{"q":"He's lived in the UK for years, so he ___ the weather.","opts":["is used to","used to"],"a":0,"why":"Đã quen → is used to.","tag":"be used to"},{"q":"When we were kids, we ___ play outside until dark.","opts":["would","were used to"],"a":0,"why":"Hành động lặp lại quá khứ → would.","tag":"would"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Hỏi lịch sự & hỏi để xác nhận","html":"\n      <h3>① Câu hỏi gián tiếp (Indirect questions)<\/h3>\n      <p>Dùng khi muốn hỏi <b>lịch sự<\/b>. Phần sau trở thành <b>câu khẳng định<\/b>: chủ ngữ trước động từ, <b>bỏ do/does/did<\/b>.<\/p>\n      <div class=\"box\">\n        Where <b>is<\/b> the station? → Could you tell me where the station <b>is<\/b>?<br>\n        What time <b>does<\/b> it start? → Do you know what time it <b>starts<\/b>?<br>\n        <b>Did<\/b> she call? → I wonder <b>if/whether<\/b> she called.\n      <\/div>\n      <p>Câu mở đầu thường gặp: <i>Could you tell me… / Do you know… / I wonder… / I'd like to know… / Do you have any idea…<\/i><\/p>\n      <div class=\"warn\">Câu hỏi Yes/No → thêm <b>if<\/b> hoặc <b>whether<\/b>.<\/div>\n      <h3>② Câu hỏi đuôi (Question tags)<\/h3>\n      <p>Dùng để <b>xác nhận<\/b> điều mình nghĩ là đúng. Quy tắc: khẳng định → đuôi phủ định, và ngược lại; dùng <b>trợ động từ<\/b> của câu.<\/p>\n      <table>\n        <tr><th>Câu<\/th><th>Đuôi<\/th><\/tr>\n        <tr><td>You <b>are<\/b> tired,<\/td><td><em class=\"g\">aren't you?<\/em><\/td><\/tr>\n        <tr><td>She <b>went<\/b> home, (past simple → did)<\/td><td><em class=\"g\">didn't she?<\/em><\/td><\/tr>\n        <tr><td>He <b>has<\/b> finished,<\/td><td><em class=\"g\">hasn't he?<\/em><\/td><\/tr>\n        <tr><td><b>I am<\/b> late,<\/td><td><em class=\"g\">aren't I?<\/em> (đặc biệt)<\/td><\/tr>\n        <tr><td><b>Let's<\/b> go,<\/td><td><em class=\"g\">shall we?<\/em><\/td><\/tr>\n        <tr><td>Close the door, (mệnh lệnh)<\/td><td><em class=\"g\">will you?<\/em><\/td><\/tr>\n        <tr><td><b>Nobody / Nothing / never<\/b> … (đã mang nghĩa phủ định)<\/td><td>đuôi <b>khẳng định<\/b>: Nobody came, <em class=\"g\">did they?<\/em><\/td><\/tr>\n      <\/table>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["Where is the bank?","Could you tell me where the bank <b>is<\/b>?"],["Does he live here?","Do you know <b>if<\/b> he lives here?"],["I'm right, ___?","aren't I?"],["Let's eat, ___?","shall we?"],["Nobody knows, ___?","do they?"],["He never lies, ___?","does he?"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"Could you tell me where ___?","opts":["is the bank","the bank is","does the bank"],"a":1,"why":"Câu gián tiếp → chủ ngữ + động từ."},{"q":"Do you know what time ___?","opts":["the film starts","does the film start","starts the film"],"a":0,"why":"Bỏ does, động từ chia theo chủ ngữ: starts."},{"q":"I wonder ___ he will come.","opts":["if","that","what"],"a":0,"why":"Câu hỏi Yes/No → if/whether."},{"q":"You're a student, ___?","opts":["aren't you","are you","don't you"],"a":0,"why":"Khẳng định với 'are' → aren't you."},{"q":"She went to Da Nang, ___?","opts":["didn't she","wasn't she","doesn't she"],"a":0,"why":"Past simple → did → didn't she."},{"q":"Let's have lunch, ___?","opts":["shall we","will we","don't we"],"a":0,"why":"Let's → shall we."},{"q":"I'm right, ___?","opts":["amn't I","aren't I","am I"],"a":1,"why":"Trường hợp đặc biệt: I am → aren't I."},{"q":"Nobody called, ___?","opts":["did they","didn't they","did he"],"a":0,"why":"Nobody mang nghĩa phủ định → đuôi khẳng định; dùng they."},{"q":"He has never been to Japan, ___?","opts":["has he","hasn't he","did he"],"a":0,"why":"never = phủ định → has he."}]},{"type":"typed","key":"T","time":"5 phút · Viết lại câu","title":"Đổi sang câu hỏi gián tiếp","items":[{"q":"Where is the nearest ATM? → <i>Could you tell me…<\/i>","ans":["Could you tell me where the nearest ATM is?"],"why":"Chủ ngữ (the nearest ATM) + is."},{"q":"What does this word mean? → <i>Do you know…<\/i>","ans":["Do you know what this word means?"],"why":"Bỏ does, mean → means."},{"q":"Is the museum open today? → <i>I'd like to know…<\/i>","ans":["I'd like to know if the museum is open today.","I'd like to know whether the museum is open today.","I would like to know if the museum is open today.","I would like to know whether the museum is open today."],"why":"Yes/No → if/whether."},{"q":"Why did she leave early? → <i>Do you have any idea…<\/i>","ans":["Do you have any idea why she left early?"],"why":"Bỏ did, leave → left."},{"q":"How much does this cost? → <i>Can you tell me…<\/i>","ans":["Can you tell me how much this costs?"],"why":"Bỏ does, cost → costs."}]},{"type":"typed","key":"G","short":true,"time":"4 phút · Điền đuôi","title":"Thêm câu hỏi đuôi","hint":"Chỉ gõ phần đuôi, ví dụ: isn't it","items":[{"q":"It's hot today, ___?","ans":["isn't it"],"why":"It is → isn't it."},{"q":"You can swim, ___?","ans":["can't you"],"why":"can → can't."},{"q":"They didn't finish, ___?","ans":["did they"],"why":"Phủ định → đuôi khẳng định."},{"q":"Close the door, ___?","ans":["will you","would you","could you","can you"],"why":"Mệnh lệnh → will you (thường gặp nhất)."},{"q":"She has been here before, ___?","ans":["hasn't she"],"why":"has → hasn't."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Tình huống du lịch","hint":"Bạn đang ở khách sạn: viết <b>2 câu hỏi gián tiếp<\/b> lịch sự cho lễ tân + <b>2 câu có câu hỏi đuôi<\/b> nói với bạn đồng hành.","placeholder":"1. Could you tell me ...\n2. ...\n3. ..., isn't it?\n4. ..."}]}}]},{"name":"Giai đoạn 2 — Modal verbs (tuần 5–7)","lessons":[{"id":"24","title":"Modals: khả năng, bắt buộc","desc":"can / be able to / must / have to","data":{"id":"24","title":"Modals — khả năng, sự cho phép, bắt buộc","sub":"Giai đoạn 2 · 30 phút · can / could / be able to · must / have to / should","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 23","title":"Warm-up","items":[{"q":"Can you tell me where ___?","opts":["the toilet is","is the toilet"],"a":0,"why":"Câu gián tiếp → S + V.","tag":"indirect question"},{"q":"You've finished, ___?","opts":["haven't you","didn't you"],"a":0,"why":"have → haven't.","tag":"question tag"},{"q":"I don't know ___ she is married.","opts":["if","that"],"a":0,"why":"Yes/No → if.","tag":"indirect question"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Modal nào cho ý nào?","html":"\n      <h3>① Khả năng (ability)<\/h3>\n      <table>\n        <tr><th>Thời<\/th><th>Dùng<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td>Hiện tại<\/td><td>can<\/td><td>She <em class=\"g\">can<\/em> speak Korean.<\/td><\/tr>\n        <tr><td>Quá khứ (chung chung)<\/td><td>could<\/td><td>I <em class=\"g\">could<\/em> swim when I was five.<\/td><\/tr>\n        <tr><td>Quá khứ (<b>làm được trong 1 lần cụ thể<\/b>)<\/td><td>was able to / managed to<\/td><td>The fire spread, but everyone <em class=\"g\">was able to<\/em> escape.<\/td><\/tr>\n        <tr><td>Tương lai / sau modal khác<\/td><td>will be able to<\/td><td>I'll <em class=\"g\">be able to<\/em> drive next year. (<s>will can<\/s>)<\/td><\/tr>\n      <\/table>\n      <h3>② Bắt buộc & lời khuyên<\/h3>\n      <table>\n        <tr><th>Từ<\/th><th>Nghĩa<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td><b>must<\/b><\/td><td>bắt buộc — thường do <b>người nói<\/b> thấy cần<\/td><td>I <em class=\"g\">must<\/em> call Mum tonight.<\/td><\/tr>\n        <tr><td><b>have to<\/b><\/td><td>bắt buộc — do <b>quy định bên ngoài<\/b>; dùng cho mọi thì<\/td><td>We <em class=\"g\">have to<\/em> wear a uniform. / I <em class=\"g\">had to<\/em> work yesterday.<\/td><\/tr>\n        <tr><td><b>mustn't<\/b><\/td><td><b>CẤM<\/b><\/td><td>You <em class=\"g\">mustn't<\/em> smoke here.<\/td><\/tr>\n        <tr><td><b>don't have to<\/b><\/td><td><b>KHÔNG CẦN<\/b> (làm cũng được)<\/td><td>You <em class=\"g\">don't have to<\/em> pay. It's free.<\/td><\/tr>\n        <tr><td><b>should<\/b><\/td><td>lời khuyên<\/td><td>You <em class=\"g\">should<\/em> rest.<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\"><b>Bẫy lớn nhất:<\/b> mustn't ≠ don't have to.<br>\n        You <b>mustn't<\/b> come = Cấm đến. · You <b>don't have to<\/b> come = Không đến cũng được.<\/div>\n      <h3>③ Xin phép<\/h3>\n      <p><b>Can I…?<\/b> (thân mật) → <b>Could I…?<\/b> → <b>May I…?<\/b> (lịch sự nhất)<\/p>\n      <div class=\"box\">Sau modal luôn là <b>V nguyên mẫu<\/b>, không \"to\", không \"s\": <s>must to go<\/s>, <s>she cans<\/s>.<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["mustn't","cấm"],["don't have to","không cần"],["must vs have to","người nói thấy cần vs quy định bên ngoài"],["could vs was able to","khả năng chung vs làm được 1 lần cụ thể"],["will can?","✘ → will be able to"],["Xin phép lịch sự nhất","May I ...?"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"You ___ smoke in the hospital. It's forbidden.","opts":["mustn't","don't have to","needn't"],"a":0,"why":"Cấm → mustn't."},{"q":"Tomorrow is Sunday, so I ___ get up early.","opts":["mustn't","don't have to","can't"],"a":1,"why":"Không cần → don't have to."},{"q":"I ___ swim when I was five.","opts":["could","can","am able"],"a":0,"why":"Khả năng chung trong quá khứ → could."},{"q":"The fire spread fast, but everyone ___ escape.","opts":["could","was able to","can"],"a":1,"why":"Làm được trong một lần cụ thể → was able to."},{"q":"I'll ___ speak English fluently after this course.","opts":["can","be able to","could"],"a":1,"why":"will + be able to."},{"q":"You look tired. You ___ go to bed earlier.","opts":["should","mustn't","have"],"a":0,"why":"Lời khuyên → should."},{"q":"In Vietnam, you ___ wear a helmet on a motorbike. It's the law.","opts":["have to","should","may"],"a":0,"why":"Quy định bên ngoài (luật) → have to."},{"q":"I ___ go to work yesterday because it was a public holiday.","opts":["mustn't","couldn't","didn't have to"],"a":2,"why":"Không cần (vì ngày lễ) → didn't have to."},{"q":"___ I use your phone, please?","opts":["May","Must","Should"],"a":0,"why":"Xin phép lịch sự → May I."}]},{"type":"typed","key":"G","short":true,"time":"5 phút · Điền từ","title":"Điền modal phù hợp với nghĩa tiếng Việt","hint":"Chỉ gõ phần điền vào chỗ trống.","items":[{"q":"Students ___ (không được) cheat in exams.","ans":["mustn't","must not"],"why":"Cấm."},{"q":"You ___ (không cần) bring food. We have plenty.","ans":["don't have to","do not have to","don't need to","needn't"],"why":"Không cần."},{"q":"Last year I ___ (phải) work every Saturday.","ans":["had to"],"why":"must không có quá khứ → had to."},{"q":"Will you ___ (có thể) come to my party next week?","ans":["be able to"],"why":"will + be able to."},{"q":"You ___ (nên) see a doctor about that cough.","ans":["should","ought to"],"why":"Lời khuyên."},{"q":"After hours of trying, she ___ (đã xoay xở được) fix the car.","ans":["was able to","managed to"],"why":"Thành công trong 1 lần cụ thể."}]},{"type":"typed","key":"E","time":"4 phút · Sửa lỗi","title":"Sửa lỗi sai","items":[{"q":"You don't have to touch that wire! It's dangerous.","ans":["You mustn't touch that wire! It's dangerous.","You must not touch that wire! It's dangerous."],"why":"Nguy hiểm → cấm → mustn't."},{"q":"I must to finish this report today.","ans":["I must finish this report today."],"why":"must + V (không to)."},{"q":"She cans speak three languages.","ans":["She can speak three languages."],"why":"Modal không thêm s."},{"q":"We will can travel next year.","ans":["We will be able to travel next year.","We'll be able to travel next year."],"why":"will + be able to."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Quy định ở nơi bạn làm việc / học","hint":"4 câu: 1 <b>have to<\/b> · 1 <b>mustn't<\/b> · 1 <b>don't have to<\/b> · 1 lời khuyên với <b>should<\/b>.","placeholder":"1. At my company, we have to ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"25","title":"Suy luận hiện tại","desc":"must / might / can't be","data":{"id":"25","title":"Modals of Deduction — suy luận ở hiện tại","sub":"Giai đoạn 2 · 30 phút · must / might / may / could / can't","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 24","title":"Warm-up","items":[{"q":"You ___ pay for the museum — it's free.","opts":["don't have to","mustn't"],"a":0,"why":"Không cần.","tag":"mustn't vs don't have to"},{"q":"Passengers ___ use phones during take-off.","opts":["mustn't","don't have to"],"a":0,"why":"Cấm.","tag":"mustn't vs don't have to"},{"q":"Although the exam was hard, I ___ pass it.","opts":["was able to","could"],"a":0,"why":"Làm được 1 lần cụ thể.","tag":"could vs was able to"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Từ bằng chứng → kết luận","html":"\n      <p>Ở bài trước, must = bắt buộc. Ở bài này, must/can't/might dùng để <b>đoán<\/b> dựa trên bằng chứng. Mức độ chắc chắn:<\/p>\n      <table>\n        <tr><th>Mức độ<\/th><th>Từ<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td>~95% chắc chắn ĐÚNG<\/td><td><b>must<\/b><\/td><td>He's been running for an hour. He <em class=\"g\">must be<\/em> tired.<\/td><\/tr>\n        <tr><td>~50% có thể<\/td><td><b>might / may / could<\/b><\/td><td>She isn't answering. She <em class=\"g\">might be<\/em> asleep.<\/td><\/tr>\n        <tr><td>~95% chắc chắn KHÔNG<\/td><td><b>can't<\/b><\/td><td>That <em class=\"g\">can't be<\/em> Tom. He's in London.<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\"><b>Lỗi thường gặp:<\/b><br>\n        ① Phủ định của <b>must<\/b> (suy luận) là <b>can't<\/b>, không phải mustn't:<br>\n        <s>He mustn't be at home.<\/s> → He <b>can't<\/b> be at home.<br>\n        ② Đoán \"có thể\" ở dạng khẳng định dùng <b>might/may/could<\/b>, không dùng can:<br>\n        <s>It can be true.<\/s> → It <b>might<\/b> be true.<\/div>\n      <div class=\"box\">Đoán việc <b>đang diễn ra<\/b>: modal + <b>be + V-ing<\/b><br>\n        The lights are on. They <em class=\"g\">must be watching<\/em> TV.<\/div>\n      <p><b>Logic:<\/b> luôn nêu được <i>bằng chứng<\/i> (vì sao bạn nghĩ vậy) → câu suy luận mới tự nhiên và thuyết phục.<\/p>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["must be","chắc chắn là (~95%)"],["can't be","chắc chắn không phải"],["might / may / could be","có thể là (~50%)"],["mustn't be?","✘ không dùng để suy luận → can't be"],["Đang làm gì?","must be + V-ing<br><i>She must be sleeping.<\/i>"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"She's been working for 12 hours. She ___ be exhausted.","opts":["must","can't","mustn't"],"a":0,"why":"Bằng chứng mạnh → must."},{"q":"That ___ be Tom. He's in London now.","opts":["can't","must","might"],"a":0,"why":"Bằng chứng anh ấy ở chỗ khác → can't."},{"q":"Someone is knocking. It ___ be the postman, or maybe my neighbour.","opts":["might","must","can't"],"a":0,"why":"Chưa chắc, có 2 khả năng → might."},{"q":"He drives a Ferrari. He ___ be rich.","opts":["must","can't","might not"],"a":0,"why":"Bằng chứng mạnh → must."},{"q":"The lights are off. They ___ be at home.","opts":["mustn't","can't","must"],"a":1,"why":"Chắc chắn không → can't (không dùng mustn't)."},{"q":"Where's Lan? — I'm not sure. She ___ be in the library.","opts":["could","must","can't"],"a":0,"why":"Không chắc → could."},{"q":"Listen! Someone ___ in the bathroom.","opts":["must sing","must be singing","can't sing"],"a":1,"why":"Đang diễn ra → must be + V-ing."},{"q":"Which sentence is WRONG?","opts":["He might be ill.","He mustn't be at home — his car isn't here.","He can't be at home."],"a":1,"why":"Suy luận phủ định → can't, không phải mustn't."}]},{"type":"typed","key":"G","short":true,"time":"4 phút · Điền từ","title":"Điền must / might / can't","hint":"Chỉ gõ 1 từ.","items":[{"q":"You've just eaten a big pizza. You ___ be hungry!","ans":["can't","cannot"],"why":"Vừa ăn xong → chắc chắn không đói."},{"q":"Her eyes are red and she's holding a tissue. She ___ be sad.","ans":["must"],"why":"Bằng chứng mạnh."},{"q":"I don't know where my keys are. They ___ be in the car.","ans":["might","may","could"],"why":"Không chắc."},{"q":"That bag costs only $5. It ___ be real leather.","ans":["can't","cannot"],"why":"Quá rẻ → chắc chắn không phải da thật."},{"q":"Everyone is wearing coats. It ___ be cold outside.","ans":["must"],"why":"Bằng chứng mạnh."}]},{"type":"typed","key":"T","time":"5 phút · Viết lại câu","title":"Viết lại bằng modal suy luận","items":[{"q":"I'm sure he is at work.","ans":["He must be at work."],"why":"I'm sure → must."},{"q":"I'm sure it isn't true.","ans":["It can't be true.","It cannot be true."],"why":"I'm sure ... not → can't."},{"q":"Perhaps she is sleeping.","ans":["She might be sleeping.","She may be sleeping.","She could be sleeping."],"why":"Perhaps → might + be + V-ing."},{"q":"I'm sure they are watching TV.","ans":["They must be watching TV."],"why":"must + be + V-ing."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Làm thám tử","hint":"Nghĩ về một người bạn biết hoặc một tình huống quanh bạn. Viết 4 câu suy luận với <b>must<\/b>, <b>can't<\/b>, <b>might<\/b>, <b>must be + V-ing<\/b> — mỗi câu kèm <b>bằng chứng<\/b> (because…).","placeholder":"1. My neighbour must be ... because ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"26","title":"Suy luận & hối tiếc quá khứ","desc":"must have / should have + V3","data":{"id":"26","title":"Past Modals — suy luận & hối tiếc về quá khứ","sub":"Giai đoạn 2 · 30 phút · must have / can't have / might have / should have + V3","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 25","title":"Warm-up","items":[{"q":"He's wearing a uniform. He ___ be a pilot.","opts":["must","can't"],"a":0,"why":"Bằng chứng → must.","tag":"deduction"},{"q":"She ___ be at home. I just saw her at the mall.","opts":["can't","mustn't"],"a":0,"why":"Suy luận phủ định → can't.","tag":"can't vs mustn't"},{"q":"Look, they ___ for the bus.","opts":["must be waiting","must wait"],"a":0,"why":"Đang diễn ra → must be V-ing.","tag":"deduction"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Modal + have + V3 = nói về quá khứ","html":"\n      <p>Công thức chung: <b>modal + have + V3<\/b>. Giữ nguyên nghĩa của modal, chỉ chuyển sang quá khứ.<\/p>\n      <h3>① Suy luận về quá khứ<\/h3>\n      <table>\n        <tr><th>Cấu trúc<\/th><th>Nghĩa<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td><b>must have + V3<\/b><\/td><td>chắc chắn đã<\/td><td>The ground is wet. It <em class=\"g\">must have rained<\/em>.<\/td><\/tr>\n        <tr><td><b>might / may / could have + V3<\/b><\/td><td>có lẽ đã<\/td><td>He's late. He <em class=\"g\">might have missed<\/em> the bus.<\/td><\/tr>\n        <tr><td><b>can't / couldn't have + V3<\/b><\/td><td>chắc chắn không thể đã<\/td><td>She <em class=\"g\">can't have seen<\/em> me. She was asleep.<\/td><\/tr>\n      <\/table>\n      <h3>② Hối tiếc / phê bình<\/h3>\n      <table>\n        <tr><th>Cấu trúc<\/th><th>Nghĩa<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td><b>should have + V3<\/b><\/td><td>lẽ ra nên làm (nhưng đã không làm)<\/td><td>I failed. I <em class=\"g\">should have studied<\/em> harder.<\/td><\/tr>\n        <tr><td><b>shouldn't have + V3<\/b><\/td><td>lẽ ra không nên (nhưng đã làm)<\/td><td>I <em class=\"g\">shouldn't have eaten<\/em> so much.<\/td><\/tr>\n        <tr><td><b>could have + V3<\/b><\/td><td>đã có thể làm (nhưng không làm)<\/td><td>You <em class=\"g\">could have taken<\/em> a taxi!<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\"><b>Lỗi thường gặp:<\/b> sau have phải là <b>V3<\/b> (past participle), không phải V2:<br>\n        must have <s>went<\/s> → must have <b>gone<\/b> · should have <s>took<\/s> → should have <b>taken<\/b><\/div>\n      <div class=\"box\"><b>Liên hệ bài cũ:<\/b> \"I should have studied harder\" ≈ \"If I had studied harder, I would have passed\" (Third conditional, bài 15).<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["must have done","chắc chắn đã"],["can't have done","chắc chắn đã không"],["might have done","có lẽ đã"],["should have done","lẽ ra nên (nhưng đã không)"],["shouldn't have done","lẽ ra không nên (nhưng đã làm)"],["go → must have ___","gone (V3!)"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"The ground is wet. It ___ last night.","opts":["must have rained","must rain","should have rained"],"a":0,"why":"Suy luận chắc chắn về quá khứ."},{"q":"She ___ the email. She was offline all day.","opts":["can't have sent","mustn't have sent","should have sent"],"a":0,"why":"Chắc chắn không → can't have."},{"q":"I failed the test. I ___ harder.","opts":["should have studied","must have studied","can't have studied"],"a":0,"why":"Hối tiếc → should have."},{"q":"Nam isn't here yet. He ___ the bus.","opts":["might have missed","should miss","can't have missed"],"a":0,"why":"Có lẽ → might have."},{"q":"You ___ so much — now you feel sick.","opts":["shouldn't have eaten","mustn't have eaten","couldn't eat"],"a":0,"why":"Phê bình việc đã làm → shouldn't have."},{"q":"Why did you walk home? You ___ a taxi.","opts":["could have taken","must have taken","can't have taken"],"a":0,"why":"Đã có thể (nhưng không làm) → could have."},{"q":"He knew all the answers. He ___ the questions before.","opts":["must have seen","should have seen","might see"],"a":0,"why":"Suy luận chắc chắn → must have."},{"q":"Which sentence is WRONG?","opts":["She must have forgot.","She must have forgotten.","She may have forgotten."],"a":0,"why":"Sau have → V3: forgotten."}]},{"type":"typed","key":"T","time":"6 phút · Viết lại câu","title":"Viết lại bằng past modal","items":[{"q":"I'm sure she was tired after the trip.","ans":["She must have been tired after the trip."],"why":"I'm sure + quá khứ → must have been."},{"q":"It was a mistake to sell my old car. <i>(shouldn't)<\/i>","ans":["I shouldn't have sold my old car.","I should not have sold my old car."],"why":"Hối tiếc việc đã làm → shouldn't have."},{"q":"Perhaps they went home early.","ans":["They might have gone home early.","They may have gone home early.","They could have gone home early."],"why":"Perhaps → might have + V3 (gone)."},{"q":"I'm sure he didn't steal the money.","ans":["He can't have stolen the money.","He couldn't have stolen the money.","He cannot have stolen the money."],"why":"Chắc chắn không → can't have stolen."},{"q":"It was a good idea to call you, but I didn't.","ans":["I should have called you."],"why":"Lẽ ra nên → should have."}]},{"type":"typed","key":"G","short":true,"time":"3 phút · Điền từ","title":"Chia động từ trong ngoặc","hint":"Gõ đủ cụm, ví dụ: must have gone","items":[{"q":"You ___ (should / tell) me earlier!","ans":["should have told"],"why":"tell → told."},{"q":"The window is broken. Someone ___ (must / throw) a stone.","ans":["must have thrown"],"why":"throw → thrown."},{"q":"He ___ (can't / finish) already — he only started 5 minutes ago!","ans":["can't have finished","cannot have finished"],"why":"Chắc chắn chưa xong."},{"q":"I ___ (might / leave) my wallet at the café.","ans":["might have left"],"why":"leave → left."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Hối tiếc & bí ẩn","hint":"2 câu hối tiếc về quá khứ của bạn (<b>should / shouldn't have<\/b>) + 2 câu suy luận về một chuyện đã xảy ra (<b>must / can't / might have<\/b>).","placeholder":"1. I should have ...\n2. ...\n3. ...\n4. ..."}]}}]},{"name":"Giai đoạn 3 — Cấu trúc B2 (tuần 8–11)","lessons":[{"id":"27","title":"Wish / If only / It's time","desc":"ước muốn, điều không có thật","data":{"id":"27","title":"Wish / If only / I'd rather / It's time","sub":"Giai đoạn 3 · 30 phút · ước muốn & điều không có thật","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 26","title":"Warm-up","items":[{"q":"I missed the train. I ___ earlier.","opts":["should have left","must have left"],"a":0,"why":"Hối tiếc → should have.","tag":"past modals"},{"q":"She ___ the news — she looks shocked.","opts":["must have heard","should have heard"],"a":0,"why":"Suy luận → must have.","tag":"past modals"},{"q":"He ___ at home; I phoned and nobody answered.","opts":["can't have been","mustn't have been"],"a":0,"why":"Suy luận phủ định → can't have.","tag":"past modals"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Lùi thì để nói điều không có thật","html":"\n      <p><b>Logic giống câu điều kiện loại 2 và 3 (bài 14, 15):<\/b> điều không có thật → <b>lùi một thì<\/b>.<\/p>\n      <table>\n        <tr><th>Ước về<\/th><th>Cấu trúc<\/th><th>Ví dụ<\/th><th>Thực tế<\/th><\/tr>\n        <tr><td>Hiện tại<\/td><td>wish + <b>past simple<\/b><\/td><td>I wish I <em class=\"g\">had<\/em> a car.<br>I wish I <em class=\"g\">were<\/em> taller.<\/td><td>Tôi không có xe.<\/td><\/tr>\n        <tr><td>Quá khứ (hối tiếc)<\/td><td>wish + <b>past perfect<\/b><\/td><td>I wish I <em class=\"g\">had studied<\/em> harder.<\/td><td>Tôi đã không học chăm.<\/td><\/tr>\n        <tr><td>Người khác / sự việc nên thay đổi (phàn nàn)<\/td><td>wish + sb + <b>would<\/b> + V<\/td><td>I wish you <em class=\"g\">would stop<\/em> shouting.<\/td><td>Bạn cứ hét mãi.<\/td><\/tr>\n        <tr><td>Khả năng<\/td><td>wish + <b>could<\/b> + V<\/td><td>I wish I <em class=\"g\">could<\/em> swim.<\/td><td>Tôi không biết bơi.<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\">Không dùng <b>I wish I would…<\/b> (tự ước về hành động của mình) → dùng <b>I wish I could…<\/b><br>\n        <b>If only<\/b> = wish nhưng cảm xúc mạnh hơn: <i>If only I had listened!<\/i><\/div>\n      <h3>I'd rather & It's time<\/h3>\n      <table>\n        <tr><td><b>I'd rather + V<\/b><\/td><td>tôi thích/muốn (tự mình) hơn<\/td><td>I'd rather <em class=\"g\">stay<\/em> home.<\/td><\/tr>\n        <tr><td><b>I'd rather + sb + past<\/b><\/td><td>muốn người khác làm<\/td><td>I'd rather you <em class=\"g\">didn't smoke<\/em> here.<\/td><\/tr>\n        <tr><td><b>It's time + sb + past<\/b><\/td><td>đã đến lúc (đáng lẽ phải làm rồi)<\/td><td>It's time we <em class=\"g\">went<\/em> home.<\/td><\/tr>\n        <tr><td><b>It's time to + V<\/b><\/td><td>đã đến lúc<\/td><td>It's time <em class=\"g\">to go<\/em>.<\/td><\/tr>\n      <\/table>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["wish + past simple","ước hiện tại khác đi"],["wish + past perfect","hối tiếc quá khứ"],["wish + sb + would","phàn nàn, muốn người khác thay đổi"],["I wish I ___ swim.","could"],["I'd rather you ___ (not tell) anyone.","didn't tell"],["It's time we ___ (leave).","left"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"I wish I ___ taller.","opts":["am","were","would be"],"a":1,"why":"Ước hiện tại → past simple; với be dùng were (hoặc was)."},{"q":"I wish I ___ to the party last night. It was fun.","opts":["went","had gone","would go"],"a":1,"why":"Hối tiếc quá khứ → had gone."},{"q":"I wish my neighbour ___ playing loud music at night.","opts":["stopped","would stop","had stopped"],"a":1,"why":"Phàn nàn, muốn người khác thay đổi → would."},{"q":"If only I ___ more money now!","opts":["had","have","would have"],"a":0,"why":"Hiện tại → past simple."},{"q":"It's late. It's time we ___ home.","opts":["go","went","going"],"a":1,"why":"It's time + sb + past."},{"q":"I'd rather ___ at home tonight.","opts":["stay","to stay","stayed"],"a":0,"why":"I'd rather + V (chính mình)."},{"q":"I'd rather you ___ smoke here.","opts":["don't","didn't","won't"],"a":1,"why":"I'd rather + người khác + past."},{"q":"She wishes she ___ speak French.","opts":["can","could","would"],"a":1,"why":"Khả năng → could."},{"q":"I wish I ___ that. I'm sorry.","opts":["didn't say","hadn't said","wouldn't say"],"a":1,"why":"Đã nói rồi (quá khứ) → hadn't said."}]},{"type":"typed","key":"T","time":"6 phút · Viết lại câu","title":"Viết lại câu","items":[{"q":"I don't have a car. <i>(wish)<\/i>","ans":["I wish I had a car."],"why":"Hiện tại → past simple."},{"q":"I didn't study medicine. <i>(wish)<\/i>","ans":["I wish I had studied medicine.","I wish I'd studied medicine."],"why":"Quá khứ → past perfect."},{"q":"My brother always borrows my clothes. I hate it. <i>(wish … would)<\/i>","ans":["I wish my brother wouldn't borrow my clothes.","I wish my brother would not borrow my clothes.","I wish my brother would stop borrowing my clothes."],"why":"Phàn nàn → would."},{"q":"I can't drive. <i>(If only)<\/i>","ans":["If only I could drive."],"why":"Khả năng → could."},{"q":"You should go to bed now. <i>(It's time)<\/i>","ans":["It's time you went to bed.","It is time you went to bed.","It's time for you to go to bed."],"why":"It's time + sb + past."}]},{"type":"order","key":"O","time":"2 phút · Sắp xếp","title":"Sắp xếp thành câu đúng","items":[{"words":"I wish|I had|listened|to my parents","why":"wish + past perfect."},{"words":"I'd rather|you|didn't|tell|anyone","why":"I'd rather + sb + past."},{"words":"It's|high time|we|started|the meeting","why":"It's (high) time + sb + past."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Ước muốn của bạn","hint":"4 câu: wish về <b>hiện tại<\/b> · wish về <b>quá khứ<\/b> · wish + <b>would<\/b> (phàn nàn) · <b>I'd rather<\/b> hoặc <b>It's time<\/b>.","placeholder":"1. I wish I ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"28","title":"Causative","desc":"have / get something done","data":{"id":"28","title":"Causative — have / get something done","sub":"Giai đoạn 3 · 30 phút · nhờ / thuê người khác làm","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 27","title":"Warm-up","items":[{"q":"I wish I ___ more free time.","opts":["had","have"],"a":0,"why":"wish + past simple.","tag":"wish"},{"q":"I wish you ___ interrupting me!","opts":["would stop","stopped"],"a":0,"why":"Phàn nàn → would.","tag":"wish + would"},{"q":"It's time we ___ a decision.","opts":["made","make"],"a":0,"why":"It's time + sb + past.","tag":"it's time"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Ai là người làm?","html":"\n      <p>Người Việt hay nói <i>\"Tôi cắt tóc hôm qua\"<\/i> nhưng thật ra là <b>thợ<\/b> cắt. Tiếng Anh phân biệt rõ:<\/p>\n      <div class=\"box\">\n        I <b>cut<\/b> my hair. → <i>Tôi tự cắt.<\/i><br>\n        I <b>had my hair cut<\/b>. → <i>Tôi đi cắt (người khác cắt cho tôi).<\/i>\n      <\/div>\n      <table>\n        <tr><th>Cấu trúc<\/th><th>Dùng khi<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td><b>have/get + vật + V3<\/b><\/td><td>Nhờ/thuê làm (không nói ai làm)<\/td><td>I <em class=\"g\">had my car repaired<\/em>.<\/td><\/tr>\n        <tr><td><b>have + người + V<\/b><\/td><td>Bảo ai đó làm<\/td><td>I'll <em class=\"g\">have the technician check<\/em> it.<\/td><\/tr>\n        <tr><td><b>get + người + to V<\/b><\/td><td>Thuyết phục ai đó làm<\/td><td>I <em class=\"g\">got my brother to help<\/em> me.<\/td><\/tr>\n        <tr><td><b>have + vật + V3<\/b> (chuyện xấu)<\/td><td>Việc không mong muốn xảy ra với mình<\/td><td>She <em class=\"g\">had her phone stolen<\/em>.<\/td><\/tr>\n      <\/table>\n      <p><b>Logic:<\/b> đây chính là <b>bị động<\/b> (bài 17) — cái xe <i>được sửa<\/i> → V3.<\/p>\n      <div class=\"warn\">Chia thì ở <b>have/get<\/b>, V3 giữ nguyên:<br>\n        I <b>am having<\/b> my house painted. · I <b>had<\/b> it painted. · I <b>will get<\/b> it painted. · I <b>have just had<\/b> it painted.<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["have sth done","thuê/nhờ làm<br><i>have my nails done<\/i>"],["have sb do","bảo ai làm<br><i>have the waiter bring it<\/i>"],["get sb to do","thuyết phục ai làm<br><i>get him to agree<\/i>"],["had my bike stolen","bị trộm xe (chuyện xấu)"],["Chia thì ở đâu?","ở have/get"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"I ___ my hair cut yesterday.","opts":["had","did","made"],"a":0,"why":"have sth done → had."},{"q":"She's getting her car ___.","opts":["repair","repaired","repairing"],"a":1,"why":"get sth + V3."},{"q":"I'll have the technician ___ the air conditioner.","opts":["check","to check","checked"],"a":0,"why":"have + người + V nguyên mẫu."},{"q":"I got my brother ___ me move house.","opts":["help","to help","helped"],"a":1,"why":"get + người + to V."},{"q":"We need to ___ the roof repaired before the rainy season.","opts":["get","make","do"],"a":0,"why":"get sth done."},{"q":"He had his wallet ___ on the bus.","opts":["steal","stealing","stolen"],"a":2,"why":"Chuyện xấu: have sth + V3."},{"q":"Which sentence means somebody ELSE painted the house?","opts":["We painted our house.","We had our house painted."],"a":1,"why":"had + house + painted → thuê người sơn."},{"q":"Where do you ___ your clothes washed?","opts":["get","make","take"],"a":0,"why":"get sth done."}]},{"type":"typed","key":"T","time":"6 phút · Viết lại câu","title":"Viết lại bằng have/get","items":[{"q":"A mechanic is fixing my motorbike. <i>(I'm having…)<\/i>","ans":["I'm having my motorbike fixed.","I am having my motorbike fixed."],"why":"Hiện tại tiếp diễn ở have."},{"q":"A photographer took our wedding photos. <i>(We had…)<\/i>","ans":["We had our wedding photos taken."],"why":"take → taken."},{"q":"Someone will clean the carpets tomorrow. <i>(We'll get…)<\/i>","ans":["We'll get the carpets cleaned tomorrow.","We will get the carpets cleaned tomorrow."],"why":"will get + sth + V3."},{"q":"Someone stole my bike last week. <i>(I had…)<\/i>","ans":["I had my bike stolen last week."],"why":"Chuyện xấu: had + sth + V3."},{"q":"I asked my friend to fix my laptop and she did. <i>(I got…)<\/i>","ans":["I got my friend to fix my laptop."],"why":"get + người + to V."}]},{"type":"typed","key":"G","short":true,"time":"3 phút · Điền từ","title":"Chia động từ trong ngoặc","hint":"Chỉ gõ 1 từ hoặc cụm từ.","items":[{"q":"You should have your eyes ___ (test).","ans":["tested"],"why":"have sth + V3."},{"q":"I'm going to get my teeth ___ (check) next week.","ans":["checked"],"why":"get sth + V3."},{"q":"She had the waiter ___ (bring) another glass.","ans":["bring"],"why":"have + người + V."},{"q":"I couldn't get the kids ___ (go) to bed.","ans":["to go"],"why":"get + người + to V."},{"q":"Have you ever had your phone ___ (hack)?","ans":["hacked"],"why":"Chuyện xấu: had sth + V3."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Dịch vụ bạn hay dùng","hint":"4 câu về những việc bạn thuê/nhờ người khác làm (cắt tóc, sửa xe, giao hàng…) ở các thì khác nhau + 1 câu về chuyện không may (had sth stolen/broken).","placeholder":"1. I usually get my hair cut ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"29","title":"So sánh nâng cao","desc":"much / far, the more… the more","data":{"id":"29","title":"Comparatives & Superlatives nâng cao","sub":"Giai đoạn 3 · 30 phút · much/far + so sánh hơn, the more… the more, twice as… as","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 28","title":"Warm-up","items":[{"q":"I had my car ___ yesterday.","opts":["washed","wash"],"a":0,"why":"have sth + V3.","tag":"causative"},{"q":"She got her sister ___ her homework.","opts":["to check","check"],"a":0,"why":"get sb + to V.","tag":"causative"},{"q":"We're having a new kitchen ___.","opts":["installed","install"],"a":0,"why":"have sth + V3.","tag":"causative"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"So sánh có mức độ","html":"\n      <p>Ở B1 bạn biết <i>bigger than, the biggest<\/i>. Ở B2, bạn cần nói <b>hơn bao nhiêu<\/b> và <b>thay đổi thế nào<\/b>.<\/p>\n      <table>\n        <tr><th>Ý muốn nói<\/th><th>Cấu trúc<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td>Hơn <b>nhiều<\/b><\/td><td><b>much / far / a lot<\/b> + so sánh hơn<\/td><td>Hanoi is <em class=\"g\">much bigger<\/em> than my town.<\/td><\/tr>\n        <tr><td>Hơn <b>một chút<\/b><\/td><td><b>a bit / slightly / a little<\/b> + so sánh hơn<\/td><td>Prices are <em class=\"g\">slightly higher<\/em>.<\/td><\/tr>\n        <tr><td>Càng… càng…<\/td><td><b>the + so sánh hơn…, the + so
