 sánh hơn…<\/b><\/td><td><em class=\"g\">The more<\/em> you practise, <em class=\"g\">the better<\/em> you get.<\/td><\/tr>\n        <tr><td>Ngày càng…<\/td><td><b>so sánh hơn + and + so sánh hơn<\/b><\/td><td>It's getting <em class=\"g\">colder and colder<\/em>. / <em class=\"g\">more and more<\/em> popular<\/td><\/tr>\n        <tr><td>Gấp… lần<\/td><td><b>twice / three times + as … as<\/b><\/td><td>This is <em class=\"g\">twice as expensive as<\/em> that.<\/td><\/tr>\n        <tr><td>Không bằng<\/td><td><b>not as … as<\/b><\/td><td>My English <em class=\"g\">isn't as good as<\/em> yours.<\/td><\/tr>\n        <tr><td>Nhất, bỏ xa<\/td><td><b>by far + the + so sánh nhất<\/b><\/td><td>She's <em class=\"g\">by far the best<\/em> student.<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\"><b>Lỗi thường gặp:<\/b><br>\n        <s>more easier<\/s> → easier (không dùng 2 lần so sánh)<br>\n        <s>very bigger<\/s> → much bigger (very không đi với so sánh hơn)<br>\n        <s>The more you study, you learn more.<\/s> → The more you study, <b>the more<\/b> you learn.<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["very bigger?","✘ → much / far bigger"],["càng… càng…","The sooner, the better."],["ngày càng nóng","hotter and hotter"],["gấp đôi giá","twice as expensive as"],["bỏ xa nhất","by far the best"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"Hanoi is ___ bigger than my hometown.","opts":["much","very","more"],"a":0,"why":"much + so sánh hơn."},{"q":"The ___ you practise, the better you get.","opts":["more","most","much"],"a":0,"why":"The more…, the better…"},{"q":"It's getting ___.","opts":["colder and colder","more cold","colder and more cold"],"a":0,"why":"-er and -er."},{"q":"This phone is ___ expensive as that one.","opts":["twice as","two times more","twice more"],"a":0,"why":"twice as … as."},{"q":"She is ___ the best student in the class.","opts":["by far","very","much more"],"a":0,"why":"by far + the + so sánh nhất."},{"q":"My English isn't ___ good as yours.","opts":["as","so much","more"],"a":0,"why":"not as … as."},{"q":"Which sentence is WRONG?","opts":["This test is more easier.","This test is a bit easier.","This test is far easier."],"a":0,"why":"easier đã là so sánh hơn → không thêm more."},{"q":"The older he gets, ___.","opts":["the wiser he becomes","he becomes wiser","wiser he becomes"],"a":0,"why":"Vế 2 cũng phải có the + so sánh hơn."},{"q":"Prices are ___ higher than last year.","opts":["slightly","very","so"],"a":0,"why":"slightly + so sánh hơn = hơn một chút."}]},{"type":"typed","key":"T","time":"6 phút · Viết lại câu","title":"Viết lại câu","items":[{"q":"If you study more, you will learn more. <i>(The more…)<\/i>","ans":["The more you study, the more you learn.","The more you study, the more you will learn."],"why":"The more…, the more…"},{"q":"My car is cheaper than yours. <i>(not as … as)<\/i>","ans":["My car is not as expensive as yours.","My car isn't as expensive as yours."],"why":"cheaper than = not as expensive as."},{"q":"The traffic is getting worse all the time. <i>(… and …)<\/i>","ans":["The traffic is getting worse and worse."],"why":"worse and worse."},{"q":"When it gets hotter, I feel more tired. <i>(The hotter…)<\/i>","ans":["The hotter it gets, the more tired I feel.","The hotter it gets, the more tired I get."],"why":"The + so sánh hơn + S + V."},{"q":"No other city in Vietnam is as big as Ho Chi Minh City. <i>(by far)<\/i>","ans":["Ho Chi Minh City is by far the biggest city in Vietnam.","Ho Chi Minh City is by far the largest city in Vietnam."],"why":"by far the + so sánh nhất."}]},{"type":"order","key":"O","time":"3 phút · Sắp xếp","title":"Sắp xếp thành câu đúng","items":[{"words":"The sooner|we leave,|the earlier|we will|arrive","why":"The + -er…, the + -er…"},{"words":"English|is getting|more and more|popular|in Vietnam","why":"more and more + tính từ dài."},{"words":"This book|is|far|more interesting|than|the film","why":"far + so sánh hơn."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Bạn bây giờ vs 5 năm trước","hint":"4 câu: <b>much/far + so sánh hơn<\/b> · <b>the…, the…<\/b> · <b>-er and -er / more and more<\/b> · <b>not as … as<\/b>.","placeholder":"1. My life is much busier than ...\n2. ...\n3. ...\n4. ..."}]}},{"id":"30","title":"Linking words","desc":"liên kết & lập luận","data":{"id":"30","title":"Linking Words — liên kết câu & lập luận","sub":"Giai đoạn 3 · 30 phút · although / despite / however / whereas / so that / in order to","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 29","title":"Warm-up","items":[{"q":"The ___ you sleep, the worse you feel.","opts":["less","least"],"a":0,"why":"The + so sánh hơn.","tag":"the more…the more"},{"q":"This app is ___ better than the old one.","opts":["far","very"],"a":0,"why":"far + so sánh hơn.","tag":"comparatives"},{"q":"My room isn't as big ___ yours.","opts":["as","than"],"a":0,"why":"not as … as.","tag":"comparatives"}]},{"type":"explain","time":"8 phút · Hiểu logic","title":"Từ nối = chỉ đường cho người đọc","html":"\n      <p>Từ nối cho người đọc biết <b>quan hệ logic<\/b> giữa 2 ý: đối lập, nguyên nhân, kết quả, mục đích hay bổ sung. Chọn sai từ nối → lập luận bị sai, dù ngữ pháp đúng.<\/p>\n      <table>\n        <tr><th>Quan hệ<\/th><th>+ mệnh đề (S + V)<\/th><th>+ danh từ / V-ing<\/th><th>Đứng đầu câu mới<\/th><\/tr>\n        <tr><td><b>Đối lập<\/b><\/td><td>although, even though, whereas, while<\/td><td>despite, in spite of<\/td><td>However, …<\/td><\/tr>\n        <tr><td><b>Nguyên nhân<\/b><\/td><td>because, as, since<\/td><td>because of, due to<\/td><td>—<\/td><\/tr>\n        <tr><td><b>Kết quả<\/b><\/td><td>so<\/td><td>—<\/td><td>Therefore, … / As a result, …<\/td><\/tr>\n        <tr><td><b>Mục đích<\/b><\/td><td>so that (+ can/could/will/would)<\/td><td>to / in order to + V<\/td><td>—<\/td><\/tr>\n        <tr><td><b>Bổ sung<\/b><\/td><td>and<\/td><td>—<\/td><td>Moreover, … / In addition, …<\/td><\/tr>\n      <\/table>\n      <div class=\"box\">\n        <b>Although<\/b> it was raining, we went out. = <b>Despite<\/b> the rain, we went out.<br>\n        = It was raining. <b>However<\/b>, we went out.<br>\n        Lan likes tea, <b>whereas<\/b> her husband prefers coffee. (so sánh 2 đối tượng)\n      <\/div>\n      <div class=\"warn\"><b>Lỗi thường gặp của người Việt:<\/b><br>\n        ① <s>Although<\/s> … <s>but<\/s> … — chỉ dùng MỘT từ (tiếng Việt nói \"Mặc dù… nhưng…\", tiếng Anh thì không).<br>\n        ② <s>Despite it was cold<\/s> → Despite <b>the cold<\/b> / <b>Although<\/b> it was cold.<br>\n        ③ <s>for buying<\/s> milk → <b>to buy<\/b> milk (mục đích).<br>\n        ④ <s>Because of he was late<\/s> → <b>Because<\/b> he was late.<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["although + ?","mệnh đề (S + V)"],["despite + ?","danh từ / V-ing"],["However","đầu câu mới + dấu phẩy"],["Although … but?","✘ chỉ dùng 1 từ"],["Mục đích","to V / so that + S + can"],["whereas","so sánh đối lập 2 đối tượng"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"___ it was raining, we went out.","opts":["Although","Despite","However"],"a":0,"why":"+ mệnh đề → Although."},{"q":"___ the rain, we went out.","opts":["Although","Despite","However"],"a":1,"why":"+ danh từ → Despite."},{"q":"The hotel was expensive. ___, the service was terrible.","opts":["However","Although","Moreover"],"a":2,"why":"Đắt + dịch vụ tệ = 2 ý tiêu cực cùng chiều → bổ sung (Moreover), không phải đối lập."},{"q":"I study English every day ___ I can get a better job.","opts":["so that","in order to","because of"],"a":0,"why":"+ mệnh đề có can → so that."},{"q":"She left early ___ catch the train.","opts":["in order to","so that","because"],"a":0,"why":"+ V → in order to."},{"q":"The flight was cancelled ___ the storm.","opts":["because","because of","so"],"a":1,"why":"+ danh từ → because of."},{"q":"My sister loves cats, ___ I prefer dogs.","opts":["whereas","despite","so that"],"a":0,"why":"So sánh 2 người → whereas."},{"q":"He didn't study. ___, he failed the exam.","opts":["As a result","However","Although"],"a":0,"why":"Kết quả."},{"q":"In spite of ___ tired, she finished the race.","opts":["be","being","she was"],"a":1,"why":"in spite of + V-ing."},{"q":"Which sentence is the most LOGICAL?","opts":["I was hungry, so I didn't eat.","I was hungry, but I didn't eat because I was on a diet.","I was hungry. However, I ate a lot."],"a":1,"why":"Câu 1: 'so' sai logic. Câu 3: 'However' sai logic (đói → ăn nhiều là bình thường, không đối lập)."}]},{"type":"typed","key":"T","time":"5 phút · Viết lại câu","title":"Viết lại câu","items":[{"q":"Although he was ill, he went to work. <i>(Despite)<\/i>","ans":["Despite being ill, he went to work.","Despite his illness, he went to work.","Despite the fact that he was ill, he went to work."],"why":"Despite + V-ing / danh từ."},{"q":"I saved money. I wanted to buy a laptop. <i>(in order to)<\/i>","ans":["I saved money in order to buy a laptop."],"why":"Mục đích + V."},{"q":"She speaks quietly. She doesn't want to wake the baby. <i>(so that)<\/i>","ans":["She speaks quietly so that she doesn't wake the baby.","She speaks quietly so that she won't wake the baby.","She speaks quietly so that she does not wake the baby.","She speaks quietly so that she will not wake the baby."],"why":"so that + mệnh đề."},{"q":"The film was long. It was very interesting. <i>(However)<\/i>","ans":["The film was long. However, it was very interesting."],"why":"However đầu câu thứ 2."}]},{"type":"typed","key":"E","time":"3 phút · Sửa lỗi","title":"Sửa lỗi sai","items":[{"q":"Despite it was cold, we went swimming.","ans":["Although it was cold, we went swimming.","Even though it was cold, we went swimming.","Despite the cold, we went swimming."],"why":"Despite không đi với mệnh đề."},{"q":"I went to the shop for buying milk.","ans":["I went to the shop to buy milk.","I went to the shop in order to buy milk."],"why":"Mục đích → to V."},{"q":"Although he is rich, but he is not happy.","ans":["Although he is rich, he is not happy.","He is rich, but he is not happy."],"why":"Chỉ dùng 1 từ nối."},{"q":"Because of he was late, he missed the bus.","ans":["Because he was late, he missed the bus."],"why":"+ mệnh đề → because."}]},{"type":"writing","time":"3 phút · Viết đoạn","title":"Viết đoạn văn có lập luận","hint":"5–6 câu trả lời câu hỏi: <b>Should children learn English from primary school?<\/b> Dùng ít nhất 4 từ nối: 1 đối lập, 1 nguyên nhân, 1 kết quả, 1 mục đích. Tôi sẽ chấm cả <b>logic<\/b> và <b>liên kết<\/b>.","placeholder":"In my opinion, ..."}]}},{"id":"31","title":"Participle clauses","desc":"V-ing / Having V3 / V3","data":{"id":"31","title":"Participle Clauses — rút gọn mệnh đề trạng ngữ","sub":"Giai đoạn 3 · 30 phút · V-ing / Having + V3 / V3","sections":[{"type":"mcq","key":"W","time":"3 phút · Ôn bài 30","title":"Warm-up","items":[{"q":"___ being tired, he kept working.","opts":["Despite","Although"],"a":0,"why":"+ V-ing → Despite.","tag":"linking"},{"q":"I left early ___ avoid the traffic.","opts":["to","so that"],"a":0,"why":"+ V → to.","tag":"purpose"},{"q":"Lan likes tea, ___ her husband prefers coffee.","opts":["whereas","however"],"a":0,"why":"Nối 2 vế trong 1 câu → whereas.","tag":"linking"}]},{"type":"explain","time":"7 phút · Hiểu logic","title":"Câu gọn hơn khi 2 vế CÙNG chủ ngữ","html":"\n      <p>Khi 2 vế có <b>cùng chủ ngữ<\/b>, có thể bỏ liên từ + chủ ngữ ở vế phụ và đổi động từ thành phân từ. Câu sẽ gọn và \"học thuật\" hơn.<\/p>\n      <table>\n        <tr><th>Dạng<\/th><th>Ý nghĩa<\/th><th>Ví dụ<\/th><\/tr>\n        <tr><td><b>V-ing<\/b><\/td><td>Chủ động · cùng lúc / lý do<\/td><td><s>Because I felt<\/s> <em class=\"g\">Feeling<\/em> tired, I went to bed.<\/td><\/tr>\n        <tr><td><b>Having + V3<\/b><\/td><td>Chủ động · xảy ra <b>trước<\/b><\/td><td><s>After I had finished<\/s> <em class=\"g\">Having finished<\/em> my work, I went home.<\/td><\/tr>\n        <tr><td><b>V3<\/b><\/td><td><b>Bị động<\/b><\/td><td><s>The house was built in 1900. It…<\/s> <em class=\"g\">Built<\/em> in 1900, the house…<\/td><\/tr>\n        <tr><td><b>Not + V-ing<\/b><\/td><td>Phủ định<\/td><td><em class=\"g\">Not knowing<\/em> what to do, I called my mum.<\/td><\/tr>\n      <\/table>\n      <div class=\"warn\"><b>Lỗi \"chủ ngữ treo\" (dangling participle):<\/b> chủ ngữ của vế chính PHẢI là người/vật làm hành động ở vế phân từ.<br>\n        <s>Walking to school, the rain started.<\/s> → Cơn mưa đi bộ đến trường?! ✘<br>\n        <b>Walking to school, I<\/b> got caught in the rain. ✔<\/div>\n      <div class=\"box\"><b>Liên hệ bài 20:<\/b> rút gọn mệnh đề quan hệ cũng theo logic này — chủ động → V-ing, bị động → V3.<\/div>"},{"type":"cards","time":"2 phút · Flashcards","title":"Ghi nhớ nhanh","items":[["V-ing","chủ động, cùng lúc / lý do"],["Having + V3","chủ động, xảy ra trước"],["V3","bị động"],["Not + V-ing","phủ định"],["Điều kiện bắt buộc","2 vế CÙNG chủ ngữ"]]},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"___ tired, I went to bed early.","opts":["Feeling","Felt","Having felt"],"a":0,"why":"Lý do, chủ động → V-ing."},{"q":"___ my homework, I watched TV.","opts":["Finishing","Having finished","Finished"],"a":1,"why":"Làm xong rồi mới xem TV → Having + V3."},{"q":"___ in 1902, the bridge is over 100 years old.","opts":["Building","Built","Having built"],"a":1,"why":"Cây cầu được xây → bị động → V3."},{"q":"___ the news, she started to cry.","opts":["Hearing","Heard","Being heard"],"a":0,"why":"Cô ấy nghe (chủ động) → V-ing."},{"q":"Not ___ what to do, I called my mother.","opts":["knowing","known","know"],"a":0,"why":"Not + V-ing."},{"q":"___ by his teacher, he worked harder.","opts":["Encouraging","Encouraged","Having encouraged"],"a":1,"why":"Anh ấy được khuyến khích → V3."},{"q":"Which sentence is CORRECT?","opts":["Walking to school, the rain started.","Walking to school, I got caught in the rain.","Walked to school, I got caught in the rain."],"a":1,"why":"Chủ ngữ 'I' là người đi bộ."},{"q":"___ in Hanoi for 10 years, he knows the city very well.","opts":["Living","Having lived","Lived"],"a":1,"why":"Đã sống 10 năm (trước) → biết rõ (sau) → Having + V3."}]},{"type":"typed","key":"T","time":"6 phút · Viết lại câu","title":"Rút gọn câu","items":[{"q":"Because I didn't have any money, I couldn't buy the ticket.","ans":["Not having any money, I couldn't buy the ticket.","Not having money, I couldn't buy the ticket.","Having no money, I couldn't buy the ticket.","Not having any money, I could not buy the ticket."],"why":"Phủ định → Not + V-ing."},{"q":"After she had locked the door, she went to bed.","ans":["Having locked the door, she went to bed."],"why":"Xảy ra trước → Having + V3."},{"q":"The book was written in 1950. It is still popular today.","ans":["Written in 1950, the book is still popular today."],"why":"Bị động → V3."},{"q":"While I was walking in the park, I saw an old friend.","ans":["Walking in the park, I saw an old friend.","While walking in the park, I saw an old friend."],"why":"Cùng lúc → V-ing."},{"q":"As he felt hungry, he made a sandwich.","ans":["Feeling hungry, he made a sandwich."],"why":"Lý do → V-ing."}]},{"type":"order","key":"O","time":"3 phút · Sắp xếp","title":"Sắp xếp thành câu đúng","items":[{"words":"Having lost|my keys,|I had to|call|a locksmith","why":"Having + V3: mất chìa trước, gọi thợ sau."},{"words":"Made|in Italy,|these shoes|are|very expensive","why":"Giày được làm → V3."},{"words":"Seeing|the police,|the thief|ran away","why":"Tên trộm thấy (chủ động) → V-ing."}]},{"type":"writing","time":"3 phút · Tự viết","title":"Một ngày của bạn","hint":"4 câu kể về một ngày gần đây, dùng: <b>V-ing<\/b> · <b>Having + V3<\/b> · <b>V3<\/b> (bị động) · <b>Not + V-ing<\/b>. Kiểm tra: chủ ngữ vế chính có đúng là người làm hành động không?","placeholder":"1. Having finished breakfast, I ...\n2. ...\n3. ...\n4. ..."}]}}]},{"name":"Giai đoạn 4 — Tổng hợp (tuần 12–13)","lessons":[{"id":"32","title":"Ôn tổng hợp 19–31","desc":"điều chỉnh theo lỗi của bạn","data":{"id":"32","title":"Ôn tổng hợp bài 19–31","sub":"Giai đoạn 4 · 30 phút · bản mặc định — sẽ được điều chỉnh theo nhật ký lỗi của bạn","sections":[{"type":"explain","time":"2 phút · Cách làm","title":"Bài kiểm tra tổng hợp","html":"\n      <p>Mỗi câu thuộc một bài khác nhau, được ghi ở cuối giải thích. Câu nào sai thì <b>mở lại bài đó<\/b> và đọc phần \"Hiểu logic\".<\/p>\n      <div class=\"box\">Mục tiêu: ≥ 80% đúng. Nhóm lỗi nào sai ≥ 2 câu sẽ được ôn lại trong buổi sau.<\/div>"},{"type":"mcq","key":"M","time":"10 phút · Trắc nghiệm","title":"Chọn đáp án đúng","items":[{"q":"The man ___ car was stolen called the police.","opts":["whose","who","which"],"a":0,"why":"Sở hữu → whose. (Bài 19)","tag":"19 relative"},{"q":"My sister, ___ lives in Hue, is a teacher.","opts":["who","that"],"a":0,"why":"Có dấu phẩy → không dùng that. (Bài 19)","tag":"19 relative"},{"q":"The students ___ in the library are preparing for exams.","opts":["studying","studied","are studying"],"a":0,"why":"Rút gọn chủ động → V-ing. (Bài 20)","tag":"20 reduced RC"},{"q":"I'm looking forward to ___ you.","opts":["seeing","see"],"a":0,"why":"to là giới từ → V-ing. (Bài 21)","tag":"21 gerund"},{"q":"I ___ live in the countryside, but now I live in the city.","opts":["used to","am used to"],"a":0,"why":"Quá khứ, giờ không còn. (Bài 22)","tag":"22 used to"},{"q":"Could you tell me where ___?","opts":["the station is","is the station"],"a":0,"why":"Câu gián tiếp → S + V. (Bài 23)","tag":"23 indirect Q"},{"q":"You ___ wear a uniform; it's optional.","opts":["don't have to","mustn't"],"a":0,"why":"Không cần. (Bài 24)","tag":"24 obligation"},{"q":"She's not answering. She ___ be asleep.","opts":["might","mustn't","should"],"a":0,"why":"Không chắc → might. (Bài 25)","tag":"25 deduction"},{"q":"I ___ the window. Now the room is full of mosquitoes.","opts":["shouldn't have opened","mustn't have opened","can't have opened"],"a":0,"why":"Hối tiếc → shouldn't have. (Bài 26)","tag":"26 past modals"},{"q":"I wish I ___ more confident.","opts":["were","am","would be"],"a":0,"why":"Ước hiện tại → were. (Bài 27)","tag":"27 wish"},{"q":"I need to get my passport ___.","opts":["renewed","renew","to renew"],"a":0,"why":"get sth + V3. (Bài 28)","tag":"28 causative"},{"q":"The more you read, ___ your vocabulary becomes.","opts":["the bigger","bigger","the biggest"],"a":0,"why":"The more…, the + -er. (Bài 29)","tag":"29 comparatives"},{"q":"___ the traffic, we arrived on time.","opts":["Despite","Although","However"],"a":0,"why":"+ danh từ → Despite. (Bài 30)","tag":"30 linking"},{"q":"___ the email, he closed his laptop.","opts":["Having sent","Sent","Having send"],"a":0,"why":"Xảy ra trước → Having + V3. (Bài 31)","tag":"31 participle"}]},{"type":"typed","key":"E","time":"8 phút · Sửa lỗi","title":"Sửa lỗi sai","items":[{"q":"This is the house where I bought it last year.","ans":["This is the house which I bought last year.","This is the house that I bought last year.","This is the house I bought last year."],"why":"Tân ngữ → which/that + bỏ 'it'. (Bài 19)","tag":"19 relative"},{"q":"I decided studying abroad.","ans":["I decided to study abroad."],"why":"decide + to V. (Bài 21)","tag":"21 gerund"},{"q":"I'm not used to drive on the left.","ans":["I'm not used to driving on the left.","I am not used to driving on the left."],"why":"be used to + V-ing. (Bài 22)","tag":"22 used to"},{"q":"Do you know what time is it?","ans":["Do you know what time it is?"],"why":"Câu gián tiếp → S + V. (Bài 23)","tag":"23 indirect Q"},{"q":"He must have went home.","ans":["He must have gone home."],"why":"have + V3. (Bài 26)","tag":"26 past modals"},{"q":"Although it was late but she kept working.","ans":["Although it was late, she kept working.","It was late, but she kept working."],"why":"Chỉ 1 từ nối. (Bài 30)","tag":"30 linking"}]},{"type":"writing","time":"10 phút · Viết đoạn","title":"Một thay đổi trong cuộc sống của tôi","hint":"Viết 6–8 câu về một thay đổi lớn trong cuộc sống của bạn (chuyển nhà, đổi việc, học điều mới…). Dùng ít nhất <b>5 cấu trúc<\/b> khác nhau từ bài 19–31 và <b>gạch chân/ghi chú<\/b> chúng bằng [ngoặc vuông].","placeholder":"Two years ago, I [used to] ..."}]}},{"id":"33","title":"Bài viết tổng hợp","desc":"ngữ pháp + logic + liên kết","data":{"id":"33","title":"Bài viết tổng hợp — ngữ pháp + logic + liên kết","sub":"Giai đoạn 4 · 30 phút · từ câu đúng đến đoạn văn hay","sections":[{"type":"explain","time":"6 phút · Hiểu logic","title":"Một đoạn văn tốt gồm những gì?","html":"\n      <table>\n        <tr><th>Phần<\/th><th>Nhiệm vụ<\/th><\/tr>\n        <tr><td><b>Câu chủ đề<\/b><\/td><td>Nói rõ ý chính của cả đoạn — người đọc biết ngay đoạn văn nói về gì.<\/td><\/tr>\n        <tr><td><b>Ý hỗ trợ (2–3)<\/b><\/td><td>Mỗi ý có lý do hoặc ví dụ. Mọi câu phải phục vụ ý chính.<\/td><\/tr>\n        <tr><td><b>Từ nối<\/b><\/td><td>Chỉ rõ quan hệ: First, In addition, However, As a result… (bài 30)<\/td><\/tr>\n        <tr><td><b>Kết luận<\/b><\/td><td>Nhắc lại ý chính bằng cách nói khác.<\/td><\/tr>\n      <\/table>\n      <div class=\"box\"><b>Đoạn mẫu:<\/b><br>\n        <u>Cycling to work has several important benefits.<\/u> <b>First,<\/b> it is a free form of exercise <i>which<\/i> keeps you healthy. <b>In addition,<\/b> cyclists don't have to pay for petrol or parking, <i>so<\/i> they save money. <b>However,<\/b> cycling in big cities can be dangerous, <i>so<\/i> riders should always wear a helmet. <b>Overall,<\/b> the more people cycle, the cleaner and healthier our cities will become.<\/div>\n      <div class=\"warn\"><b>Checklist tự sửa trước khi nộp:<\/b><br>\n        ☐ Mỗi câu có chủ ngữ + động từ? ☐ Thì động từ đúng? ☐ Không có câu lạc đề?<br>\n        ☐ Từ nối đúng logic (không \"Although… but\")? ☐ Không lặp một từ quá nhiều lần?<\/div>"},{"type":"mcq","key":"M","time":"6 phút · Trắc nghiệm","title":"Logic & diễn đạt tự nhiên","items":[{"q":"Which is the best topic sentence for a paragraph about the benefits of cycling to work?","opts":["I have a bike.","Cycling to work has several important benefits for both health and the environment.","Cars are expensive."],"a":1,"why":"Câu chủ đề phải bao quát ý chính của cả đoạn.","tag":"clarity"},{"q":"Cycling is healthy. ___, it is cheaper than driving.","opts":["Moreover","However","Although"],"a":0,"why":"2 lợi ích cùng chiều → bổ sung.","tag":"cohesion"},{"q":"Which conclusion fits best?","opts":["In conclusion, cycling to work is a simple way to stay healthy and save money.","In conclusion, I like cars.","In conclusion, bikes have two wheels."],"a":0,"why":"Kết luận nhắc lại ý chính.","tag":"logic"},{"q":"Which sentence does NOT belong in a paragraph about why remote work is popular?","opts":["Workers save time on commuting.","Companies can save money on offices.","My favourite food is pho."],"a":2,"why":"Lạc đề.","tag":"logic"},{"q":"Choose the most natural sentence:","opts":["I very like learning English.","I really like learning English.","I like very much learning English."],"a":1,"why":"very không đứng trước động từ; very much đặt sau tân ngữ.","tag":"naturalness"},{"q":"Choose the clearest sentence:","opts":["Because traffic, I late.","I was late because of the heavy traffic.","The traffic made late me."],"a":1,"why":"Đủ chủ ngữ, động từ; because of + danh từ.","tag":"clarity"}]},{"type":"order","key":"O","time":"4 phút · Sắp xếp đoạn văn","title":"Sắp xếp các câu thành đoạn văn logic","hint":"Mỗi ô là một câu. Hãy tìm câu chủ đề → các ý hỗ trợ → kết luận.","items":[{"prompt":"Đoạn văn: Learning English","words":"Learning English has changed my life in many ways.|First, I can now read news and articles from all over the world.|In addition, I have made friends with people from different countries.|However, it has not always been easy, because grammar used to confuse me.|Overall, the effort has been worth it.","why":"Câu chủ đề → First → In addition → However (mặt khó khăn) → Overall (kết luận)."}]},{"type":"typed","key":"E","time":"4 phút · Sửa lỗi","title":"Sửa lỗi trong câu (nhiều chủ đề)","items":[{"q":"Although I studied hard, but I didn't pass.","ans":["Although I studied hard, I didn't pass.","I studied hard, but I didn't pass.","Although I studied hard, I did not pass."],"why":"Chỉ 1 từ nối.","tag":"cohesion"},{"q":"The teacher who she taught me English was very patient.","ans":["The teacher who taught me English was very patient.","The teacher that taught me English was very patient."],"why":"Thừa 'she'.","tag":"relative"},{"q":"I wish I can speak English fluently.","ans":["I wish I could speak English fluently."],"why":"wish + could.","tag":"wish"}]},{"type":"writing","time":"10 phút · Viết đoạn","title":"Bài viết cuối khoá","hint":"120–150 từ: <b>The biggest challenge of learning English and how I deal with it.<\/b><br>Yêu cầu: câu chủ đề rõ ràng · 2–3 ý hỗ trợ có ví dụ · ít nhất 4 từ nối · ít nhất 5 cấu trúc từ bài 19–31 · câu kết luận. Dùng checklist ở trên để tự sửa trước khi copy kết quả.","placeholder":"For me, the biggest challenge of learning English is ..."}]}}]}]};</script>
<script>
(function () {
  const COURSE = window.COURSE;
  const LESSONS = {};
  COURSE.phases.forEach(p => p.lessons.forEach(l => { LESSONS[l.id] = l; }));
  const app = document.getElementById("app");

  const norm = s => s.toLowerCase().replace(/[’']/g, "").replace(/[.,!?;:"“”]/g, "").replace(/\s+/g, " ").trim();
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  const shuffle = a => {
    const orig = a.join("|");
    for (let t = 0; t < 10; t++) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      if (a.join("|") !== orig) break;
    }
    return a;
  };
  const clone = o => JSON.parse(JSON.stringify(o));
  const deepMerge = (t, p) => {
    for (const k in p) {
      if (p[k] && typeof p[k] === "object" && !Array.isArray(p[k]) && t[k] && typeof t[k] === "object") deepMerge(t[k], p[k]);
      else t[k] = p[k];
    }
    return t;
  };
  const local = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const totalOf = lesson => lesson.data.sections.reduce((n, s) => n + (s.key ? s.items.length : 0), 0);
  const hashFor = id => "bai-" + id;

  // ---- persistence: the artifact's db (synced to the account) when available, else this browser ----
  const store = { db: null, docs: {}, exists: {}, pending: {}, timers: {}, busy: {}, state: "local" };
  store.ready = (async () => {
    try {
      if (window.claude && window.claude.use) {
        const db = await window.claude.use("db");
        if (db) { store.db = db; store.state = "cloud"; }
      }
    } catch (e) {}
    renderStatus();
  })();
  const ref = id => store.db.collection("results").doc(id);

  async function loadDoc(id) {
    await store.ready;
    let d = null;
    if (store.db) {
      try {
        const snap = await ref(id).get();
        store.exists[id] = snap.exists;
        if (snap.exists) d = clone(snap.data());
      } catch (e) { setState("error"); }
    }
    if (!d) d = local.get("res-" + id); // first visit in the cloud: carry over what this browser has
    d = d || { lesson: id };
    d.answers = d.answers || {};
    d.writing = d.writing || "";
    store.docs[id] = d;
    return d;
  }

  async function loadAll() {
    await store.ready;
    const out = {};
    if (store.db) {
      try {
        const q = await store.db.collection("results").get();
        q.docs.forEach(s => { out[s.id] = s.data(); });
      } catch (e) { setState("error"); }
    }
    Object.keys(LESSONS).forEach(id => { if (!out[id]) out[id] = local.get("res-" + id); });
    return out;
  }

  function save(id, patch) {
    const d = store.docs[id];
    deepMerge(d, clone(patch));
    d.updatedAt = new Date().toISOString();
    local.set("res-" + id, d);
    if (!store.db) return;
    store.pending[id] = deepMerge(store.pending[id] || {}, clone(patch));
    clearTimeout(store.timers[id]);
    store.timers[id] = setTimeout(() => flush(id), 700);
    setSaveText("Đang lưu…");
  }

  async function flush(id, retried) {
    if (store.busy[id]) { store.timers[id] = setTimeout(() => flush(id), 400); return; }
    const patch = store.pending[id];
    if (!patch) return;
    delete store.pending[id];
    patch.updatedAt = store.docs[id].updatedAt;
    store.busy[id] = true;
    try {
      if (store.exists[id]) {
        try { await ref(id).update(patch); }
        catch (e) {
          if (e && e.code === "invalid_argument") await ref(id).set(store.docs[id]); // doc was removed elsewhere
          else throw e;
        }
      } else {
        await ref(id).set(store.docs[id]);
      }
      store.exists[id] = true;
      setState("cloud");
      setSaveText("Đã lưu vào tài khoản");
    } catch (e) {
      store.pending[id] = deepMerge(patch, store.pending[id] || {});
      if (!retried && e && e.code === "unavailable") {
        store.busy[id] = false;
        setTimeout(() => flush(id, true), 1000 + Math.random() * 1000);
        return;
      }
      setState("error");
      setSaveText("Chưa lưu được lên tài khoản — bài làm vẫn được giữ trên trình duyệt này.");
    } finally {
      store.busy[id] = false;
    }
  }

  async function resetLesson(id) {
    const old = store.docs[id] || {};
    const d = { lesson: id, answers: {}, writing: "", updatedAt: new Date().toISOString() };
    if (old.feedback) d.feedback = old.feedback;
    clearTimeout(store.timers[id]);
    delete store.pending[id];
    store.docs[id] = d;
    local.set("res-" + id, d);
    if (store.db) {
      try { await ref(id).set(d); store.exists[id] = true; } catch (e) { setState("error"); }
    }
  }

  // ---- status line ----
  function setState(s) { store.state = s; renderStatus(); }
  function renderStatus() {
    const box = document.getElementById("status");
    if (!box) return;
    const text = {
      cloud: "Kết quả tự động lưu vào artifact này trên tài khoản của bạn — mở lại ở máy nào cũng còn.",
      local: "Đang lưu trên trình duyệt này (mở trong claude.ai để lưu vào tài khoản).",
      error: "Không kết nối được kho lưu trữ — bài làm tạm giữ trên trình duyệt này.",
    }[store.state];
    box.className = "status " + store.state;
    box.innerHTML = `<span class="dot"></span><span></span>`;
    box.lastChild.textContent = text;
  }
  function setSaveText(t) {
    const s = document.getElementById("saveText");
    if (s) s.textContent = t;
  }

  // ---- index ----
  async function showIndex() {
    app.innerHTML = "";
    app.appendChild(el("h1", null, "Grammar B1 → B2"));
    app.appendChild(el("p", "sub", "30 phút mỗi ngày trong 3 tháng. Mỗi câu trả lời được lưu ngay khi bạn làm. Làm xong, nhắn Claude “chấm bài 19.1” (hoặc số bài bạn vừa học)."));
    const status = el("div", "status");
    status.id = "status";
    app.appendChild(status);
    renderStatus();
    const badges = {};
    COURSE.phases.forEach(p => {
      const sec = el("section", "phase", `<h2></h2>`);
      sec.firstChild.textContent = p.name;
      p.lessons.forEach(l => {
        const a = el("a", "lesson", `<span><b></b><small></small></span><span class="badge">…</span>`);
        a.href = "#" + hashFor(l.id);
        a.querySelector("b").textContent = `${l.id}. ${l.title}`;
        a.querySelector("small").textContent = l.desc;
        badges[l.id] = a.querySelector(".badge");
        sec.appendChild(a);
      });
      app.appendChild(sec);
    });
    const all = await loadAll();
    Object.entries(badges).forEach(([id, b]) => {
      const d = all[id];
      const total = totalOf(LESSONS[id]);
      const answers = d && d.answers ? Object.values(d.answers) : [];
      const ok = answers.filter(r => r.ok).length;
      let text = "chưa làm", cls = "badge";
      if (answers.length >= total) { text = `✓ ${ok}/${total}`; cls += " done"; }
      else if (answers.length) { text = `đang làm ${answers.length}/${total}`; cls += " partial"; }
      if (d && d.feedback) text += " · có nhận xét";
      b.className = cls;
      b.textContent = text;
    });
  }

  // ---- lesson ----
  async function showLesson(id) {
    const lesson = LESSONS[id];
    const L = lesson.data;
    app.innerHTML = `<p class="sub">Đang tải bài làm…</p>`;
    window.scrollTo(0, 0);
    const doc = await loadDoc(id);
    if (location.hash !== "#" + hashFor(id)) return; // navigated away while loading

    const scored = [];
    const total = totalOf(lesson);
    const answers = doc.answers;

    app.innerHTML = "";
    const back = el("a", "back-link", "← Danh sách bài học");
    back.href = "#";
    app.appendChild(back);
    app.appendChild(el("h1", null, `Bài ${L.id} — ${L.title}`));
    app.appendChild(el("p", "sub", L.sub));
    const status = el("div", "status");
    status.id = "status";
    app.appendChild(status);
    renderStatus();

    if (doc.feedback) {
      const f = typeof doc.feedback === "string" ? { text: doc.feedback } : doc.feedback;
      const box = el("div", "feedback", `<b>Nhận xét của Claude</b><p></p>`);
      if (f.date) box.firstChild.textContent += ` · ${f.date}`;
      box.lastChild.textContent = f.text || "";
      app.appendChild(box);
    }

    function updateScore() {
      const vals = Object.values(answers);
      const ok = vals.filter(r => r.ok).length;
      const s = document.getElementById("scoreText");
      if (s) s.textContent = `Điểm: ${ok} / ${vals.length} · bài có ${total} câu`;
      return { ok, done: vals.length, total };
    }
    function fbHtml(ok, why, correct) {
      const w = why ? ` <span class="why">${why}</span>` : "";
      return ok ? `✔ Đúng!${w}` : `✘ Chưa đúng.${correct ? ` Đáp án: <b>${correct}</b>` : ""}${w}`;
    }
    function showFb(fb, ok, why, correct) {
      fb.hidden = false;
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.innerHTML = fbHtml(ok, why, correct);
    }
    function record(qid, r) {
      if (qid in answers) return; // the first attempt counts
      answers[qid] = r;
      save(id, { answers: { [qid]: r }, score: updateScore() });
    }

    const render = {
      explain(s, body) {
        body.innerHTML = s.html;
        body.querySelectorAll("table").forEach(t => {
          const w = el("div", "table-wrap");
          t.replaceWith(w);
          w.appendChild(t);
        });
      },

      cards(s, body) {
        const box = el("div", "cards");
        s.items.forEach(([f, b]) => {
          const c = el("div", "card", `<div class="card-inner"><div class="face face-front">${f}</div><div class="face face-back">${b}</div></div>`);
          c.tabIndex = 0;
          c.setAttribute("role", "button");
          const flip = () => c.classList.toggle("flipped");
          c.onclick = flip;
          c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
          box.appendChild(c);
        });
        body.appendChild(box);
      },

      mcq(s, body) {
        s.items.forEach((it, i) => {
          const qid = `${s.key}${i + 1}`;
          const div = el("div", "q", `<p><b>${i + 1}.</b> ${it.q}</p><div class="opts"></div><div class="fb" hidden></div>`);
          const opts = div.querySelector(".opts"), fb = div.querySelector(".fb");
          const buttons = it.opts.map(o => { const b = el("button", null, o); opts.appendChild(b); return b; });
          const mark = j => {
            buttons.forEach((x, k) => { x.disabled = true; if (k === it.a) x.classList.add("right"); });
            if (j !== it.a && buttons[j]) buttons[j].classList.add("wrong");
            showFb(fb, j === it.a, it.why, j === it.a ? "" : it.opts[it.a]);
          };
          buttons.forEach((b, j) => {
            b.onclick = () => {
              mark(j);
              record(qid, { ok: j === it.a, q: it.q, given: it.opts[j], correct: it.opts[it.a], tag: it.tag || "" });
            };
          });
          if (answers[qid]) mark(it.opts.indexOf(answers[qid].given));
          body.appendChild(div);
        });
      },

      typed(s, body) {
        s.items.forEach((it, i) => {
          const qid = `${s.key}${i + 1}`;
          const div = el("div", "q", `<p><b>${i + 1}.</b> ${it.q}</p>
            <div class="row"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">Kiểm tra</button></div>
            <div class="fb" hidden></div>`);
          const input = div.querySelector("input"), fb = div.querySelector(".fb");
          input.id = `in-${L.id}-${qid}`;
          if (s.short) input.className = "short";
          const accepted = it.ans.map(norm);
          const check = () => {
            if (!input.value.trim()) return;
            const ok = accepted.includes(norm(input.value));
            showFb(fb, ok, it.why, ok ? "" : it.ans[0]);
            record(qid, { ok, q: it.q.replace(/<[^>]+>/g, ""), given: input.value.trim(), correct: it.ans[0], tag: it.tag || "" });
          };
          div.querySelector("button").onclick = check;
          input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
          if (answers[qid]) {
            input.value = answers[qid].given;
            showFb(fb, answers[qid].ok, it.why, answers[qid].ok ? "" : it.ans[0]);
          }
          body.appendChild(div);
        });
      },

      // Words are given in the correct order, separated by "|"; they get shuffled.
      order(s, body) {
        s.items.forEach((it, i) => {
          const qid = `${s.key}${i + 1}`;
          const words = it.words.split("|").map(w => w.trim());
          const correct = words.join(" ");
          const accepted = [correct, ...(it.alt || [])].map(norm);
          const div = el("div", "q", `<p><b>${i + 1}.</b> ${it.prompt || "Sắp xếp thành câu đúng:"}</p>
            <div class="built"></div><div class="pool"></div>
            <div class="row"><button class="btn">Kiểm tra</button><button class="btn ghost">Làm lại</button></div>
            <div class="fb" hidden></div>`);
          const built = div.querySelector(".built"), pool = div.querySelector(".pool"), fb = div.querySelector(".fb");
          const [checkBtn, resetBtn] = div.querySelectorAll(".row button");
          let chosen = [];
          const order = shuffle(words.map((_, k) => k));
          const draw = () => {
            built.innerHTML = ""; pool.innerHTML = "";
            chosen.forEach((k, pos) => {
              const c = el("button", "chip", words[k]);
              c.onclick = () => { chosen.splice(pos, 1); draw(); };
              built.appendChild(c);
            });
            order.filter(k => !chosen.includes(k)).forEach(k => {
              const c = el("button", "chip", words[k]);
              c.onclick = () => { chosen.push(k); draw(); };
              pool.appendChild(c);
            });
          };
          checkBtn.onclick = () => {
            if (chosen.length !== words.length) return;
            const given = chosen.map(k => words[k]).join(" ");
            const ok = accepted.includes(norm(given));
            showFb(fb, ok, it.why, ok ? "" : correct);
            record(qid, { ok, q: it.prompt || "Sắp xếp câu", given, correct, chosen: chosen.slice(), tag: it.tag || "" });
          };
          resetBtn.onclick = () => { chosen = []; fb.hidden = true; draw(); };
          if (answers[qid]) {
            chosen = (answers[qid].chosen || []).filter(k => k < words.length);
            showFb(fb, answers[qid].ok, it.why, answers[qid].ok ? "" : correct);
          }
          draw();
          body.appendChild(div);
        });
      },

      writing(s, body) {
        const ta = el("textarea");
        ta.id = `writing-${L.id}`;
        ta.placeholder = s.placeholder || "Viết ở đây...";
        ta.value = doc.writing;
        let t;
        ta.addEventListener("input", () => {
          clearTimeout(t);
          t = setTimeout(() => save(id, { writing: ta.value }), 800);
        });
        body.appendChild(ta);
      },
    };

    L.sections.forEach((s, idx) => {
      const sec = el("section");
      if (s.time) sec.appendChild(el("span", "time", s.time));
      sec.appendChild(el("h2", null, `${idx + 1}. ${s.title}`));
      if (s.hint) sec.appendChild(el("p", "hint", s.hint));
      const body = el("div");
      sec.appendChild(body);
      render[s.type](s, body);
      if (s.key) scored.push({ key: s.key, title: s.title, count: s.items.length });
      app.appendChild(sec);
    });

    // reset with an in-page confirmation step
    const tools = el("div", "tools");
    const resetBtn = el("button", "btn ghost", "Làm lại bài này từ đầu");
    let armed = false;
    resetBtn.onclick = async () => {
      if (!armed) {
        armed = true;
        resetBtn.className = "btn danger";
        resetBtn.textContent = "Bấm lần nữa để xoá bài làm";
        setTimeout(() => { armed = false; resetBtn.className = "btn ghost"; resetBtn.textContent = "Làm lại bài này từ đầu"; }, 4000);
        return;
      }
      await resetLesson(id);
      showLesson(id);
    };
    tools.appendChild(resetBtn);
    app.appendChild(tools);

    const bar = el("div", "scorebar", `<div class="meta"><b id="scoreText"></b><small id="saveText"></small></div>
      <button class="btn primary" id="copyBtn">Copy kết quả</button>`);
    app.appendChild(bar);
    updateScore();
    setSaveText(store.db ? "Tự động lưu từng câu" : "Lưu trên trình duyệt này");

    document.getElementById("copyBtn").onclick = () => {
      const vals = Object.entries(answers);
      const ok = vals.filter(([, r]) => r.ok).length;
      const lines = [`KẾT QUẢ BÀI ${L.id} — ${L.title}`, `Tổng: ${ok}/${vals.length} câu đã làm`];
      scored.forEach(({ key, title, count }) => {
        const items = vals.filter(([k]) => k.replace(/\d+$/, "") === key);
        const wrong = items.filter(([, r]) => !r.ok);
        lines.push(`${title}: ${items.length - wrong.length}/${items.length}${items.length < count ? ` (bỏ ${count - items.length} câu)` : ""}`);
        wrong.forEach(([k, r]) => lines.push(`  ✘ ${k}: "${r.q}" → tôi: "${r.given}" | đúng: "${r.correct}"${r.tag ? ` [${r.tag}]` : ""}`));
      });
      const w = document.getElementById(`writing-${L.id}`);
      if (w) lines.push("", "BÀI VIẾT:", w.value.trim() || "(chưa viết)");
      const text = lines.join("\n");
      navigator.clipboard.writeText(text)
        .then(() => setSaveText("Đã copy kết quả."))
        .catch(() => {
          const ta = el("textarea");
          ta.value = text;
          bar.after(ta);
          ta.select();
          setSaveText("Không copy tự động được — hãy chọn và copy đoạn bên dưới.");
        });
    };
  }

  // ---- routing ----
  function route() {
    const m = location.hash.match(/^#bai-(.+)$/);
    if (m && LESSONS[m[1]]) showLesson(m[1]);
    else showIndex();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
