<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Lessons</title>
<link rel="stylesheet" href="lessons/assets/lesson.css">
</head>
<body>
<main id="app">
  <h1>Grammar B1 → B2</h1>
  <p class="sub">30 phút/ngày · 3 tháng · Làm xong bài → bấm "Copy kết quả" → dán vào chat để được chấm và chọn bài tiếp theo.</p>
</main>
<script>
const PHASES = [
  ["Giai đoạn 1 — Câu phức (tuần 1–4)", [
    ["19.1", "19-relative-clauses-1.html", "Relative clauses — xác định", "who / which / that / whose / where / when"],
    ["19.2", "19-relative-clauses-2.html", "Relative clauses — không xác định", "dấu phẩy, không dùng that"],
    ["20", "20-relative-clauses-advanced.html", "Relative clauses nâng cao", "bỏ đại từ, giới từ + which, rút gọn"],
    ["21", "21-gerund-infinitive.html", "Gerund vs Infinitive", "enjoy doing / decide to do / stop, remember, try"],
    ["22", "22-used-to-would.html", "Used to / would / be used to", "thói quen quá khứ vs đã quen"],
    ["23", "23-indirect-questions-tags.html", "Indirect questions & tags", "hỏi lịch sự, câu hỏi đuôi"],
  ]],
  ["Giai đoạn 2 — Modal verbs (tuần 5–7)", [
    ["24", "24-modals-obligation.html", "Modals: khả năng, bắt buộc", "can / be able to / must / have to"],
    ["25", "25-modals-deduction-present.html", "Suy luận hiện tại", "must / might / can't be"],
    ["26", "26-modals-past.html", "Suy luận & hối tiếc quá khứ", "must have / should have + V3"],
  ]],
  ["Giai đoạn 3 — Cấu trúc B2 (tuần 8–11)", [
    ["27", "27-wish-if-only.html", "Wish / If only / It's time", "ước muốn, điều không có thật"],
    ["28", "28-causative.html", "Causative", "have / get something done"],
    ["29", "29-comparatives.html", "So sánh nâng cao", "much / far, the more… the more"],
    ["30", "30-linking-words.html", "Linking words", "liên kết & lập luận"],
    ["31", "31-participle-clauses.html", "Participle clauses", "V-ing / Having V3 / V3"],
  ]],
  ["Giai đoạn 4 — Tổng hợp (tuần 12–13)", [
    ["32", "32-review-mixed.html", "Ôn tổng hợp 19–31", "điều chỉnh theo lỗi của bạn"],
    ["33", "33-writing-final.html", "Bài viết tổng hợp", "ngữ pháp + logic + liên kết"],
  ]],
];

const app = document.getElementById("app");
const getScore = id => { try { return localStorage.getItem(`score-${id}`); } catch (e) { return null; } };
PHASES.forEach(([name, lessons]) => {
  const sec = document.createElement("section");
  sec.className = "phase";
  sec.innerHTML = `<h2>${name}</h2>`;
  lessons.forEach(([id, file, title, desc]) => {
    const score = getScore(id);
    const a = document.createElement("a");
    a.className = "lesson";
    a.href = `lessons/${file}`;
    a.innerHTML = `<span><b>${id}. ${title}</b><small>${desc}</small></span>
      <span class="badge ${score ? "done" : ""}">${score ? "✔ " + score : "chưa làm"}</span>`;
    sec.appendChild(a);
  });
  app.appendChild(sec);
});
</script>
</body>
</html>
