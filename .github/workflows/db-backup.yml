# Daily encrypted backup of the Supabase database (the Free plan has no downloadable backups).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL    the "Session pooler" connection string of the project (Dashboard -> Connect), password filled in
#                      (URL-encode special characters). Not the direct db.<ref>.supabase.co host: it is IPv6 only.
#   BACKUP_PASSPHRASE  a long random passphrase; keep a copy in a password manager, without it a backup cannot be opened.
#
# Result: an artifact "db-backup-YYYY-MM-DD" (backup-YYYY-MM-DD.tar.gpg) on the run page, kept for 30 days. Every table that holds data:
#   public.dump      schema "public" + "private" (tables, data, RLS policies, functions, triggers)
#   auth.dump        data of every auth table (accounts with password hashes, identities, sessions, refresh tokens, MFA)
#   storage.dump     data of the storage tables (buckets and object metadata; the files themselves are not in the database)
#   migrations.dump  supabase_migrations.schema_migrations (the history of applied migrations, with their SQL)
#   cron-jobs.sql    the pg_cron job definitions as SQL (pg_cron's own run log is left out)
# Left out on purpose: auth/storage/realtime schema_migrations (Supabase manages them, restoring would clash) and cron.job_run_details.
# The archive is encrypted with the passphrase, so it stays unreadable even if the repository is public.
#
# Open a backup (macOS has no gpg: use Docker, or `brew install gnupg` and `gpg -d FILE | tar -x`):
#   docker run --rm -it -v "$PWD":/w alpine sh -c 'apk add -q gnupg && gpg -d /w/backup-2026-10-23.tar.gpg | tar -x -C /w'
# Restore into a NEW Supabase project: see web/supabase/RESTORE.md. Tested with web/supabase/backup-test.sh: the restored copy matched
# production on every table, 56 policies, 36 functions, 9 triggers, 50 indexes and the checksums of lesson content and migration history.
name: db-backup

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 02:00 in Vietnam
  workflow_dispatch: {} # "Run workflow" button, to try it or to take a backup before a risky change

permissions: {}

concurrency: db-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client (the server runs 17)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and encrypt
        id: dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Set the repository secrets SUPABASE_DB_URL and BACKUP_PASSPHRASE first."
            exit 1
          fi
          PG=/usr/lib/postgresql/17/bin
          stamp=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          echo "date=$stamp" >> "$GITHUB_OUTPUT"
          mkdir out

          # schema + data of the app; "private" holds the helper functions the RLS policies call
          "$PG/pg_dump" "$DB_URL" --schema=public --schema=private --no-owner --no-privileges --format=custom --file=out/public.dump
          # everything else that holds data (each dump skips the tables Supabase manages itself)
          "$PG/pg_dump" "$DB_URL" --data-only --schema=auth --exclude-table-data=auth.schema_migrations --no-owner --no-privileges --format=custom --file=out/auth.dump
          "$PG/pg_dump" "$DB_URL" --data-only --schema=storage --exclude-table-data=storage.migrations --no-owner --no-privileges --format=custom --file=out/storage.dump
          "$PG/pg_dump" "$DB_URL" --data-only --table=supabase_migrations.schema_migrations --no-owner --no-privileges --format=custom --file=out/migrations.dump
          # pg_cron jobs live in schema cron, which a dump of the app does not carry: save them as SQL to run again after a restore
          "$PG/psql" "$DB_URL" -At -c 'select case when jobname is null then format($q$select cron.schedule(%L, %L);$q$, schedule, command) else format($q$select cron.schedule(%L, %L, %L);$q$, jobname, schedule, command) end from cron.job order by jobid' > out/cron-jobs.sql

          # refuse to publish an empty dump as if it were a backup
          check_size() { # file, minimum bytes (a real public.dump is ~220 KB, auth.dump ~5 KB)
            size=$(stat -c%s "$1")
            echo "$1: $size bytes"
            [ "$size" -gt "$2" ] || { echo "::error::$1 is suspiciously small"; exit 1; }
          }
          check_size out/public.dump 50000
          check_size out/auth.dump 1000
          check_size out/migrations.dump 1000
          "$PG/pg_restore" --list out/public.dump | grep -c "TABLE DATA" | xargs echo "tables with data:"

          tar -C out -cf - . \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 \
                  --output "backup-$stamp.tar.gpg"
          ls -l backup-*.tar.gpg

      - name: Keep the encrypted backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-backup-${{ steps.dump.outputs.date }}
          path: backup-*.tar.gpg
          retention-days: 30
          if-no-files-found: error
