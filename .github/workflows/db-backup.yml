name: db-backup

# Backup hằng ngày lúc 02:00 giờ Việt Nam (19:00 UTC hôm trước).
# GitHub chỉ chạy lịch từ nhánh mặc định (main).
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Server Supabase đang là PostgreSQL 17.x, pg_dump phải cùng major version.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M)
          # public = dữ liệu app, auth = tài khoản người dùng
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file=backup.dump
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "backup-$STAMP.dump.gpg" backup.dump
          rm -f backup.dump
          ls -lh backup-*.dump.gpg
          echo "BACKUP_FILE=backup-$STAMP.dump.gpg" >> "$GITHUB_ENV"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
